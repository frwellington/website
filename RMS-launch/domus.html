riest and an exorcist martyred in Rome in 304, under Diocletian. Both are named in the Roman Canon.","es":"Un sacerdote y un exorcista martirizados en Roma en el año 304, bajo Diocleciano. Ambos son nombrados en el Canon Romano.","pt":"Um sacerdote e um exorcista martirizados em Roma em 304, sob Diocleciano. Ambos são nomeados no Cânon Romano.","it":"Un sacerdote e un esorcista martirizzati a Roma nel 304, sotto Diocleziano. Entrambi sono nominati nel Canone Romano."},"06-03":{"en":"Young Christians at the royal court of Buganda, in today's Uganda, martyred in 1886 for refusing to renounce Christ. Patrons of African youth.","es":"Jóvenes cristianos de la corte real de Buganda, en la actual Uganda, martirizados en 1886 por negarse a renegar de Cristo. Patronos de la juventud africana.","pt":"Jovens cristãos da corte real de Buganda, na atual Uganda, martirizados em 1886 por se recusarem a renegar Cristo. Padroeiros da juventude africana.","it":"Giovani cristiani della corte reale del Buganda, nell'attuale Uganda, martirizzati nel 1886 per essersi rifiutati di rinnegare Cristo. Patroni della gioventù africana."},"06-05":{"en":"English Benedictine, the Apostle of Germany and Archbishop of Mainz, martyred in Frisia in 754.","es":"Benedictino inglés, Apóstol de Alemania y arzobispo de Maguncia, martirizado en Frisia en el año 754.","pt":"Beneditino inglês, Apóstolo da Alemanha e arcebispo de Mainz, martirizado na Frísia em 754.","it":"Benedettino inglese, Apostolo della Germania e arcivescovo di Magonza, martirizzato in Frisia nel 754."},"06-06":{"en":"A German nobleman converted from worldly life, founder of the Premonstratensians and Archbishop of Magdeburg. He died in 1134.","es":"Noble alemán convertido de la vida mundana, fundador de los premonstratenses y arzobispo de Magdeburgo. Murió en 1134.","pt":"Nobre alemão convertido da vida mundana, fundador dos premonstratenses e arcebispo de Magdeburgo. Morreu em 1134.","it":"Nobile tedesco convertito dalla vita mondana, fondatore dei premostratensi e arcivescovo di Magdeburgo. Morì nel 1134."},"06-09":{"en":"Deacon of Syria, called the \"Harp of the Holy Spirit,\" whose hymns taught the faith. He died in 373 and is a Doctor of the Church.","es":"Diácono de Siria, llamado \"Arpa del Espíritu Santo\", cuyos himnos enseñaban la fe. Murió en el año 373 y es Doctor de la Iglesia.","pt":"Diácono da Síria, chamado \"Harpa do Espírito Santo\", cujos hinos ensinavam a fé. Morreu em 373 e é Doutor da Igreja.","it":"Diacono di Siria, chiamato \"Cetra dello Spirito Santo\", i cui inni insegnavano la fede. Morì nel 373 ed è Dottore della Chiesa."},"06-11":{"en":"A Levite from Cyprus, \"a good man, full of the Holy Spirit and of faith,\" who introduced Paul to the Apostles and traveled with him on mission.","es":"Levita de Chipre, \"hombre bueno, lleno de Espíritu Santo y de fe\", que presentó a Pablo a los Apóstoles y lo acompañó en la misión.","pt":"Levita de Chipre, \"homem bom, cheio do Espírito Santo e de fé\", que apresentou Paulo aos Apóstolos e o acompanhou na missão.","it":"Levita di Cipro, \"uomo virtuoso, pieno di Spirito Santo e di fede\", che presentò Paolo agli Apostoli e lo accompagnò nella missione."},"06-13":{"en":"Portuguese Franciscan, powerful preacher and Doctor of the Church, who died in Padua in 1231. He is invoked to find what is lost.","es":"Franciscano portugués, gran predicador y Doctor de la Iglesia, que murió en Padua en 1231. Se le invoca para encontrar lo perdido.","pt":"Franciscano português nascido em Lisboa, grande pregador e Doutor da Igreja, que morreu em Pádua em 1231. É invocado para encontrar o que se perdeu.","it":"Francescano portoghese, grande predicatore e Dottore della Chiesa, morto a Padova nel 1231. È invocato per ritrovare ciò che si è perduto."},"06-19":{"en":"Benedictine monk who founded the Camaldolese, uniting the hermit life with life in community. He died in 1027.","es":"Monje benedictino que fundó los camaldulenses, uniendo la vida eremítica con la vida en comunidad. Murió en 1027.","pt":"Monge beneditino que fundou os camaldulenses, unindo a vida eremítica à vida em comunidade. Morreu em 1027.","it":"Monaco benedettino che fondò i camaldolesi, unendo la vita eremitica alla vita in comunità. Morì nel 1027."},"06-21":{"en":"An Italian nobleman who renounced his inheritance to become a Jesuit; he died in 1591, at twenty-three, after caring for plague victims in Rome. Patron of youth.","es":"Noble italiano que renunció a su herencia para hacerse jesuita; murió en 1591, a los veintitrés años, tras cuidar a los enfermos de peste en Roma. Patrono de la juventud.","pt":"Nobre italiano que renunciou à herança para tornar-se jesuíta; morreu em 1591, aos vinte e três anos, depois de cuidar dos doentes de peste em Roma. Padroeiro da juventude.","it":"Nobile italiano che rinunciò all'eredità per diventare gesuita; morì nel 1591, a ventitré anni, dopo aver assistito gli appestati a Roma. Patrono della gioventù."},"06-22":{"en":"Paulinus, a Roman senator who became bishop of Nola, died in 431. John Fisher, bishop of Rochester, and Thomas More, Chancellor of England, were beheaded in 1535 for their fidelity to the Church.","es":"Paulino, senador romano que llegó a ser obispo de Nola, murió en el año 431. Juan Fisher, obispo de Rochester, y Tomás Moro, canciller de Inglaterra, fueron decapitados en 1535 por su fidelidad a la Iglesia.","pt":"Paulino, senador romano que se tornou bispo de Nola, morreu em 431. João Fisher, bispo de Rochester, e Tomás Morus, chanceler da Inglaterra, foram decapitados em 1535 por sua fidelidade à Igreja.","it":"Paolino, senatore romano divenuto vescovo di Nola, morì nel 431. Giovanni Fisher, vescovo di Rochester, e Tommaso Moro, cancelliere d'Inghilterra, furono decapitati nel 1535 per la loro fedeltà alla Chiesa."},"06-24":{"en":"The forerunner of the Lord is born to Zechariah and Elizabeth. \"His name is John\": he will prepare the way of the Lord.","es":"Nace de Zacarías e Isabel el precursor del Señor. \"Juan es su nombre\": él preparará el camino del Señor.","pt":"Nasce de Zacarias e Isabel o precursor do Senhor. \"João é o seu nome\": ele preparará o caminho do Senhor.","it":"Da Zaccaria ed Elisabetta nasce il precursore del Signore. \"Giovanni è il suo nome\": egli preparerà la via del Signore."},"06-27":{"en":"Patriarch of Alexandria and Doctor of the Church, who upheld at the Council of Ephesus that Mary is Mother of God. He died in 444.","es":"Patriarca de Alejandría y Doctor de la Iglesia, que sostuvo en el Concilio de Éfeso que María es Madre de Dios. Murió en el año 444.","pt":"Patriarca de Alexandria e Doutor da Igreja, que sustentou no Concílio de Éfeso que Maria é Mãe de Deus. Morreu em 444.","it":"Patriarca di Alessandria e Dottore della Chiesa, che sostenne al Concilio di Efeso che Maria è Madre di Dio. Morì nel 444."},"06-28":{"en":"Bishop of Lyons and disciple of Polycarp, who defended the apostolic faith against the Gnostics. \"The glory of God is man fully alive.\" Doctor of the Church.","es":"Obispo de Lyon y discípulo de Policarpo, que defendió la fe apostólica frente a los gnósticos. \"La gloria de Dios es el hombre viviente\". Doctor de la Iglesia.","pt":"Bispo de Lyon e discípulo de Policarpo, que defendeu a fé apostólica contra os gnósticos. \"A glória de Deus é o homem vivo\". Doutor da Igreja.","it":"Vescovo di Lione e discepolo di Policarpo, che difese la fede apostolica contro gli gnostici. \"La gloria di Dio è l'uomo vivente\". Dottore della Chiesa."},"06-29":{"en":"The two pillars of the Church of Rome, the fisherman and the Apostle of the Nations, martyred under Nero. New archbishops receive the pallium on this day.","es":"Las dos columnas de la Iglesia de Roma, el pescador y el Apóstol de las gentes, martirizados bajo Nerón. En este día los nuevos arzobispos reciben el palio.","pt":"As duas colunas da Igreja de Roma, o pescador e o Apóstolo dos gentios, martirizados sob Nero. Neste dia os novos arcebispos recebem o pálio.","it":"Le due colonne della Chiesa di Roma, il pescatore e l'Apostolo delle genti, martirizzati sotto Nerone. In questo giorno i nuovi arcivescovi ricevono il pallio."},"06-30":{"en":"The Christians of Rome put to death under Nero after the great fire of the year 64.","es":"Los cristianos de Roma condenados a muerte por Nerón tras el gran incendio del año 64.","pt":"Os cristãos de Roma condenados à morte por Nero depois do grande incêndio do ano 64.","it":"I cristiani di Roma messi a morte da Nerone dopo il grande incendio dell'anno 64."},"07-01":{"en":"Franciscan from Mallorca who founded the missions of California. He died in 1784 and was canonized by Pope Francis in Washington in 2015.","es":"Franciscano de Mallorca que fundó las misiones de California. Murió en 1784 y fue canonizado por el papa Francisco en Washington en 2015.","pt":"Franciscano de Maiorca que fundou as missões da Califórnia. Morreu em 1784 e foi canonizado pelo papa Francisco em Washington em 2015.","it":"Francescano di Maiorca che fondò le missioni della California. Morì nel 1784 e fu canonizzato da papa Francesco a Washington nel 2015."},"07-03":{"en":"The Apostle who doubted, then confessed, \"My Lord and my God!\" Tradition holds that he brought the Gospel as far as India.","es":"El Apóstol que dudó y después confesó: \"¡Señor mío y Dios mío!\". Según la tradición, llevó el Evangelio hasta la India.","pt":"O Apóstolo que duvidou e depois confessou: \"Meu Senhor e meu Deus!\". Segundo a tradição, levou o Evangelho até a Índia.","it":"L'Apostolo che dubitò e poi confessò: \"Mio Signore e mio Dio!\". Secondo la tradizione, portò il Vangelo fino in India."},"07-04":{"en":"In the United States, a day to give thanks for the gift of liberty and to pray for the nation, that it may live in justice and peace.","es":"En los Estados Unidos, día para dar gracias por el don de la libertad y orar por la nación, para que viva en la justicia y la paz.","pt":"Nos Estados Unidos, dia de dar graças pelo dom da liberdade e de rezar pela nação, para que viva na justiça e na paz.","it":"Negli Stati Uniti, giorno per rendere grazie del dono della libertà e pregare per la nazione, perché viva nella giustizia e nella pace."},"07-05":{"en":"Anthony Zaccaria, a physician who became a priest, founded the Barnabites and died in 1539. Elizabeth, Queen of Portugal, was a peacemaker and a servant of the poor; she died in 1336.","es":"Antonio María Zaccaria, médico que se hizo sacerdote, fundó los barnabitas y murió en 1539. Isabel, reina de Portugal, fue pacificadora y servidora de los pobres; murió en 1336.","pt":"Antônio Maria Zaccaria, médico que se tornou sacerdote, fundou os barnabitas e morreu em 1539. Isabel, rainha de Portugal, foi pacificadora e serva dos pobres; morreu em 1336.","it":"Antonio Maria Zaccaria, medico divenuto sacerdote, fondò i barnabiti e morì nel 1539. Elisabetta, regina del Portogallo, fu operatrice di pace e serva dei poveri; morì nel 1336."},"07-06":{"en":"An Italian girl of eleven, killed in 1902 while resisting an assault, who forgave her attacker before dying. He later converted.","es":"Niña italiana de once años, asesinada en 1902 al resistir una agresión, que perdonó a su agresor antes de morir. Él se convirtió más tarde.","pt":"Menina italiana de onze anos, assassinada em 1902 ao resistir a uma agressão, que perdoou o agressor antes de morrer. Ele mais tarde se converteu.","it":"Ragazza italiana di undici anni, uccisa nel 1902 mentre resisteva a un'aggressione, che perdonò il suo aggressore prima di morire. Egli in seguito si convertì."},"07-09":{"en":"Augustine Zhao Rong, a Chinese priest, and his companions, 120 martyrs who gave their lives in China between 1648 and 1930.","es":"Agustín Zhao Rong, sacerdote chino, y sus compañeros, 120 mártires que dieron la vida en China entre 1648 y 1930.","pt":"Agostinho Zhao Rong, sacerdote chinês, e seus companheiros, 120 mártires que deram a vida na China entre 1648 e 1930.","it":"Agostino Zhao Rong, sacerdote cinese, e i suoi compagni, 120 martiri che diedero la vita in Cina tra il 1648 e il 1930."},"07-11":{"en":"Father of Western monasticism, whose Rule of prayer and work shaped Christian Europe. He died around 547 and is patron of Europe.","es":"Padre del monacato de Occidente, cuya Regla de oración y trabajo forjó la Europa cristiana. Murió hacia el año 547 y es patrono de Europa.","pt":"Pai do monaquismo ocidental, cuja Regra de oração e trabalho moldou a Europa cristã. Morreu por volta de 547 e é padroeiro da Europa.","it":"Padre del monachesimo d'Occidente, la cui Regola di preghiera e lavoro plasmò l'Europa cristiana. Morì verso il 547 ed è patrono d'Europa."},"07-13":{"en":"Holy Roman Emperor who supported the reform of the Church and founded the diocese of Bamberg. He died in 1024.","es":"Emperador del Sacro Imperio que apoyó la reforma de la Iglesia y fundó la diócesis de Bamberg. Murió en 1024.","pt":"Imperador do Sacro Império que apoiou a reforma da Igreja e fundou a diocese de Bamberg. Morreu em 1024.","it":"Imperatore del Sacro Romano Impero che sostenne la riforma della Chiesa e fondò la diocesi di Bamberga. Morì nel 1024."},"07-14":{"en":"Mohawk and Algonquin maiden baptized at twenty, faithful to Christ despite hostility. The \"Lily of the Mohawks,\" she died in 1680, the first Native American saint.","es":"Joven mohawk y algonquina, bautizada a los veinte años, fiel a Cristo a pesar de la hostilidad. El \"Lirio de los Mohawks\" murió en 1680; es la primera santa indígena de Norteamérica.","pt":"Jovem moicana e algonquina, batizada aos vinte anos, fiel a Cristo apesar da hostilidade. O \"Lírio dos Moicanos\" morreu em 1680; é a primeira santa indígena da América do Norte.","it":"Giovane mohawk e algonchina, battezzata a vent'anni, fedele a Cristo nonostante l'ostilità. Il \"Giglio dei Mohawk\" morì nel 1680; è la prima santa nativa del Nord America."},"07-15":{"en":"Franciscan theologian, Minister General of his Order and cardinal, the \"Seraphic Doctor.\" He died in 1274.","es":"Teólogo franciscano, Ministro General de su Orden y cardenal, el \"Doctor Seráfico\". Murió en 1274.","pt":"Teólogo franciscano, Ministro-Geral de sua Ordem e cardeal, o \"Doutor Seráfico\". Morreu em 1274.","it":"Teologo francescano, Ministro Generale del suo Ordine e cardinale, il \"Dottore Serafico\". Morì nel 1274."},"07-16":{"en":"Patroness of the Carmelite Order, born among hermits on Mount Carmel. The brown scapular is the sign of devotion to her.","es":"Patrona de la Orden del Carmen, nacida entre los ermitaños del Monte Carmelo. El escapulario marrón es el signo de la devoción a ella.","pt":"Padroeira da Ordem do Carmo, nascida entre os eremitas do Monte Carmelo. O escapulário marrom é o sinal da devoção a ela.","it":"Patrona dell'Ordine Carmelitano, nato tra gli eremiti del Monte Carmelo. Lo scapolare marrone è il segno della devozione a lei."},"07-18":{"en":"A former soldier and gambler who founded the Ministers of the Sick. He died in 1614 and is patron of the sick, nurses and hospitals.","es":"Antiguo soldado y jugador que fundó los Ministros de los Enfermos. Murió en 1614 y es patrono de los enfermos, los enfermeros y los hospitales.","pt":"Antigo soldado e jogador que fundou os Ministros dos Enfermos. Morreu em 1614 e é padroeiro dos doentes, dos enfermeiros e dos hospitais.","it":"Ex soldato e giocatore che fondò i Ministri degli Infermi. Morì nel 1614 ed è patrono dei malati, degli infermieri e degli ospedali."},"07-20":{"en":"First bishop of Ravenna, honored from ancient times as a martyr.","es":"Primer obispo de Rávena, honrado desde la antigüedad como mártir.","pt":"Primeiro bispo de Ravena, honrado desde a antiguidade como mártir.","it":"Primo vescovo di Ravenna, onorato fin dall'antichità come martire."},"07-21":{"en":"Capuchin preacher and scholar, a gifted linguist and Doctor of the Church. He died in 1619.","es":"Predicador y erudito capuchino, gran conocedor de lenguas y Doctor de la Iglesia. Murió en 1619.","pt":"Pregador e erudito capuchinho, grande conhecedor de línguas e Doutor da Igreja. Morreu em 1619.","it":"Predicatore ed erudito cappuccino, grande conoscitore di lingue e Dottore della Chiesa. Morì nel 1619."},"07-22":{"en":"Freed by Jesus, she followed him to the cross and was the first to see the risen Lord: the \"Apostle of the Apostles.\" Her day was raised to a feast in 2016.","es":"Liberada por Jesús, lo siguió hasta la cruz y fue la primera en ver al Señor resucitado: la \"Apóstol de los Apóstoles\". Su día fue elevado a fiesta en 2016.","pt":"Libertada por Jesus, seguiu-o até a cruz e foi a primeira a ver o Senhor ressuscitado: a \"Apóstola dos Apóstolos\". Seu dia foi elevado a festa em 2016.","it":"Liberata da Gesù, lo seguì fino alla croce e fu la prima a vedere il Signore risorto: l'\"Apostola degli Apostoli\". La sua memoria fu elevata a festa nel 2016."},"07-23":{"en":"Swedish noblewoman, mother of eight, mystic and founder of the Order of the Most Holy Savior. She died in 1373 and is co-patron of Europe.","es":"Noble sueca, madre de ocho hijos, mística y fundadora de la Orden del Santísimo Salvador. Murió en 1373 y es copatrona de Europa.","pt":"Nobre sueca, mãe de oito filhos, mística e fundadora da Ordem do Santíssimo Salvador. Morreu em 1373 e é copadroeira da Europa.","it":"Nobile svedese, madre di otto figli, mistica e fondatrice dell'Ordine del Santissimo Salvatore. Morì nel 1373 ed è compatrona d'Europa."},"07-24":{"en":"Maronite monk and hermit of Lebanon, known for prayer and silence. He died in 1898, and countless healings are attributed to his intercession.","es":"Monje y ermitaño maronita del Líbano, conocido por su oración y su silencio. Murió en 1898, y se atribuyen a su intercesión innumerables curaciones.","pt":"Monge e eremita maronita do Líbano, conhecido pela oração e pelo silêncio. Morreu em 1898, e inúmeras curas são atribuídas à sua intercessão.","it":"Monaco ed eremita maronita del Libano, noto per la preghiera e il silenzio. Morì nel 1898, e innumerevoli guarigioni sono attribuite alla sua intercessione."},"07-25":{"en":"Son of Zebedee and brother of John, the first of the Apostles to give his life for Christ. He is venerated at Santiago de Compostela.","es":"Hijo de Zebedeo y hermano de Juan, el primero de los Apóstoles en dar la vida por Cristo. Es venerado en Santiago de Compostela.","pt":"Filho de Zebedeu e irmão de João, o primeiro dos Apóstolos a dar a vida por Cristo. É venerado em Santiago de Compostela.","it":"Figlio di Zebedeo e fratello di Giovanni, il primo degli Apostoli a dare la vita per Cristo. È venerato a Santiago de Compostela."},"07-26":{"en":"According to ancient tradition, the parents of the Virgin Mary and grandparents of Jesus.","es":"Según una antigua tradición, los padres de la Virgen María y abuelos de Jesús.","pt":"Segundo uma antiga tradição, os pais da Virgem Maria e avós de Jesus.","it":"Secondo un'antica tradizione, i genitori della Vergine Maria e nonni di Gesù."},"07-29":{"en":"Friends of Jesus who welcomed him into their home at Bethany; Lazarus was raised from the dead. In 2021 the three were joined in one memorial.","es":"Amigos de Jesús que lo acogieron en su casa de Betania; Lázaro fue resucitado de entre los muertos. En 2021 los tres fueron unidos en una sola memoria.","pt":"Amigos de Jesus que o acolheram em sua casa em Betânia; Lázaro foi ressuscitado dos mortos. Em 2021 os três foram unidos numa só memória.","it":"Amici di Gesù che lo accolsero nella loro casa di Betania; Lazzaro fu risuscitato dai morti. Nel 2021 i tre furono uniti in un'unica memoria."},"07-30":{"en":"Bishop of Ravenna, whose eloquent sermons earned him the name \"Golden Word.\" He died around 450 and is a Doctor of the Church.","es":"Obispo de Rávena, cuyos elocuentes sermones le valieron el nombre de \"Palabra de Oro\". Murió hacia el año 450 y es Doctor de la Iglesia.","pt":"Bispo de Ravena, cujos sermões eloquentes lhe valeram o nome de \"Palavra de Ouro\". Morreu por volta de 450 e é Doutor da Igreja.","it":"Vescovo di Ravenna, i cui sermoni eloquenti gli valsero il nome di \"Parola d'oro\". Morì verso il 450 ed è Dottore della Chiesa."},"07-31":{"en":"A Basque soldier converted while recovering from a wound, founder of the Society of Jesus and author of the Spiritual Exercises. He died in 1556.","es":"Soldado vasco convertido mientras se recuperaba de una herida, fundador de la Compañía de Jesús y autor de los Ejercicios Espirituales. Murió en 1556.","pt":"Soldado basco convertido enquanto se recuperava de um ferimento, fundador da Companhia de Jesus e autor dos Exercícios Espirituais. Morreu em 1556.","it":"Soldato basco convertito mentre si riprendeva da una ferita, fondatore della Compagnia di Gesù e autore degli Esercizi Spirituali. Morì nel 1556."},"08-01":{"en":"Neapolitan lawyer turned priest, founder of the Redemptorists, bishop and Doctor of the Church. He died in 1787 and is patron of confessors and moral theologians.","es":"Abogado napolitano que se hizo sacerdote, fundador de los redentoristas, obispo y Doctor de la Iglesia. Murió en 1787 y es patrono de los confesores y de los moralistas.","pt":"Advogado napolitano que se tornou sacerdote, fundador dos redentoristas, bispo e Doutor da Igreja. Morreu em 1787 e é padroeiro dos confessores e dos moralistas.","it":"Avvocato napoletano divenuto sacerdote, fondatore dei redentoristi, vescovo e Dottore della Chiesa. Morì nel 1787 ed è patrono dei confessori e dei moralisti."},"08-02":{"en":"Eusebius, bishop of Vercelli, was exiled for defending the faith of Nicaea and died in 371. Peter Julian Eymard, a French priest who died in 1868, founded the Congregation of the Blessed Sacrament.","es":"Eusebio, obispo de Vercelli, fue desterrado por defender la fe de Nicea y murió en el año 371. Pedro Julián Eymard, sacerdote francés que murió en 1868, fundó la Congregación del Santísimo Sacramento.","pt":"Eusébio, bispo de Vercelli, foi exilado por defender a fé de Niceia e morreu em 371. Pedro Julião Eymard, sacerdote francês que morreu em 1868, fundou a Congregação do Santíssimo Sacramento.","it":"Eusebio, vescovo di Vercelli, fu esiliato per aver difeso la fede di Nicea e morì nel 371. Pietro Giuliano Eymard, sacerdote francese morto nel 1868, fondò la Congregazione del Santissimo Sacramento."},"08-04":{"en":"The Curé of Ars, who spent his life in the confessional and the pulpit of a small French village. He died in 1859 and is patron of parish priests.","es":"El Cura de Ars, que pasó su vida en el confesionario y el púlpito de un pequeño pueblo de Francia. Murió en 1859 y es patrono de los párrocos.","pt":"O Cura d'Ars, que passou a vida no confessionário e no púlpito de uma pequena aldeia da França. Morreu em 1859 e é padroeiro dos párocos.","it":"Il Curato d'Ars, che trascorse la vita nel confessionale e sul pulpito di un piccolo villaggio di Francia. Morì nel 1859 ed è patrono dei parroci."},"08-05":{"en":"The great Roman basilica dedicated to Mary after the Council of Ephesus proclaimed her Mother of God in 431.","es":"La gran basílica romana dedicada a María después de que el Concilio de Éfeso la proclamara Madre de Dios en el año 431.","pt":"A grande basílica romana dedicada a Maria depois que o Concílio de Éfeso a proclamou Mãe de Deus em 431.","it":"La grande basilica romana dedicata a Maria dopo che il Concilio di Efeso la proclamò Madre di Dio nel 431."},"08-06":{"en":"On the mountain, Jesus is transfigured before Peter, James and John, and the Father says, \"This is my beloved Son. Listen to him.\"","es":"En el monte, Jesús se transfigura ante Pedro, Santiago y Juan, y el Padre dice: \"Este es mi Hijo amado. Escúchenlo\".","pt":"No monte, Jesus se transfigura diante de Pedro, Tiago e João, e o Pai diz: \"Este é o meu Filho amado. Escutai-o\".","it":"Sul monte, Gesù si trasfigura davanti a Pietro, Giacomo e Giovanni, e il Padre dice: \"Questi è il Figlio mio, l'amato. Ascoltatelo\"."},"08-07":{"en":"Pope Sixtus II was martyred with his deacons in 258 while celebrating the liturgy. Cajetan founded the Theatines for the reform of the clergy and died in 1547.","es":"El papa Sixto II fue martirizado con sus diáconos en el año 258 mientras celebraba la liturgia. Cayetano fundó los teatinos para la reforma del clero y murió en 1547.","pt":"O papa Sisto II foi martirizado com seus diáconos em 258 enquanto celebrava a liturgia. Caetano fundou os teatinos para a reforma do clero e morreu em 1547.","it":"Papa Sisto II fu martirizzato con i suoi diaconi nel 258 mentre celebrava la liturgia. Gaetano fondò i teatini per la riforma del clero e morì nel 1547."},"08-08":{"en":"Spanish priest who founded the Order of Preachers to proclaim the truth of the Gospel through study, prayer and poverty. He died in 1221.","es":"Sacerdote español que fundó la Orden de Predicadores para anunciar la verdad del Evangelio mediante el estudio, la oración y la pobreza. Murió en 1221.","pt":"Sacerdote espanhol que fundou a Ordem dos Pregadores para anunciar a verdade do Evangelho pelo estudo, pela oração e pela pobreza. Morreu em 1221.","it":"Sacerdote spagnolo che fondò l'Ordine dei Predicatori per annunciare la verità del Vangelo con lo studio, la preghiera e la povertà. Morì nel 1221."},"08-09":{"en":"Edith Stein, a Jewish philosopher who became a Carmelite nun, was killed at Auschwitz in 1942. Co-patron of Europe.","es":"Edith Stein, filósofa judía que se hizo monja carmelita, fue asesinada en Auschwitz en 1942. Copatrona de Europa.","pt":"Edith Stein, filósofa judia que se tornou monja carmelita, foi assassinada em Auschwitz em 1942. Copadroeira da Europa.","it":"Edith Stein, filosofa ebrea divenuta monaca carmelitana, fu uccisa ad Auschwitz nel 1942. Compatrona d'Europa."},"08-10":{"en":"Deacon of Rome who served the poor, martyred in 258. Asked to hand over the treasures of the Church, he presented the poor.","es":"Diácono de Roma que servía a los pobres, martirizado en el año 258. Cuando le exigieron los tesoros de la Iglesia, presentó a los pobres.","pt":"Diácono de Roma que servia os pobres, martirizado em 258. Quando lhe exigiram os tesouros da Igreja, apresentou os pobres.","it":"Diacono di Roma che serviva i poveri, martirizzato nel 258. Quando gli chiesero i tesori della Chiesa, presentò i poveri."},"08-11":{"en":"A noblewoman of Assisi who followed Saint Francis and founded the Poor Clares, devoted to poverty and to the Eucharist. She died in 1253.","es":"Noble de Asís que siguió a san Francisco y fundó las clarisas, entregadas a la pobreza y a la Eucaristía. Murió en 1253.","pt":"Nobre de Assis que seguiu São Francisco e fundou as clarissas, dedicadas à pobreza e à Eucaristia. Morreu em 1253.","it":"Nobile di Assisi che seguì san Francesco e fondò le clarisse, dedite alla povertà e all'Eucaristia. Morì nel 1253."},"08-12":{"en":"French widow and mother who, with Saint Francis de Sales, founded the Order of the Visitation. She died in 1641.","es":"Viuda y madre francesa que, con san Francisco de Sales, fundó la Orden de la Visitación. Murió en 1641.","pt":"Viúva e mãe francesa que, com São Francisco de Sales, fundou a Ordem da Visitação. Morreu em 1641.","it":"Vedova e madre francese che, con san Francesco di Sales, fondò l'Ordine della Visitazione. Morì nel 1641."},"08-13":{"en":"Pope Pontian and the priest Hippolytus, once divided, were exiled together to Sardinia, were reconciled, and died as martyrs around 235.","es":"El papa Ponciano y el presbítero Hipólito, antes divididos, fueron desterrados juntos a Cerdeña, se reconciliaron y murieron mártires hacia el año 235.","pt":"O papa Ponciano e o presbítero Hipólito, antes divididos, foram exilados juntos na Sardenha, reconciliaram-se e morreram mártires por volta de 235.","it":"Papa Ponziano e il presbitero Ippolito, un tempo divisi, furono esiliati insieme in Sardegna, si riconciliarono e morirono martiri verso il 235."},"08-14":{"en":"Polish Franciscan who offered his life in place of a father of a family at Auschwitz in 1941. Patron of journalists and prisoners.","es":"Franciscano polaco que ofreció su vida en lugar de un padre de familia en Auschwitz en 1941. Patrono de los periodistas y de los presos.","pt":"Franciscano polonês que ofereceu a vida no lugar de um pai de família em Auschwitz, em 1941. Padroeiro dos jornalistas e dos presos.","it":"Francescano polacco che offrì la vita al posto di un padre di famiglia ad Auschwitz nel 1941. Patrono dei giornalisti e dei carcerati."},"08-15":{"en":"At the end of her earthly life, the Virgin Mary was taken up body and soul into heavenly glory, as defined by Pius XII in 1950.","es":"Al final de su vida terrena, la Virgen María fue elevada en cuerpo y alma a la gloria del cielo, como definió Pío XII en 1950.","pt":"Ao fim de sua vida terrena, a Virgem Maria foi elevada em corpo e alma à glória celeste, como definiu Pio XII em 1950.","it":"Al termine della sua vita terrena, la Vergine Maria fu assunta in anima e corpo alla gloria celeste, come definì Pio XII nel 1950."},"08-16":{"en":"First king of Hungary, who established the Church among his people. He died in 1038.","es":"Primer rey de Hungría, que estableció la Iglesia entre su pueblo. Murió en 1038.","pt":"Primeiro rei da Hungria, que estabeleceu a Igreja entre o seu povo. Morreu em 1038.","it":"Primo re d'Ungheria, che stabilì la Chiesa tra il suo popolo. Morì nel 1038."},"08-19":{"en":"French priest who founded seminaries for the formation of priests and promoted devotion to the Hearts of Jesus and Mary. He died in 1680.","es":"Sacerdote francés que fundó seminarios para la formación de sacerdotes y promovió la devoción a los Corazones de Jesús y de María. Murió en 1680.","pt":"Sacerdote francês que fundou seminários para a formação dos sacerdotes e promoveu a devoção aos Corações de Jesus e de Maria. Morreu em 1680.","it":"Sacerdote francese che fondò seminari per la formazione dei sacerdoti e promosse la devozione ai Cuori di Gesù e di Maria. Morì nel 1680."},"08-20":{"en":"Cistercian abbot of Clairvaux, the \"Mellifluous Doctor,\" a great lover of the Virgin Mary. He died in 1153.","es":"Abad cisterciense de Claraval, el \"Doctor Melifluo\", gran enamorado de la Virgen María. Murió en 1153.","pt":"Abade cisterciense de Claraval, o \"Doutor Melífluo\", grande enamorado da Virgem Maria. Morreu em 1153.","it":"Abate cistercense di Chiaravalle, il \"Dottore Mellifluo\", grande innamorato della Vergine Maria. Morì nel 1153."},"08-21":{"en":"Pope from 1903 to 1914, who opened Holy Communion to children and encouraged its frequent reception. His motto: \"To restore all things in Christ.\"","es":"Papa de 1903 a 1914, que abrió la Sagrada Comunión a los niños y animó a recibirla con frecuencia. Su lema: \"Instaurar todas las cosas en Cristo\".","pt":"Papa de 1903 a 1914, que abriu a Sagrada Comunhão às crianças e incentivou a recebê-la com frequência. Seu lema: \"Restaurar todas as coisas em Cristo\".","it":"Papa dal 1903 al 1914, che aprì la Santa Comunione ai bambini e incoraggiò a riceverla spesso. Il suo motto: \"Instaurare omnia in Christo\"."},"08-22":{"en":"A week after the Assumption, the Church honors Mary as Queen of heaven and earth, beside her Son.","es":"Una semana después de la Asunción, la Iglesia honra a María como Reina del cielo y de la tierra, junto a su Hijo.","pt":"Uma semana depois da Assunção, a Igreja honra Maria como Rainha do céu e da terra, junto de seu Filho.","it":"Una settimana dopo l'Assunzione, la Chiesa onora Maria come Regina del cielo e della terra, accanto al suo Figlio."},"08-23":{"en":"Dominican tertiary of Lima, the first saint of the Americas, known for penance and care for the poor. She died in 1617.","es":"Terciaria dominica de Lima, primera santa de América, conocida por su penitencia y su cuidado de los pobres. Murió en 1617.","pt":"Terciária dominicana de Lima, primeira santa das Américas, conhecida pela penitência e pelo cuidado dos pobres. Morreu em 1617.","it":"Terziaria domenicana di Lima, prima santa delle Americhe, nota per la penitenza e la cura dei poveri. Morì nel 1617."},"08-24":{"en":"One of the Twelve, often identified with Nathanael, of whom Jesus said, \"Here is a true Israelite. There is no duplicity in him.\"","es":"Uno de los Doce, identificado a menudo con Natanael, de quien Jesús dijo: \"Este es un verdadero israelita, en quien no hay doblez\".","pt":"Um dos Doze, frequentemente identificado com Natanael, de quem Jesus disse: \"Eis um verdadeiro israelita, em quem não há falsidade\".","it":"Uno dei Dodici, spesso identificato con Natanaele, del quale Gesù disse: \"Ecco davvero un israelita in cui non c'è falsità\"."},"08-25":{"en":"Louis IX of France, a just king devoted to the poor, died in 1270. Joseph Calasanz opened free schools for poor children and founded the Piarists; he died in 1648.","es":"Luis IX de Francia, rey justo y entregado a los pobres, murió en 1270. José de Calasanz abrió escuelas gratuitas para niños pobres y fundó los escolapios; murió en 1648.","pt":"Luís IX da França, rei justo e dedicado aos pobres, morreu em 1270. José de Calasanz abriu escolas gratuitas para crianças pobres e fundou os escolápios; morreu em 1648.","it":"Luigi IX di Francia, re giusto e dedito ai poveri, morì nel 1270. Giuseppe Calasanzio aprì scuole gratuite per i bambini poveri e fondò gli scolopi; morì nel 1648."},"08-27":{"en":"Mother of Saint Augustine, whose tears and prayers obtained her son's conversion. She died in 387.","es":"Madre de san Agustín, cuyas lágrimas y oraciones obtuvieron la conversión de su hijo. Murió en el año 387.","pt":"Mãe de Santo Agostinho, cujas lágrimas e orações alcançaram a conversão do filho. Morreu em 387.","it":"Madre di sant'Agostino, le cui lacrime e preghiere ottennero la conversione del figlio. Morì nel 387."},"08-28":{"en":"Bishop of Hippo and Doctor of the Church, author of the Confessions: \"You have made us for yourself, and our heart is restless until it rests in you.\" He died in 430.","es":"Obispo de Hipona y Doctor de la Iglesia, autor de las Confesiones: \"Nos hiciste, Señor, para ti, y nuestro corazón está inquieto hasta que descanse en ti\". Murió en el año 430.","pt":"Bispo de Hipona e Doutor da Igreja, autor das Confissões: \"Fizeste-nos para ti, Senhor, e inquieto está o nosso coração enquanto não repousa em ti\". Morreu em 430.","it":"Vescovo di Ippona e Dottore della Chiesa, autore delle Confessioni: \"Ci hai fatti per te, Signore, e il nostro cuore è inquieto finché non riposa in te\". Morì nel 430."},"08-29":{"en":"Beheaded at Herod's command for proclaiming the truth, John is the forerunner of Christ in death as in birth.","es":"Decapitado por orden de Herodes por proclamar la verdad, Juan es precursor de Cristo en la muerte como en el nacimiento.","pt":"Decapitado por ordem de Herodes por proclamar a verdade, João é precursor de Cristo na morte como no nascimento.","it":"Decapitato per ordine di Erode per aver proclamato la verità, Giovanni è precursore di Cristo nella morte come nella nascita."},"09-03":{"en":"A monk who became pope from 590 to 604, reformer, pastor and Doctor of the Church, who sent missionaries to England.","es":"Monje que fue papa del 590 al 604, reformador, pastor y Doctor de la Iglesia, que envió misioneros a Inglaterra.","pt":"Monge que foi papa de 590 a 604, reformador, pastor e Doutor da Igreja, que enviou missionários à Inglaterra.","it":"Monaco divenuto papa dal 590 al 604, riformatore, pastore e Dottore della Chiesa, che inviò missionari in Inghilterra."},"09-08":{"en":"The birth of the Virgin Mary, the dawn of salvation, from whom the Sun of justice would rise.","es":"El nacimiento de la Virgen María, aurora de la salvación, de quien nacería el Sol de justicia.","pt":"O nascimento da Virgem Maria, aurora da salvação, da qual nasceria o Sol de justiça.","it":"La nascita della Vergine Maria, aurora della salvezza, dalla quale sarebbe sorto il Sole di giustizia."},"09-09":{"en":"Spanish Jesuit in Cartagena, Colombia, who served enslaved Africans for forty years, calling himself \"the slave of the slaves forever.\" He died in 1654.","es":"Jesuita español en Cartagena de Indias, Colombia, que sirvió durante cuarenta años a los africanos esclavizados y se llamó \"esclavo de los esclavos para siempre\". Murió en 1654.","pt":"Jesuíta espanhol em Cartagena das Índias, na Colômbia, que serviu durante quarenta anos os africanos escravizados e se chamou \"escravo dos escravos para sempre\". Morreu em 1654.","it":"Gesuita spagnolo a Cartagena, in Colombia, che servì per quarant'anni gli africani ridotti in schiavitù e si definì \"schiavo degli schiavi per sempre\". Morì nel 1654."},"09-12":{"en":"Extended to the whole Church after the victory at Vienna in 1683, this day honors the holy name of the Mother of God.","es":"Extendida a toda la Iglesia tras la victoria de Viena en 1683, esta memoria honra el santo nombre de la Madre de Dios.","pt":"Estendida a toda a Igreja depois da vitória de Viena em 1683, esta memória honra o santo nome da Mãe de Deus.","it":"Estesa a tutta la Chiesa dopo la vittoria di Vienna del 1683, questa memoria onora il santo nome della Madre di Dio."},"09-13":{"en":"Archbishop of Constantinople, the \"Golden Mouth,\" preacher and Doctor of the Church, who died in exile in 407.","es":"Arzobispo de Constantinopla, el \"Boca de Oro\", predicador y Doctor de la Iglesia, que murió en el destierro en el año 407.","pt":"Arcebispo de Constantinopla, o \"Boca de Ouro\", pregador e Doutor da Igreja, que morreu no exílio em 407.","it":"Arcivescovo di Costantinopoli, la \"Bocca d'oro\", predicatore e Dottore della Chiesa, morto in esilio nel 407."},"09-14":{"en":"The Church exalts the Cross of Christ, the instrument of our salvation, recalling the dedication of the Church of the Holy Sepulchre in Jerusalem.","es":"La Iglesia exalta la Cruz de Cristo, instrumento de nuestra salvación, recordando la dedicación de la iglesia del Santo Sepulcro en Jerusalén.","pt":"A Igreja exalta a Cruz de Cristo, instrumento da nossa salvação, recordando a dedicação da igreja do Santo Sepulcro em Jerusalém.","it":"La Chiesa esalta la Croce di Cristo, strumento della nostra salvezza, ricordando la dedicazione della chiesa del Santo Sepolcro a Gerusalemme."},"09-15":{"en":"Mary at the foot of the Cross: the Church honors her sorrows and her faith, which never wavered.","es":"María al pie de la Cruz: la Iglesia honra sus dolores y su fe, que nunca vaciló.","pt":"Maria ao pé da Cruz: a Igreja honra suas dores e sua fé, que nunca vacilou.","it":"Maria ai piedi della Croce: la Chiesa onora i suoi dolori e la sua fede, che non vacillò mai."},"09-16":{"en":"Pope Cornelius and Cyprian, bishop of Carthage, martyrs of the third century, who stood together for the unity of the Church.","es":"El papa Cornelio y Cipriano, obispo de Cartago, mártires del siglo III, que se mantuvieron unidos por la unidad de la Iglesia.","pt":"O papa Cornélio e Cipriano, bispo de Cartago, mártires do século III, que permaneceram unidos pela unidade da Igreja.","it":"Papa Cornelio e Cipriano, vescovo di Cartagine, martiri del III secolo, che rimasero uniti per l'unità della Chiesa."},"09-17":{"en":"Robert Bellarmine, Jesuit cardinal, catechist and Doctor of the Church, died in 1621. Hildegard of Bingen, Benedictine abbess, mystic and Doctor of the Church, died in 1179.","es":"Roberto Belarmino, cardenal jesuita, catequista y Doctor de la Iglesia, murió en 1621. Hildegarda de Bingen, abadesa benedictina, mística y Doctora de la Iglesia, murió en 1179.","pt":"Roberto Belarmino, cardeal jesuíta, catequista e Doutor da Igreja, morreu em 1621. Hildegarda de Bingen, abadessa beneditina, mística e Doutora da Igreja, morreu em 1179.","it":"Roberto Bellarmino, cardinale gesuita, catechista e Dottore della Chiesa, morì nel 1621. Ildegarda di Bingen, badessa benedettina, mistica e Dottore della Chiesa, morì nel 1179."},"09-19":{"en":"Bishop of Benevento, martyred around 305. His blood is preserved in the cathedral of Naples.","es":"Obispo de Benevento, martirizado hacia el año 305. Su sangre se conserva en la catedral de Nápoles.","pt":"Bispo de Benevento, martirizado por volta de 305. Seu sangue é conservado na catedral de Nápoles.","it":"Vescovo di Benevento, martirizzato verso il 305. Il suo sangue è custodito nel duomo di Napoli."},"09-20":{"en":"Andrew Kim Taegon, the first Korean priest, Paul Chong Hasang, a lay apostle, and their companions, 103 martyrs who gave their lives in Korea in the nineteenth century.","es":"Andrés Kim Taegon, primer sacerdote coreano, Pablo Chong Hasang, apóstol laico, y sus compañeros, 103 mártires que dieron la vida en Corea en el siglo XIX.","pt":"André Kim Taegon, primeiro sacerdote coreano, Paulo Chong Hasang, apóstolo leigo, e seus companheiros, 103 mártires que deram a vida na Coreia no século XIX.","it":"Andrea Kim Taegon, primo sacerdote coreano, Paolo Chong Hasang, apostolo laico, e i loro compagni, 103 martiri che diedero la vita in Corea nel XIX secolo."},"09-21":{"en":"A tax collector whom Jesus called to follow him, Apostle and author of the first Gospel.","es":"Recaudador de impuestos a quien Jesús llamó a seguirlo, Apóstol y autor del primer Evangelio.","pt":"Cobrador de impostos a quem Jesus chamou para segui-lo, Apóstolo e autor do primeiro Evangelho.","it":"Esattore delle tasse che Gesù chiamò a seguirlo, Apostolo e autore del primo Vangelo."},"09-23":{"en":"Capuchin friar of Pietrelcina, bearer of the stigmata and tireless confessor, who drew multitudes to conversion at San Giovanni Rotondo. He died in 1968.","es":"Fraile capuchino de Pietrelcina, portador de los estigmas e incansable confesor, que atrajo multitudes a la conversión en San Giovanni Rotondo. Murió en 1968.","pt":"Frade capuchinho de Pietrelcina, portador dos estigmas e confessor incansável, que atraiu multidões à conversão em San Giovanni Rotondo. Morreu em 1968.","it":"Frate cappuccino di Pietrelcina, portatore delle stimmate e confessore instancabile, che attirò folle alla conversione a San Giovanni Rotondo. Morì nel 1968."},"09-26":{"en":"Twin brothers and physicians who cared for the sick without payment and were martyred in Syria.","es":"Hermanos gemelos y médicos que atendían a los enfermos sin cobrar y fueron martirizados en Siria.","pt":"Irmãos gêmeos e médicos que tratavam os doentes sem cobrar e foram martirizados na Síria.","it":"Fratelli gemelli e medici che curavano i malati senza compenso e furono martirizzati in Siria."},"09-27":{"en":"French priest, apostle of charity, founder of the Congregation of the Mission and of the Daughters of Charity, who worked for the formation of the clergy. He died in 1660.","es":"Sacerdote francés, apóstol de la caridad, fundador de la Congregación de la Misión y de las Hijas de la Caridad, que trabajó por la formación del clero. Murió en 1660.","pt":"Sacerdote francês, apóstolo da caridade, fundador da Congregação da Missão e das Filhas da Caridade, que trabalhou pela formação do clero. Morreu em 1660.","it":"Sacerdote francese, apostolo della carità, fondatore della Congregazione della Missione e delle Figlie della Carità, che lavorò per la formazione del clero. Morì nel 1660."},"09-28":{"en":"Wenceslaus, Duke of Bohemia, died in 935 and is patron of the Czech people. Lawrence Ruiz, a Filipino layman and father, was martyred in Japan in 1637 with fifteen companions.","es":"Wenceslao, duque de Bohemia, murió en el año 935 y es patrono del pueblo checo. Lorenzo Ruiz, laico filipino y padre de familia, fue martirizado en Japón en 1637 con quince compañeros.","pt":"Venceslau, duque da Boêmia, morreu em 935 e é padroeiro do povo tcheco. Lourenço Ruiz, leigo filipino e pai de família, foi martirizado no Japão em 1637 com quinze companheiros.","it":"Venceslao, duca di Boemia, morì nel 935 ed è patrono del popolo ceco. Lorenzo Ruiz, laico filippino e padre di famiglia, fu martirizzato in Giappone nel 1637 con quindici compagni."},"09-29":{"en":"Michael, who defends; Gabriel, who announces; Raphael, who heals: messengers of God in the service of salvation.","es":"Miguel, que defiende; Gabriel, que anuncia; Rafael, que sana: mensajeros de Dios al servicio de la salvación.","pt":"Miguel, que defende; Gabriel, que anuncia; Rafael, que cura: mensageiros de Deus a serviço da salvação.","it":"Michele, che difende; Gabriele, che annuncia; Raffaele, che guarisce: messaggeri di Dio al servizio della salvezza."},"09-30":{"en":"Priest and Doctor of the Church, who translated the Bible into Latin. \"Ignorance of Scripture is ignorance of Christ.\" He died in 420.","es":"Sacerdote y Doctor de la Iglesia, que tradujo la Biblia al latín. \"Ignorar las Escrituras es ignorar a Cristo\". Murió en el año 420.","pt":"Sacerdote e Doutor da Igreja, que traduziu a Bíblia para o latim. \"Ignorar as Escrituras é ignorar Cristo\". Morreu em 420.","it":"Sacerdote e Dottore della Chiesa, che tradusse la Bibbia in latino. \"L'ignoranza delle Scritture è ignoranza di Cristo\". Morì nel 420."},"10-01":{"en":"Carmelite of Lisieux who taught the \"little way\" of trust and love. She died in 1897; Doctor of the Church and patron of the missions.","es":"Carmelita de Lisieux que enseñó el \"caminito\" de la confianza y el amor. Murió en 1897; Doctora de la Iglesia y patrona de las misiones.","pt":"Carmelita de Lisieux que ensinou a \"pequena via\" da confiança e do amor. Morreu em 1897; Doutora da Igreja e padroeira das missões.","it":"Carmelitana di Lisieux che insegnò la \"piccola via\" della fiducia e dell'amore. Morì nel 1897; Dottore della Chiesa e patrona delle missioni."},"10-02":{"en":"God entrusts each person to an angel, who guards and guides them on the way.","es":"Dios confía a cada persona a un ángel, que la guarda y la guía en el camino.","pt":"Deus confia cada pessoa a um anjo, que a guarda e a guia no caminho.","it":"Dio affida ogni persona a un angelo, che la custodisce e la guida nel cammino."},"10-04":{"en":"The poor man of Assisi, who embraced poverty and renewed the Church through humility and joy. Founder of the Friars Minor, he died in 1226.","es":"El pobrecillo de Asís, que abrazó la pobreza y renovó la Iglesia con humildad y alegría. Fundador de los Frailes Menores, murió en 1226.","pt":"O pobrezinho de Assis, que abraçou a pobreza e renovou a Igreja com humildade e alegria. Fundador dos Frades Menores, morreu em 1226.","it":"Il poverello di Assisi, che abbracciò la povertà e rinnovò la Chiesa con umiltà e letizia. Fondatore dei Frati Minori, morì nel 1226."},"10-05":{"en":"Francis Xavier Seelos, Redemptorist missionary in the United States, died in 1867. Faustina Kowalska, a Polish sister and apostle of Divine Mercy, died in 1938.","es":"Francisco Javier Seelos, misionero redentorista en los Estados Unidos, murió en 1867. Faustina Kowalska, religiosa polaca y apóstol de la Divina Misericordia, murió en 1938.","pt":"Francisco Xavier Seelos, missionário redentorista nos Estados Unidos, morreu em 1867. Faustina Kowalska, irmã polonesa e apóstola da Divina Misericórdia, morreu em 1938.","it":"Francesco Saverio Seelos, missionario redentorista negli Stati Uniti, morì nel 1867. Faustina Kowalska, suora polacca e apostola della Divina Misericordia, morì nel 1938."},"10-06":{"en":"Bruno founded the Carthusians and died in 1101. Marie Rose Durocher of Quebec founded the Sisters of the Holy Names of Jesus and Mary and died in 1849.","es":"Bruno fundó los cartujos y murió en 1101. María Rosa Durocher, de Quebec, fundó las Hermanas de los Santos Nombres de Jesús y María y murió en 1849.","pt":"Bruno fundou os cartuxos e morreu em 1101. Maria Rosa Durocher, de Quebec, fundou as Irmãs dos Santos Nomes de Jesus e Maria e morreu em 1849.","it":"Bruno fondò i certosini e morì nel 1101. Maria Rosa Durocher, del Québec, fondò le Suore dei Santi Nomi di Gesù e Maria e morì nel 1849."},"10-07":{"en":"Instituted after the victory of Lepanto in 1571, this memorial invites us to contemplate the mysteries of Christ with Mary.","es":"Instituida tras la victoria de Lepanto en 1571, esta memoria nos invita a contemplar con María los misterios de Cristo.","pt":"Instituída depois da vitória de Lepanto em 1571, esta memória nos convida a contemplar com Maria os mistérios de Cristo.","it":"Istituita dopo la vittoria di Lepanto del 1571, questa memoria ci invita a contemplare con Maria i misteri di Cristo."},"10-09":{"en":"Denis, first bishop of Paris, was martyred around 258. John Leonardi, a pharmacist who became a priest, founded the Clerks Regular of the Mother of God and died in 1609.","es":"Dionisio, primer obispo de París, fue martirizado hacia el año 258. Juan Leonardi, farmacéutico que se hizo sacerdote, fundó los Clérigos Regulares de la Madre de Dios y murió en 1609.","pt":"Dionísio, primeiro bispo de Paris, foi martirizado por volta de 258. João Leonardi, farmacêutico que se tornou sacerdote, fundou os Clérigos Regulares da Mãe de Deus e morreu em 1609.","it":"Dionigi, primo vescovo di Parigi, fu martirizzato verso il 258. Giovanni Leonardi, farmacista divenuto sacerdote, fondò i Chierici Regolari della Madre di Dio e morì nel 1609."},"10-11":{"en":"Angelo Roncalli, pope from 1958 to 1963, the \"Good Pope,\" who convoked the Second Vatican Council.","es":"Angelo Roncalli, papa de 1958 a 1963, el \"Papa Bueno\", que convocó el Concilio Vaticano II.","pt":"Angelo Roncalli, papa de 1958 a 1963, o \"Papa Bom\", que convocou o Concílio Vaticano II.","it":"Angelo Roncalli, papa dal 1958 al 1963, il \"Papa buono\", che convocò il Concilio Vaticano II."},"10-14":{"en":"A former slave who became pope and was martyred in Rome around 222. A famous Roman catacomb bears his name.","es":"Antiguo esclavo que llegó a ser papa y fue martirizado en Roma hacia el año 222. Una célebre catacumba romana lleva su nombre.","pt":"Antigo escravo que se tornou papa e foi martirizado em Roma por volta de 222. Uma célebre catacumba romana leva o seu nome.","it":"Ex schiavo divenuto papa e martirizzato a Roma verso il 222. Una celebre catacomba romana porta il suo nome."},"10-15":{"en":"Carmelite of Ávila, reformer and mystic, the first woman declared Doctor of the Church. She died in 1582.","es":"Carmelita de Ávila, reformadora y mística, primera mujer declarada Doctora de la Iglesia. Murió en 1582.","pt":"Carmelita de Ávila, reformadora e mística, primeira mulher declarada Doutora da Igreja. Morreu em 1582.","it":"Carmelitana di Ávila, riformatrice e mistica, prima donna proclamata Dottore della Chiesa. Morì nel 1582."},"10-16":{"en":"Hedwig, Duchess of Silesia, devoted to the poor, died in 1243. Margaret Mary Alacoque, Visitation nun of Paray-le-Monial, spread devotion to the Sacred Heart and died in 1690.","es":"Eduvigis, duquesa de Silesia, entregada a los pobres, murió en 1243. Margarita María Alacoque, religiosa de la Visitación en Paray-le-Monial, difundió la devoción al Sagrado Corazón y murió en 1690.","pt":"Edviges, duquesa da Silésia, dedicada aos pobres, morreu em 1243. Margarida Maria Alacoque, monja da Visitação em Paray-le-Monial, difundiu a devoção ao Sagrado Coração e morreu em 1690.","it":"Edvige, duchessa di Slesia, dedita ai poveri, morì nel 1243. Margherita Maria Alacoque, monaca della Visitazione a Paray-le-Monial, diffuse la devozione al Sacro Cuore e morì nel 1690."},"10-17":{"en":"Bishop of Antioch, thrown to the beasts in Rome around 107. In letters written on the way, he called himself \"the wheat of God.\"","es":"Obispo de Antioquía, arrojado a las fieras en Roma hacia el año 107. En las cartas que escribió en el camino se llamó a sí mismo \"trigo de Dios\".","pt":"Bispo de Antioquia, lançado às feras em Roma por volta de 107. Nas cartas que escreveu pelo caminho, chamou a si mesmo \"trigo de Deus\".","it":"Vescovo di Antiochia, dato in pasto alle belve a Roma verso il 107. Nelle lettere scritte durante il viaggio si definì \"frumento di Dio\"."},"10-18":{"en":"Physician and companion of Saint Paul, author of the third Gospel and of the Acts of the Apostles.","es":"Médico y compañero de san Pablo, autor del tercer Evangelio y de los Hechos de los Apóstoles.","pt":"Médico e companheiro de São Paulo, autor do terceiro Evangelho e dos Atos dos Apóstolos.","it":"Medico e compagno di san Paolo, autore del terzo Vangelo e degli Atti degli Apostoli."},"10-19":{"en":"Jesuit missionaries John de Brébeuf, Isaac Jogues and their companions, martyred among the Huron and Iroquois peoples in the 1640s.","es":"Los misioneros jesuitas Juan de Brébeuf, Isaac Jogues y sus compañeros, martirizados entre los pueblos hurón e iroqués en la década de 1640.","pt":"Os missionários jesuítas João de Brébeuf, Isaac Jogues e seus companheiros, martirizados entre os povos hurão e iroquês na década de 1640.","it":"I missionari gesuiti Giovanni de Brébeuf, Isacco Jogues e i loro compagni, martirizzati tra i popoli uroni e irochesi negli anni Quaranta del Seicento."},"10-20":{"en":"Italian priest who founded the Passionists to proclaim the love of God revealed in the Passion of Christ. He died in 1775.","es":"Sacerdote italiano que fundó los pasionistas para anunciar el amor de Dios revelado en la Pasión de Cristo. Murió en 1775.","pt":"Sacerdote italiano que fundou os passionistas para anunciar o amor de Deus revelado na Paixão de Cristo. Morreu em 1775.","it":"Sacerdote italiano che fondò i passionisti per annunciare l'amore di Dio rivelato nella Passione di Cristo. Morì nel 1775."},"10-22":{"en":"Karol Wojtyła, pope from 1978 to 2005, author of the encyclical Redemptoris Mater. \"Do not be afraid! Open wide the doors to Christ!\"","es":"Karol Wojtyła, papa de 1978 a 2005, autor de la encíclica Redemptoris Mater. \"¡No tengan miedo! ¡Abran de par en par las puertas a Cristo!\".","pt":"Karol Wojtyła, papa de 1978 a 2005, autor da encíclica Redemptoris Mater. \"Não tenhais medo! Abri, escancarai as portas a Cristo!\".","it":"Karol Wojtyła, papa dal 1978 al 2005, autore dell'enciclica Redemptoris Mater. \"Non abbiate paura! Aprite, anzi, spalancate le porte a Cristo!\"."},"10-23":{"en":"Franciscan preacher who renewed Christian life across Europe. He died in 1456.","es":"Predicador franciscano que renovó la vida cristiana en toda Europa. Murió en 1456.","pt":"Pregador franciscano que renovou a vida cristã por toda a Europa. Morreu em 1456.","it":"Predicatore francescano che rinnovò la vita cristiana in tutta Europa. Morì nel 1456."},"10-24":{"en":"Spanish missionary, Archbishop of Santiago de Cuba and founder of the Claretians. He died in 1870.","es":"Misionero español, arzobispo de Santiago de Cuba y fundador de los claretianos. Murió en 1870.","pt":"Missionário espanhol, arcebispo de Santiago de Cuba e fundador dos claretianos. Morreu em 1870.","it":"Missionario spagnolo, arcivescovo di Santiago di Cuba e fondatore dei clarettiani. Morì nel 1870."},"10-28":{"en":"Two of the Twelve, Simon the Zealot and Jude Thaddeus, who according to tradition preached the Gospel together and died as martyrs.","es":"Dos de los Doce, Simón el Zelote y Judas Tadeo, que según la tradición predicaron juntos el Evangelio y murieron mártires.","pt":"Dois dos Doze, Simão, o Zelota, e Judas Tadeu, que segundo a tradição pregaram juntos o Evangelho e morreram mártires.","it":"Due dei Dodici, Simone lo Zelota e Giuda Taddeo, che secondo la tradizione predicarono insieme il Vangelo e morirono martiri."},"11-01":{"en":"The Church rejoices in all the saints, known and unknown, who now see God face to face.","es":"La Iglesia se alegra por todos los santos, conocidos y desconocidos, que ya ven a Dios cara a cara.","pt":"A Igreja se alegra por todos os santos, conhecidos e desconhecidos, que já veem a Deus face a face.","it":"La Chiesa gioisce per tutti i santi, noti e sconosciuti, che già vedono Dio faccia a faccia."},"11-02":{"en":"The Church prays for all the faithful departed, that, purified, they may enter into the joy of the Lord.","es":"La Iglesia ora por todos los fieles difuntos, para que, purificados, entren en el gozo del Señor.","pt":"A Igreja reza por todos os fiéis defuntos, para que, purificados, entrem na alegria do Senhor.","it":"La Chiesa prega per tutti i fedeli defunti, perché, purificati, entrino nella gioia del Signore."},"11-03":{"en":"Dominican brother of Lima, son of a Spanish nobleman and a freed woman of African descent, who served the poor and the sick. He died in 1639.","es":"Hermano dominico de Lima, hijo de un noble español y de una mujer liberta de origen africano, que sirvió a los pobres y a los enfermos. Murió en 1639.","pt":"Irmão dominicano de Lima, filho de um nobre espanhol e de uma mulher liberta de origem africana, que serviu os pobres e os doentes. Morreu em 1639.","it":"Fratello domenicano di Lima, figlio di un nobile spagnolo e di una donna liberta di origine africana, che servì i poveri e i malati. Morì nel 1639."},"11-04":{"en":"Archbishop of Milan and reformer after the Council of Trent, who founded seminaries for the formation of priests. He died in 1584.","es":"Arzobispo de Milán y reformador después del Concilio de Trento, que fundó seminarios para la formación de los sacerdotes. Murió en 1584.","pt":"Arcebispo de Milão e reformador depois do Concílio de Trento, que fundou seminários para a formação dos sacerdotes. Morreu em 1584.","it":"Arcivescovo di Milano e riformatore dopo il Concilio di Trento, che fondò seminari per la formazione dei sacerdoti. Morì nel 1584."},"11-09":{"en":"The cathedral of the Pope, \"mother and head of all the churches of the City and of the world.\"","es":"La catedral del Papa, \"madre y cabeza de todas las iglesias de la Ciudad y del mundo\".","pt":"A catedral do Papa, \"mãe e cabeça de todas as igrejas da Cidade e do mundo\".","it":"La cattedrale del Papa, \"madre e capo di tutte le chiese dell'Urbe e del mondo\"."},"11-10":{"en":"Pope and Doctor of the Church, whose letter on the two natures of Christ was acclaimed at Chalcedon. He persuaded Attila to spare Rome and died in 461.","es":"Papa y Doctor de la Iglesia, cuya carta sobre las dos naturalezas de Cristo fue aclamada en Calcedonia. Convenció a Atila de perdonar a Roma y murió en el año 461.","pt":"Papa e Doutor da Igreja, cuja carta sobre as duas naturezas de Cristo foi aclamada em Calcedônia. Convenceu Átila a poupar Roma e morreu em 461.","it":"Papa e Dottore della Chiesa, la cui lettera sulle due nature di Cristo fu acclamata a Calcedonia. Convinse Attila a risparmiare Roma e morì nel 461."},"11-11":{"en":"A Roman soldier who shared his cloak with a beggar, then monk and bishop of Tours. He died in 397.","es":"Soldado romano que compartió su capa con un mendigo, luego monje y obispo de Tours. Murió en el año 397.","pt":"Soldado romano que repartiu seu manto com um mendigo, depois monge e bispo de Tours. Morreu em 397.","it":"Soldato romano che divise il suo mantello con un povero, poi monaco e vescovo di Tours. Morì nel 397."},"11-12":{"en":"Ukrainian archbishop of Polotsk, martyred in 1623 for working for the unity of the Church.","es":"Arzobispo ucraniano de Pólotsk, martirizado en 1623 por trabajar por la unidad de la Iglesia.","pt":"Arcebispo ucraniano de Polotsk, martirizado em 1623 por trabalhar pela unidade da Igreja.","it":"Arcivescovo ucraino di Polock, martirizzato nel 1623 per aver lavorato per l'unità della Chiesa."},"11-13":{"en":"Italian missionary who founded the Missionary Sisters of the Sacred Heart and served immigrants in America. She died in 1917, the first United States citizen to be canonized.","es":"Misionera italiana que fundó las Misioneras del Sagrado Corazón y sirvió a los inmigrantes en América. Murió en 1917; fue la primera ciudadana de los Estados Unidos canonizada.","pt":"Missionária italiana que fundou as Missionárias do Sagrado Coração e serviu os imigrantes na América. Morreu em 1917; foi a primeira cidadã dos Estados Unidos canonizada.","it":"Missionaria italiana che fondò le Missionarie del Sacro Cuore e servì gli immigrati in America. Morì nel 1917; fu la prima cittadina degli Stati Uniti canonizzata."},"11-15":{"en":"German Dominican, bishop and Doctor of the Church, teacher of Thomas Aquinas. He died in 1280 and is patron of scientists.","es":"Dominico alemán, obispo y Doctor de la Iglesia, maestro de Tomás de Aquino. Murió en 1280 y es patrono de los científicos.","pt":"Dominicano alemão, bispo e Doutor da Igreja, mestre de Tomás de Aquino. Morreu em 1280 e é padroeiro dos cientistas.","it":"Domenicano tedesco, vescovo e Dottore della Chiesa, maestro di Tommaso d'Aquino. Morì nel 1280 ed è patrono degli scienziati."},"11-16":{"en":"Margaret, Queen of Scotland and mother of eight, friend of the poor, died in 1093. Gertrude the Great, Benedictine mystic of Helfta, died around 1302.","es":"Margarita, reina de Escocia y madre de ocho hijos, amiga de los pobres, murió en 1093. Gertrudis la Grande, mística benedictina de Helfta, murió hacia el año 1302.","pt":"Margarida, rainha da Escócia e mãe de oito filhos, amiga dos pobres, morreu em 1093. Gertrudes, a Grande, mística beneditina de Helfta, morreu por volta de 1302.","it":"Margherita, regina di Scozia e madre di otto figli, amica dei poveri, morì nel 1093. Geltrude la Grande, mistica benedettina di Helfta, morì verso il 1302."},"11-17":{"en":"A princess and widow who spent herself in service to the poor and the sick as a Franciscan tertiary. She died in 1231.","es":"Princesa y viuda que se entregó al servicio de los pobres y los enfermos como terciaria franciscana. Murió en 1231.","pt":"Princesa e viúva que se dedicou ao serviço dos pobres e dos doentes como terciária franciscana. Morreu em 1231.","it":"Principessa e vedova che si spese al servizio dei poveri e dei malati come terziaria francescana. Morì nel 1231."},"11-18":{"en":"The dedication of the basilicas raised over the tombs of Peter and Paul in Rome. Rose Philippine Duchesne, a Religious of the Sacred Heart, was a missionary on the American frontier; she died in 1852.","es":"La dedicación de las basílicas levantadas sobre las tumbas de Pedro y Pablo en Roma. Rosa Filipina Duchesne, religiosa del Sagrado Corazón, fue misionera en la frontera americana; murió en 1852.","pt":"A dedicação das basílicas erguidas sobre os túmulos de Pedro e Paulo em Roma. Rosa Filipina Duchesne, religiosa do Sagrado Coração, foi missionária na fronteira americana; morreu em 1852.","it":"La dedicazione delle basiliche erette sulle tombe di Pietro e Paolo a Roma. Rosa Filippina Duchesne, religiosa del Sacro Cuore, fu missionaria sulla frontiera americana; morì nel 1852."},"11-21":{"en":"According to ancient tradition, Mary was presented in the Temple as a child and consecrated to God.","es":"Según una antigua tradición, María fue presentada de niña en el Templo y consagrada a Dios.","pt":"Segundo uma antiga tradição, Maria foi apresentada ainda menina no Templo e consagrada a Deus.","it":"Secondo un'antica tradizione, Maria fu presentata bambina al Tempio e consacrata a Dio."},"11-22":{"en":"Roman virgin and martyr, named in the Roman Canon. Patron of musicians and of sacred music.","es":"Virgen y mártir romana, nombrada en el Canon Romano. Patrona de los músicos y de la música sagrada.","pt":"Virgem e mártir romana, nomeada no Cânon Romano. Padroeira dos músicos e da música sacra.","it":"Vergine e martire romana, nominata nel Canone Romano. Patrona dei musicisti e della musica sacra."},"11-23":{"en":"Clement I was the third successor of Peter. Columban, Irish monk and missionary, died in 615. Miguel Agustín Pro, Mexican Jesuit, was shot in 1927, crying \"¡Viva Cristo Rey!\"","es":"Clemente I fue el tercer sucesor de Pedro. Columbano, monje y misionero irlandés, murió en el 615. Miguel Agustín Pro, jesuita mexicano, fue fusilado en 1927 gritando \"¡Viva Cristo Rey!\".","pt":"Clemente I foi o terceiro sucessor de Pedro. Columbano, monge e missionário irlandês, morreu em 615. Miguel Agustín Pro, jesuíta mexicano, foi fuzilado em 1927 gritando \"¡Viva Cristo Rey!\".","it":"Clemente I fu il terzo successore n of holy images. He died around 749.","es":"Monje y sacerdote sirio, Doctor de la Iglesia, que defendió la veneración de las imágenes sagradas. Murió hacia el año 749.","pt":"Monge e sacerdote sírio, Doutor da Igreja, que defendeu a veneração das imagens sagradas. Morreu por volta de 749.","it":"Monaco e sacerdote siriano, Dottore della Chiesa, che difese la venerazione delle sacre immagini. Morì verso il 749."},"12-06":{"en":"Bishop of Myra in the fourth century, renowned for his generosity to the poor and to children.","es":"Obispo de Mira en el siglo IV, célebre por su generosidad con los pobres y los niños.","pt":"Bispo de Mira no século IV, célebre por sua generosidade com os pobres e as crianças.","it":"Vescovo di Mira nel IV secolo, celebre per la sua generosità verso i poveri e i bambini."},"12-07":{"en":"Bishop of Milan and Doctor of the Church, who baptized Saint Augustine. He died in 397.","es":"Obispo de Milán y Doctor de la Iglesia, que bautizó a san Agustín. Murió en el año 397.","pt":"Bispo de Milão e Doutor da Igreja, que batizou Santo Agostinho. Morreu em 397.","it":"Vescovo di Milano e Dottore della Chiesa, che battezzò sant'Agostino. Morì nel 397."},"12-08":{"en":"Mary was preserved from all stain of original sin from the first moment of her conception, as defined by Pius IX in 1854. Patroness of the United States.","es":"María fue preservada de toda mancha de pecado original desde el primer instante de su concepción, como definió Pío IX en 1854. Patrona de los Estados Unidos.","pt":"Maria foi preservada de toda mancha do pecado original desde o primeiro instante de sua conceição, como definiu Pio IX em 1854. Padroeira dos Estados Unidos.","it":"Maria fu preservata da ogni macchia di peccato originale fin dal primo istante del suo concepimento, come definì Pio IX nel 1854. Patrona degli Stati Uniti."},"12-09":{"en":"A Nahua layman to whom the Virgin Mary appeared on the hill of Tepeyac in 1531.","es":"Laico nahua a quien la Virgen María se apareció en el cerro del Tepeyac en 1531.","pt":"Leigo nahua a quem a Virgem Maria apareceu na colina de Tepeyac em 1531.","it":"Laico nahua al quale la Vergine Maria apparve sulla collina del Tepeyac nel 1531."},"12-10":{"en":"The Church honors the Holy House of Nazareth, venerated at Loreto. Our Lady of Loreto is patroness of aviators.","es":"La Iglesia honra la Santa Casa de Nazaret, venerada en Loreto. Nuestra Señora de Loreto es patrona de los aviadores.","pt":"A Igreja honra a Santa Casa de Nazaré, venerada em Loreto. Nossa Senhora de Loreto é padroeira dos aviadores.","it":"La Chiesa onora la Santa Casa di Nazaret, venerata a Loreto. La Madonna di Loreto è patrona degli aviatori."},"12-11":{"en":"Pope from 366 to 384, who encouraged Saint Jerome's translation of the Scriptures and honored the tombs of the martyrs.","es":"Papa del 366 al 384, que impulsó la traducción de las Escrituras de san Jerónimo y honró las tumbas de los mártires.","pt":"Papa de 366 a 384, que incentivou a tradução das Escrituras de São Jerônimo e honrou os túmulos dos mártires.","it":"Papa dal 366 al 384, che promosse la traduzione delle Scritture di san Girolamo e onorò le tombe dei martiri."},"12-12":{"en":"In 1531 Mary appeared to Juan Diego and left her image on his tilma. Patroness of the Americas.","es":"En 1531 María se apareció a Juan Diego y dejó su imagen en su tilma. Patrona de las Américas.","pt":"Em 1531 Maria apareceu a Juan Diego e deixou sua imagem em sua tilma. Padroeira das Américas.","it":"Nel 1531 Maria apparve a Juan Diego e lasciò la sua immagine sulla sua tilma. Patrona delle Americhe."},"12-13":{"en":"Virgin and martyr of Syracuse, whose name means light. She is named in the Roman Canon.","es":"Virgen y mártir de Siracusa, cuyo nombre significa luz. Es nombrada en el Canon Romano.","pt":"Virgem e mártir de Siracusa, cujo nome significa luz. É nomeada no Cânon Romano.","it":"Vergine e martire di Siracusa, il cui nome significa luce. È nominata nel Canone Romano."},"12-14":{"en":"Spanish Carmelite, reformer with Saint Teresa, mystic poet and Doctor of the Church. He died in 1591.","es":"Carmelita español, reformador con santa Teresa, poeta místico y Doctor de la Iglesia. Murió en 1591.","pt":"Carmelita espanhol, reformador com Santa Teresa, poeta místico e Doutor da Igreja. Morreu em 1591.","it":"Carmelitano spagnolo, riformatore con santa Teresa, poeta mistico e Dottore della Chiesa. Morì nel 1591."},"12-21":{"en":"Dutch Jesuit and Doctor of the Church, whose catechisms renewed the faith in Germany. He died in 1597.","es":"Jesuita holandés y Doctor de la Iglesia, cuyos catecismos renovaron la fe en Alemania. Murió en 1597.","pt":"Jesuíta holandês e Doutor da Igreja, cujos catecismos renovaram a fé na Alemanha. Morreu em 1597.","it":"Gesuita olandese e Dottore della Chiesa, i cui catechismi rinnovarono la fede in Germania. Morì nel 1597."},"12-23":{"en":"Polish priest and professor at Kraków, known for his charity to the poor. He died in 1473.","es":"Sacerdote polaco y profesor en Cracovia, conocido por su caridad con los pobres. Murió en 1473.","pt":"Sacerdote polonês e professor em Cracóvia, conhecido por sua caridade com os pobres. Morreu em 1473.","it":"Sacerdote polacco e professore a Cracovia, noto per la sua carità verso i poveri. Morì nel 1473."},"12-25":{"en":"The Word became flesh and dwelt among us: the Son of God is born of the Virgin Mary in Bethlehem.","es":"El Verbo se hizo carne y habitó entre nosotros: el Hijo de Dios nace de la Virgen María en Belén.","pt":"O Verbo se fez carne e habitou entre nós: o Filho de Deus nasce da Virgem Maria em Belém.","it":"Il Verbo si fece carne e venne ad abitare in mezzo a noi: il Figlio di Dio nasce dalla Vergine Maria a Betlemme."},"12-26":{"en":"Deacon and first martyr, stoned in Jerusalem, who forgave those who killed him, as Christ did.","es":"Diácono y primer mártir, apedreado en Jerusalén, que perdonó a quienes lo mataban, como Cristo.","pt":"Diácono e primeiro mártir, apedrejado em Jerusalém, que perdoou os que o matavam, como Cristo.","it":"Diacono e primo martire, lapidato a Gerusalemme, che perdonò coloro che lo uccidevano, come Cristo."},"12-27":{"en":"The beloved disciple, who stood at the cross and took Mary into his home. Author of the fourth Gospel.","es":"El discípulo amado, que estuvo al pie de la cruz y recibió a María en su casa. Autor del cuarto Evangelio.","pt":"O discípulo amado, que esteve ao pé da cruz e recebeu Maria em sua casa. Autor do quarto Evangelho.","it":"Il discepolo amato, che stette ai piedi della croce e accolse Maria nella sua casa. Autore del quarto Vangelo."},"12-28":{"en":"The children of Bethlehem killed by Herod, who bore witness to Christ not by speaking but by dying.","es":"Los niños de Belén asesinados por Herodes, que dieron testimonio de Cristo no hablando, sino muriendo.","pt":"As crianças de Belém assassinadas por Herodes, que deram testemunho de Cristo não falando, mas morrendo.","it":"I bambini di Betlemme uccisi da Erode, che resero testimonianza a Cristo non parlando, ma morendo."},"12-29":{"en":"Archbishop of Canterbury, killed in his cathedral in 1170 for defending the freedom of the Church.","es":"Arzobispo de Canterbury, asesinado en su catedral en 1170 por defender la libertad de la Iglesia.","pt":"Arcebispo de Cantuária, assassinado em sua catedral em 1170 por defender a liberdade da Igreja.","it":"Arcivescovo di Canterbury, ucciso nella sua cattedrale nel 1170 per aver difeso la libertà della Chiesa."},"12-31":{"en":"Pope from 314 to 335, in the age of Constantine, when the Church gained its freedom and the Council of Nicaea was held.","es":"Papa del 314 al 335, en la época de Constantino, cuando la Iglesia obtuvo la libertad y se celebró el Concilio de Nicea.","pt":"Papa de 314 a 335, na época de Constantino, quando a Igreja obteve a liberdade e se realizou o Concílio de Niceia.","it":"Papa dal 314 al 335, al tempo di Costantino, quando la Chiesa ottenne la libertà e si tenne il Co function fieldHTML(f, val, id) {

  }
  if (f.type === "area") return `<div class="fld">${lab}<textarea data-id="${id}">${esc(val)}</textarea></div>`;
  if (f.type === "select") return `<div class="fld">${lab}<select data-id="${id}">${f.options.map(o => `<option ${o == val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
  if (f.type === "check") return `<div class="fld"><label><input type="checkbox" data-id="${id}" ${val ? "checked" : ""} style="width:auto;margin-right:8px">${esc(f.label)}</label></div>`;
  if (f.type === "list") return `<div class="fld">${lab}<textarea data-id="${id}" placeholder="One per line">${esc((val || []).join("\n"))}</textarea></div>`;
  if (f.type === "yt") return `<div class="fld">${lab}<input data-id="${id}" value="${esc(val ? "https://www.youtube.com/watch?v=" + val : "")}" placeholder="https://www.youtube.com/watch?v=…"></div>`;
  return `<div class="fld">${lab}<input data-id="${id}" type="${f.type === "number" ? "number" : "text"}" value="${esc(f.type === "image" && String(val).startsWith("data:") ? "[uploaded photo]" : val)}" ${f.type === "image" && String(val).startsWith("data:") ? `data-raw="${esc(val)}"` : ""}>${f.type === "image" ? `<div style="display:flex;gap:10px;align-items:center;margin-top:6px"><div class="imgprev" data-prev="${id}" style="margin:0;background-image:url('${esc(thumbURL(val))}')"></div><label class="btn s" style="cursor:pointer">Upload photo<input type="file" accept="image/*" data-up="${id}" style="display:none"></label></div>` : ""}${f.help ? `<small style="color:var(--mute)">${esc(f.help)}</small>` : ""}</div>`;

function readField(f, root, id) {

  const el = root.querySelector(`[data-id="${id}"]`);

}

$("#ddel").onclick = async () => { if (!can("Editor")) return; if (!await ask("Delete this item?", "This removes it from the website when you publish.")) return; const s = S[dctx.v]; getP(C, s.list).splice(dctx.i, 1); setDirty(true); const v = dctx.v; closeD(); go(v); };

async function geocode(a) {
  try { const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(a)}`, { headers: { "Accept-Language": "en" } }); const j = await r.json(); return j[0] ? [(+j[0].lat).toFixed(5), (+j[0].lon).toFixed(5)] : null; } catch (e) { return null; }
}
async function geoAll() { const P = C.way.parishes; let n = 0; for (const p of P) { if (p.lat === "" || p.lat == null) { const r = await geocode(p.address); if (r) { p.lat = +r[0]; p.lng = +r[1]; n++; } await new Promise(r => setTimeout(r, 1100)); } } setDirty(n > 0); toast(n ? `${n} located` : "Nothing to locate"); go("way"); }

function dl(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); }
function publish(what) { C._ts = Date.now(); LS.set(STORE, C); setDirty(false); log(what || `Saved changes (${$("#vt").textContent})`); toast("Saved in Domus. To put it online, open \u201cPublish to website\u201d."); go(cur); }

window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
