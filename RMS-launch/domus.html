<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Domus · Redemptoris Mater Seminary — Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1530;--navy2:#13244d;--gold:#c9a45c;--gold2:#e6cd8f;--ivory:#f7f3ea;--paper:#f6f5f1;--ink:#1a2138;--mute:#667089;--line:#e3e1da;--ok:#2f7a45;--bad:#b3261e;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;hyphens:none;-webkit-hyphens:none}
button,input,select,textarea{font:inherit;color:inherit}

.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:#f6f1e6}
.lart{position:relative;background:#0b1530 center/cover;overflow:hidden}
.lart{animation:lzoom 30s ease-in-out infinite alternate}
@keyframes lzoom{to{background-size:115%}}
.lshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,17,39,.35),rgba(8,17,39,.85))}
.lbrand{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#efe9da;padding:0 30px}
.lbrand #lgSeal{display:block;width:96px;margin:0 auto 22px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5))}
.lbrand #lgName{display:block;width:min(460px,80%);margin:0 auto}
.lorn{display:flex;align-items:center;justify-content:center;gap:14px;color:#e8cf8e;margin:20px 0 10px}
.lorn::before,.lorn::after{content:"";width:70px;height:1px;background:linear-gradient(90deg,transparent,#e8cf8e)}
.lorn::after{transform:scaleX(-1)}
.lbrand p{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:#d8d2c2}
.lpanel{display:flex;align-items:center;justify-content:center;padding:40px;position:relative}
.lpanel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#f1dda3,#cfa94f,#a8812f,#e6c77c)}
.login .box{width:100%;max-width:400px;background:none;box-shadow:none;padding:0}
.lk{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:#a17a2c;font-weight:600}
.login h1{font-family:var(--serif);font-weight:500;font-size:3rem;line-height:1;margin:10px 0 8px;color:#1a2138}
.ls{color:var(--mute);margin-bottom:30px}
.lf{display:block;margin-bottom:16px}
.lf span{display:block;font-size:.74rem;font-weight:600;color:#3b4258;margin-bottom:6px;letter-spacing:.04em}
.lf input{width:100%;padding:14px 16px;border:1px solid #ddd5c3;border-radius:12px;background:#fff;font-size:.95rem;transition:.2s}
.lf input:focus{outline:0;border-color:#c9a45c;box-shadow:0 0 0 4px rgba(201,164,92,.18)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:1rem;opacity:.6}
.lbtn{width:100%;justify-content:center;padding:15px;font-size:1rem;border-radius:12px;margin-top:6px;background:linear-gradient(135deg,#f1dda3,#cfa94f 40%,#a8812f);border:0;color:#1d1608}
.lbtn:hover{filter:brightness(1.05)}
.login small{display:block;text-align:center;color:var(--mute);margin-top:22px;font-size:.76rem}
@media(max-width:860px){.login{grid-template-columns:1fr}.lart{min-height:42vh}}
.dlg{position:fixed;inset:0;z-index:80;background:rgba(11,21,48,.45);display:none;align-items:center;justify-content:center;padding:20px}
.dlg.on{display:flex}
.dbox{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:440px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.dbox h3{font-family:var(--serif);font-weight:500;font-size:1.6rem;margin-bottom:6px}
.dbox p{color:var(--mute);margin-bottom:14px}
.dact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.err{color:var(--bad);font-size:.85rem;min-height:20px}
.app{display:none;min-height:100vh;grid-template-columns:250px 1fr}
.app.on{display:grid}
aside{background:var(--navy);color:#c2c8d8;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
aside .logo b{font-family:var(--serif);font-size:1.7rem;font-weight:500;color:#fff;line-height:1}
aside .logo small{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
aside h6{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:#6f7896;margin:16px 10px 6px;font-weight:600}
aside a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#c2c8d8;text-decoration:none;cursor:pointer;font-size:.88rem}
aside a:hover{background:rgba(255,255,255,.06);color:#fff}
aside a.on{background:var(--gold);color:var(--navy);font-weight:500}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px}
main{padding:0 0 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;gap:12px}
.top h2{font-family:var(--serif);font-size:1.8rem;font-weight:500}
.top .r{display:flex;align-items:center;gap:10px}
.who{font-size:.82rem;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;font-size:.85rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.d{color:var(--bad)}
.btn.s{padding:5px 10px;font-size:.78rem}
.view{padding:28px 32px;max-width:1150px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.card small{color:var(--mute);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.card b{display:block;font-family:var(--serif);font-size:2.4rem;font-weight:500;line-height:1.1}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.panel h3{font-family:var(--serif);font-size:1.4rem;font-weight:500;margin-bottom:12px}
.hint{color:var(--mute);font-size:.82rem;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fbfaf7}
.thumb{width:40px;height:50px;border-radius:6px;background:#ddd center/cover}
.f{display:grid;gap:14px}
.fld label{display:block;font-size:.76rem;font-weight:600;color:#3b4258;margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld textarea{min-height:90px;resize:vertical}
.ml{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ml.area{grid-template-columns:1fr 1fr}
.ml div{position:relative}
.ml span{position:absolute;top:7px;right:8px;font-size:.62rem;font-weight:700;color:var(--gold);letter-spacing:.1em}
.ml input{padding-right:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:#fff;z-index:20;transform:translateX(110%);transition:.3s;visibility:hidden;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;box-shadow:-30px 0 60px -20px rgba(0,0,0,.3)}
.drawer header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer header h3{font-family:var(--serif);font-size:1.6rem;font-weight:500}
.drawer .body{padding:22px 24px;overflow:auto;flex:1}
.drawer footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.shade{position:fixed;inset:0;background:rgba(11,21,48,.35);z-index:19;display:none}
.shade.on{display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:50;transition:.3s;opacity:0}
.toast.on{transform:translateX(-50%);opacity:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--ivory)}
.pill.new{background:#fde8e6;color:var(--bad)}.pill.read{background:#eef1f8;color:#3a4c86}.pill.done{background:#e7f3ea;color:var(--ok)}
.msg{white-space:pre-wrap;color:#3b4258;max-width:520px}
.ro input,.ro textarea,.ro select{pointer-events:none;background:#f6f6f3}
.imgprev{height:70px;border-radius:8px;background:#eee center/cover;margin-top:6px;max-width:160px}
.dirty{display:none;color:var(--bad);font-size:.8rem;font-weight:600}
.dirty.on{display:inline}
@media(max-width:900px){.app.on{grid-template-columns:1fr}aside{position:static;height:auto}.cards{grid-template-columns:1fr 1fr}.ml{grid-template-columns:1fr 1fr}}
</style>

window.RMS_DEFAULT = {"version":2,"site":{"name":"Redemptoris Mater Archdiocesan Missionary Seminary of Boston","short":"Redemptoris Mater Seminary","address1":"774 Boylston Street","address2":"Chestnut Hill, MA 02467-2501","phone":"617-879-9813","email":"seminary@rmsboston.org","taxId":"37-1537512","logo":"img:logo_rm","social":{"facebook":"https://www.facebook.com/rmsboston","youtube":"https://www.youtube.com/@redemptorismaterseminarybo5903","instagram":"https://www.instagram.com/redemptorismaterseminary/"},"links":{"online":"https://giving.parishsoft.com/app/giving/rmsboston","venmo":"https://venmo.com/rmsboston","venmoHandle":"@RMSBOSTON","cashapp":"http://cash.app/$rmsboston","cashappHandle":"$RMSBOSTON","paypal":"","textNumber":"857-663-7535","textKeyword":"$RMSBOSTON","brick":"https://rmsboston.ticketspice.com/brick"}},"hero":{"image":"img:front_page","eyebrow":{"en":"Archdiocese of Boston · Since 2005","es":"Arquidiócesis de Boston · Desde 2005","pt":"Arquidiocese de Boston · Desde 2005","it":"Arcidiocesi di Boston · Dal 2005"},"title":{"en":"Forming priests for the New Evangelization","es":"Formando sacerdotes para la Nueva Evangelización","pt":"Formando sacerdotes para a Nova Evangelização","it":"Formare sacerdoti per la Nuova Evangelizzazione"},"subtitle":{"en":"An international house forming priests for the New Evangelization of the Church and the Missio ad Gentes.","es":"Una casa internacional que forma sacerdotes para la Nueva Evangelización de la Iglesia y la Missio ad Gentes.","pt":"Uma casa internacional que forma sacerdotes para a Nova Evangelização da Igreja e a Missio ad Gentes.","it":"Una casa internazionale che forma sacerdoti per la Nuova Evangelizzazione della Chiesa e la Missio ad Gentes."}},"stats":[{"value":"2005","label":{"en":"Seminary opened","es":"Apertura del Seminario","pt":"Abertura do Seminário","it":"Apertura del Seminario"}},{"value":"23","label":{"en":"Priests ordained","es":"Sacerdotes ordenados","pt":"Sacerdotes ordenados","it":"Sacerdoti ordinati"}},{"value":"21","label":{"en":"Seminarians today","es":"Seminaristas hoy","pt":"Seminaristas hoje","it":"Seminaristi oggi"}},{"value":"6","label":{"en":"In itinerancy","es":"En itinerancia","pt":"Em itinerância","it":"In itineranza"}}],"welcome":{"body":{"en":"Dear Friends,\n\nThe Redemptoris Mater Archdiocesan Missionary Seminary of Boston is an international house forming priests for the New Evangelization of the Church and the “Missio ad Gentes.”\n\nOur seminarians discover their vocation through the Neocatechumenal Way, which St. John Paul II called “an itinerary of Catholic formation valid for our society and our time.” After ordination they serve in the Archdiocese of Boston or wherever the Archbishop sends them.\n\nWe invite you to explore this site, including to receive the seminary newsletter and other communications.\n\nEnjoy your visit and pray for us!","es":"Queridos amigos:\n\nEl Seminario Arquidiocesano Misionero Redemptoris Mater de Boston es una casa internacional que forma sacerdotes para la Nueva Evangelización de la Iglesia y la “Missio ad Gentes.”\n\nNuestros seminaristas descubren su vocación a través del Camino Neocatecumenal, que San Juan Pablo II llamó “un itinerario de formación católica válido para nuestra sociedad y para nuestro tiempo.” Después de la ordenación sirven en la Arquidiócesis de Boston o donde el Arzobispo los envíe.\n\nLos invitamos a recorrer este sitio y a suscribirse para recibir el boletín del seminario y otras comunicaciones.\n\n¡Disfruten su visita y recen por nosotros!","pt":"Queridos amigos,\n\nO Seminário Arquidiocesano Missionário Redemptoris Mater de Boston é uma casa internacional que forma sacerdotes para a Nova Evangelização da Igreja e a “Missio ad Gentes.”\n\nNossos seminaristas descobrem sua vocação por meio do Caminho Neocatecumenal, que São João Paulo II chamou de “um itinerário de formação católica válido para a nossa sociedade e para o nosso tempo.” Depois da ordenação, servem na Arquidiocese de Boston ou onde o Arcebispo os enviar.\n\nConvidamos você a percorrer este site e a se inscrever para receber o boletim do seminário e outras comunicações.\n\nAproveite a visita e reze por nós!","it":"Cari amici,\n\nil Seminario Arcidiocesano Missionario Redemptoris Mater di Boston è una casa internazionale che forma sacerdoti per la Nuova Evangelizzazione della Chiesa e la “Missio ad Gentes.”\n\nI nostri seminaristi scoprono la loro vocazione attraverso il Cammino Neocatecumenale, che San Giovanni Paolo II ha definito “un itinerario di formazione cattolica valido per la nostra società e per i nostri tempi.” Dopo l'ordinazione servono nell'Arcidiocesi di Boston o dovunque l'Arcivescovo li invii.\n\nVi invitiamo a visitare questo sito e a iscrivervi per ricevere il notiziario del seminario e altre comunicazioni.\n\nBuona visita e pregate per noi!"},"signer":"Very Rev. Antonio F. Medeiros","role":{"en":"Rector","es":"Rector","pt":"Reitor","it":"Rettore"},"signature":"img:signature_rector","photo":"img:rector","art":"img:art_christ_face"},"history":[{"year":"1987","title":{"en":"The first Redemptoris Mater","es":"El primer Redemptoris Mater","pt":"O primeiro Redemptoris Mater","it":"Il primo Redemptoris Mater"},"text":{"en":"St. John Paul II opens the first Redemptoris Mater Seminary in Rome.","es":"San Juan Pablo II abre el primer Seminario Redemptoris Mater en Roma.","pt":"São João Paulo II abre o primeiro Seminário Redemptoris Mater em Roma.","it":"San Giovanni Paolo II apre il primo Seminario Redemptoris Mater a Roma."}},{"year":"2005","title":{"en":"Opening in Boston","es":"Apertura en Boston","pt":"Abertura em Boston","it":"Apertura a Boston"},"text":{"en":"Encouraged by the example of St. John Paul II, Cardinal Seán P. O’Malley, OFM Cap, opens the seminary in September 2005.","es":"Animado por el ejemplo de San Juan Pablo II, el Cardenal Seán P. O’Malley, OFM Cap, abre el seminario en septiembre de 2005.","pt":"Encorajado pelo exemplo de São João Paulo II, o Cardeal Seán P. O’Malley, OFM Cap, abre o seminário em setembro de 2005.","it":"Incoraggiato dall'esempio di San Giovanni Paolo II, il Cardinale Seán P. O’Malley, OFM Cap, apre il seminario nel settembre 2005."}},{"year":"2006","title":{"en":"Canonical erection","es":"Erección canónica","pt":"Ereção canônica","it":"Erezione canonica"},"text":{"en":"Officially erected by Cardinal O’Malley on March 25, 2006, the Solemnity of the Annunciation.","es":"Erigido oficialmente por el Cardenal O’Malley el 25 de marzo de 2006, solemnidad de la Anunciación.","pt":"Erigido oficialmente pelo Cardeal O’Malley em 25 de março de 2006, solenidade da Anunciação.","it":"Eretto ufficialmente dal Cardinale O’Malley il 25 marzo 2006, solennità dell'Annunciazione."}},{"year":"Today","title":{"en":"Priests sent on mission","es":"Sacerdotes enviados en misión","pt":"Sacerdotes enviados em missão","it":"Sacerdoti inviati in missione"},"text":{"en":"Priests formed here serve the Archdiocese of Boston in its Parishes and Central Ministries, while others have been sent on mission to Atlanta, Georgia; the Samoan Islands; and the U.S. Virgin Islands.","es":"Los sacerdotes formados aquí sirven a la Arquidiócesis de Boston en sus parroquias y ministerios centrales, mientras que otros han sido enviados en misión a Atlanta, Georgia; a las Islas Samoa; y a las Islas Vírgenes de los Estados Unidos.","pt":"Os sacerdotes formados aqui servem a Arquidiocese de Boston em suas paróquias e ministérios centrais, enquanto outros foram enviados em missão para Atlanta, Geórgia; as Ilhas Samoa; e as Ilhas Virgens dos Estados Unidos.","it":"I sacerdoti formati qui servono l'Arcidiocesi di Boston nelle sue parrocchie e nei ministeri centrali, mentre altri sono stati inviati in missione ad Atlanta, Georgia; nelle Isole Samoa; e nelle Isole Vergini americane."}}],"historyNote":{"en":"Responding to the call of the Second Vatican Council for a better distribution of the clergy, priests formed at the Redemptoris Mater Seminary receive a grace from God to look for the lost sheep and invite them to discover the mercy of God through the maternal care of the Church.","es":"Respondiendo al llamado del Concilio Vaticano II a una mejor distribución del clero, los sacerdotes formados en el Seminario Redemptoris Mater reciben de Dios la gracia de buscar a la oveja perdida e invitarla a descubrir la misericordia de Dios a través del cuidado maternal de la Iglesia.","pt":"Respondendo ao chamado do Concílio Vaticano II a uma melhor distribuição do clero, os sacerdotes formados no Seminário Redemptoris Mater recebem de Deus a graça de procurar a ovelha perdida e convidá-la a descobrir a misericórdia de Deus por meio do cuidado materno da Igreja.","it":"Rispondendo all'appello del Concilio Vaticano II per una migliore distribuzione del clero, i sacerdoti formati nel Seminario Redemptoris Mater ricevono da Dio la grazia di cercare la pecora perduta e di invitarla a scoprire la misericordia di Dio attraverso la cura materna della Chiesa."},"formationIntro":{"en":"All seminarians are prepared for the priesthood following the four essential pillars of priestly formation, namely human, intellectual, spiritual, and pastoral, and, before being ordained priests of the Archdiocese of Boston, they spend three years in missionary formation.","es":"Todos los seminaristas se preparan mediante la formación humana, intelectual, espiritual y pastoral. Antes de ser ordenados sacerdotes de la Arquidiócesis de Boston, los seminaristas pasan tres años en formación misionera.","pt":"Todos os seminaristas são preparados pela formação humana, intelectual, espiritual e pastoral. Antes da ordenação como sacerdotes da Arquidiocese de Boston, os seminaristas passam três anos em formação missionária.","it":"Tutti i seminaristi sono preparati mediante la formazione umana, intellettuale, spirituale e pastorale. Prima dell'ordinazione come sacerdoti dell'Arcidiocesi di Boston, i seminaristi trascorrono tre anni di formazione missionaria."},"stages":[{"key":"Propaedeutic","name":{"en":"Propaedeutic","es":"Propedéutico","pt":"Propedêutico","it":"Propedeutica"},"text":{"en":"The introductory stage: a foundation in prayer, community life and discernment.","es":"La etapa introductoria: fundamento en la oración, la vida comunitaria y el discernimiento.","pt":"A etapa introdutória: fundamento na oração, na vida comunitária e no discernimento.","it":"La tappa introduttiva: fondamento nella preghiera, nella vita comunitaria e nel discernimento."}},{"key":"Discipleship","name":{"en":"Discipleship","es":"Discipulado","pt":"Discipulado","it":"Discepolato"},"text":{"en":"Following Christ more closely, with the study of philosophy.","es":"Seguir más de cerca a Cristo, con el estudio de la filosofía.","pt":"Seguir mais de perto a Cristo, com o estudo da filosofia.","it":"Seguire più da vicino Cristo, con lo studio della filosofia."}},{"key":"Configuration","name":{"en":"Configuration","es":"Configuración","pt":"Configuração","it":"Configurazione"},"text":{"en":"Being configured to Christ the Good Shepherd, with the study of theology.","es":"Configurarse con Cristo Buen Pastor, con el estudio de la teología.","pt":"Configurar-se a Cristo Bom Pastor, com o estudo da teologia.","it":"Configurarsi a Cristo Buon Pastore, con lo studio della teologia."}},{"key":"Itinerancy","name":{"en":"Itinerancy","es":"Itinerancia","pt":"Itinerância","it":"Itineranza"},"text":{"en":"Missionary formation: being sent to proclaim the Gospel, trusting in Providence.","es":"Formación misionera: ser enviado a anunciar el Evangelio, confiando en la Providencia.","pt":"Formação missionária: ser enviado a anunciar o Evangelho, confiando na Providência.","it":"Formazione missionaria: essere inviati ad annunciare il Vangelo, confidando nella Provvidenza."}}],"seminarians":[{"name":"Gustavo Neitzke","origin":"Campo Mourão, Brazil","stage":"Configuration","parish":"Cathedral of the Holy Cross, Boston","photo":"img:gustavo","story":{"en":"Growing up as the fourth of five children in a Catholic family, the image of the priest was always present in my life. Over the years I met many holy priests whom I admired. At World Youth Day in Rio de Janeiro, I experienced the call to the priesthood in a way stronger than ever. The words from the gospel of Mathew, “Come and follow me, and I will make you fishers of man,” gave me the push to follow this call. However, after three years in the seminary, I left formation. During the two years I spent back home, my mother was diagnosed with cancer. The dedication that the priests showed to her and my family up until her passing was a consolation that led me to reconsider my vocation and enter back into the seminary.","es":"Al crecer como el cuarto de cinco hijos en una familia católica, la imagen del sacerdote estuvo siempre presente en mi vida. A lo largo de los años conocí a muchos sacerdotes santos a quienes admiraba. En la Jornada Mundial de la Juventud en Río de Janeiro experimenté la llamada al sacerdocio con más fuerza que nunca. Las palabras del Evangelio de Mateo, «Venid en pos de mí y os haré pescadores de hombres», me dieron el impulso para seguir esta llamada. Sin embargo, después de tres años en el seminario, dejé la formación. Durante los dos años que pasé en casa, a mi madre le diagnosticaron cáncer. La entrega que los sacerdotes mostraron hacia ella y hacia mi familia hasta su muerte fue un consuelo que me llevó a reconsiderar mi vocación y a volver a entrar en el seminario.","pt":"Crescendo como o quarto de cinco filhos numa família católica, a imagem do sacerdote esteve sempre presente na minha vida. Ao longo dos anos conheci muitos sacerdotes santos que eu admirava. Na Jornada Mundial da Juventude no Rio de Janeiro, experimentei o chamado ao sacerdócio de forma mais forte do que nunca. As palavras do Evangelho de Mateus, «Vinde após mim, e eu vos farei pescadores de homens», deram-me o impulso para seguir este chamado. Contudo, depois de três anos no seminário, deixei a formação. Durante os dois anos em que estive em casa, minha mãe foi diagnosticada com câncer. A dedicação que os sacerdotes mostraram a ela e à minha família até a sua morte foi um consolo que me levou a reconsiderar a minha vocação e a voltar para o seminário.","it":"Crescendo come il quarto di cinque figli in una famiglia cattolica, la figura del sacerdote è sempre stata presente nella mia vita. Negli anni ho conosciuto molti sacerdoti santi che ammiravo. Alla Giornata Mondiale della Gioventù di Rio de Janeiro ho sentito la chiamata al sacerdozio più forte che mai. Le parole del Vangelo di Matteo, «Venite dietro a me, vi farò pescatori di uomini», mi hanno dato la spinta per seguire questa chiamata. Tuttavia, dopo tre anni di seminario, ho lasciato la formazione. Nei due anni trascorsi a casa, a mia madre è stato diagnosticato un cancro. La dedizione che i sacerdoti hanno mostrato a lei e alla mia famiglia fino alla sua morte è stata una consolazione che mi ha portato a riconsiderare la mia vocazione e a rientrare in seminario."}},{"name":"Aaron Sanz","origin":"Bogota, New Jersey","stage":"Configuration","parish":"Cathedral of the Holy Cross, Boston","photo":"img:aaron","story":{"en":"I am the second of eleven siblings. My family was always involved in our home parish, which allowed me to draw close to my pastor. The love he had for his ministry really left an impression on me. Growing up I dedicated much of time to my hobbies, especially music. I hoped that after High School I would be able to have a career in music composition, but it seemed that God had different plans for me. When I attended World Youth Day in Rio de Janeiro, my older brother and I both felt that we were being called to the priesthood. My brother eventually entered the seminary in Philadelphia, while I instead tried to run from the call. However, God was so persistent, that I finally decided to join the seminary as well.","es":"Soy el segundo de once hermanos. Mi familia siempre participó en nuestra parroquia, lo que me permitió acercarme a mi párroco. El amor que tenía por su ministerio me impresionó profundamente. Durante mi juventud dediqué mucho tiempo a mis aficiones, especialmente a la música. Esperaba que, después de la escuela secundaria, pudiera hacer carrera en la composición musical, pero parecía que Dios tenía otros planes para mí. Cuando asistí a la Jornada Mundial de la Juventud en Río de Janeiro, mi hermano mayor y yo sentimos que éramos llamados al sacerdocio. Con el tiempo mi hermano entró en el seminario de Filadelfia, mientras que yo intenté huir de la llamada. Sin embargo, Dios fue tan insistente que finalmente decidí entrar también en el seminario.","pt":"Sou o segundo de onze irmãos. Minha família sempre participou da nossa paróquia, o que me permitiu aproximar-me do meu pároco. O amor que ele tinha pelo seu ministério marcou-me profundamente. Ao crescer, dediquei muito tempo aos meus passatempos, sobretudo à música. Esperava que, depois do ensino médio, pudesse seguir carreira em composição musical, mas parecia que Deus tinha outros planos para mim. Quando participei da Jornada Mundial da Juventude no Rio de Janeiro, meu irmão mais velho e eu sentimos que estávamos sendo chamados ao sacerdócio. Com o tempo, meu irmão entrou no seminário de Filadélfia, enquanto eu tentei fugir do chamado. Porém, Deus foi tão insistente que finalmente decidi entrar também no seminário.","it":"Sono il secondo di undici fratelli. La mia famiglia è sempre stata impegnata nella nostra parrocchia, e questo mi ha permesso di avvicinarmi al mio parroco. L'amore che aveva per il suo ministero mi ha colpito profondamente. Crescendo ho dedicato molto tempo ai miei interessi, soprattutto alla musica. Speravo, dopo le scuole superiori, di poter intraprendere la carriera di compositore, ma sembrava che Dio avesse altri progetti per me. Quando ho partecipato alla Giornata Mondiale della Gioventù a Rio de Janeiro, io e mio fratello maggiore abbiamo sentito entrambi di essere chiamati al sacerdozio. Mio fratello è poi entrato nel seminario di Filadelfia, mentre io ho cercato di fuggire dalla chiamata. Ma Dio è stato così insistente che alla fine ho deciso di entrare anch'io in seminario."}},{"name":"Edward Rodriguez","origin":"Houston, Texas","stage":"Itinerancy","parish":"St. Rose of Lima, Chelsea","photo":"img:edward","story":{"en":"Of three siblings I am the oldest and the only boy. My parents are from Mexico and raised us in the Catholic faith. Thanks to the charism of the Neocatechumenal Way, I have been able to understand the faith more in-depth. During my time in college, I felt the calling to the priesthood, and the goals that I was slowly establishing for myself did not make me happy. Seeing my parents go to church and pray pushed me to take my faith more seriously. Also, I remember how I looked up to a priest from the Neocatechumenal Way; seeing how he related to people always struck me. His example and the help of my Catechists eventually opened me up to the call to the priesthood and the possibility of going to the seminary.","es":"De tres hermanos, soy el mayor y el único varón. Mis padres son de México y nos educaron en la fe católica. Gracias al carisma del Camino Neocatecumenal he podido comprender la fe con más profundidad. Durante mis años en la universidad sentí la llamada al sacerdocio, y las metas que poco a poco me iba proponiendo no me hacían feliz. Ver a mis padres ir a la iglesia y rezar me impulsó a tomar mi fe más en serio. Recuerdo también cuánto admiraba a un sacerdote del Camino Neocatecumenal; siempre me impresionó cómo se relacionaba con la gente. Su ejemplo y la ayuda de mis catequistas me abrieron finalmente a la llamada al sacerdocio y a la posibilidad de entrar en el seminario.","pt":"Dos três irmãos, sou o mais velho e o único menino. Meus pais são do México e nos criaram na fé católica. Graças ao carisma do Caminho Neocatecumenal, pude compreender a fé com mais profundidade. Durante a faculdade, senti o chamado ao sacerdócio, e as metas que eu ia estabelecendo para mim não me faziam feliz. Ver meus pais irem à igreja e rezarem levou-me a levar a minha fé mais a sério. Lembro-me também de como admirava um sacerdote do Caminho Neocatecumenal; a forma como ele se relacionava com as pessoas sempre me tocou. O seu exemplo e a ajuda dos meus catequistas acabaram por abrir-me ao chamado ao sacerdócio e à possibilidade de entrar no seminário.","it":"Di tre fratelli sono il maggiore e l'unico maschio. I miei genitori sono messicani e ci hanno cresciuti nella fede cattolica. Grazie al carisma del Cammino Neocatecumenale ho potuto comprendere la fede più in profondità. Durante gli anni dell'università ho sentito la chiamata al sacerdozio, e gli obiettivi che a poco a poco mi ero posto non mi rendevano felice. Vedere i miei genitori andare in chiesa e pregare mi ha spinto a prendere più sul serio la mia fede. Ricordo anche quanto ammiravo un sacerdote del Cammino Neocatecumenale: il suo modo di rapportarsi con le persone mi ha sempre colpito. Il suo esempio e l'aiuto dei miei catechisti mi hanno infine aperto alla chiamata al sacerdozio e alla possibilità di entrare in seminario."}},{"name":"Michael Castellon","origin":"Chinandega, Nicaragua","stage":"Itinerancy","parish":"Immaculate Conception, Marlborough","photo":"img:michael","story":{"en":"As the fourth of seven children, and at a very young age, I was faced with the premature death of my mother. However, God did not abandon me. He prepared another woman to be my mother who not only took care of me, but most importantly, raised me and my siblings in the faith. She used to say that God has a plan for each person, but that the voice of God is not always easily heard. Nonetheless, inspired by my mother's faith, I decided to leave my studies, family, comfort, and start on the path to the priesthood. The time of the seminary has been a period of grace where I have discovered that, despite my weaknesses, I am loved and accepted just as I am.","es":"Soy el cuarto de siete hijos y, siendo muy pequeño, tuve que afrontar la muerte prematura de mi madre. Sin embargo, Dios no me abandonó. Preparó a otra mujer para que fuera mi madre, que no solo cuidó de mí, sino que, sobre todo, nos educó a mí y a mis hermanos en la fe. Ella solía decir que Dios tiene un plan para cada persona, pero que la voz de Dios no siempre se escucha con facilidad. Aun así, inspirado por la fe de mi madre, decidí dejar mis estudios, mi familia y mis comodidades, y emprender el camino hacia el sacerdocio. El tiempo del seminario ha sido un tiempo de gracia en el que he descubierto que, a pesar de mis debilidades, soy amado y aceptado tal como soy.","pt":"Sou o quarto de sete filhos e, ainda muito pequeno, enfrentei a morte prematura da minha mãe. Contudo, Deus não me abandonou. Preparou outra mulher para ser minha mãe, que não só cuidou de mim, mas, sobretudo, educou a mim e aos meus irmãos na fé. Ela costumava dizer que Deus tem um plano para cada pessoa, mas que a voz de Deus nem sempre se ouve com facilidade. Mesmo assim, inspirado pela fé da minha mãe, decidi deixar os estudos, a família e o conforto, e começar o caminho rumo ao sacerdócio. O tempo de seminário tem sido um tempo de graça, em que descobri que, apesar das minhas fraquezas, sou amado e aceito tal como sou.","it":"Sono il quarto di sette figli e, quando ero molto piccolo, ho dovuto affrontare la morte prematura di mia madre. Dio però non mi ha abbandonato. Ha preparato un'altra donna perché fosse mia madre: non solo si è presa cura di me, ma soprattutto ha cresciuto me e i miei fratelli nella fede. Diceva spesso che Dio ha un progetto per ogni persona, ma che la voce di Dio non sempre si ascolta facilmente. Ispirato dalla fede di mia madre, ho deciso di lasciare gli studi, la famiglia e le mie comodità, e di intraprendere il cammino verso il sacerdozio. Il tempo del seminario è stato un tempo di grazia, in cui ho scoperto che, nonostante le mie debolezze, sono amato e accolto così come sono."}},{"name":"Gerson Garcia","origin":"Los Angeles, California","stage":"Itinerancy","parish":"St. Rose of Lima, Chelsea","photo":"img:gerson","story":{"en":"I am the second of three siblings born and raised in Los Angeles, California. Although I grew up in a Catholic family attending Mass every Sunday, I felt that I did not know who God was in my life and he was never in my thoughts. I first heard the Lord to the priesthood while attending World Youth Day in 2016. However, my mind at the time was in weightlifting and on becoming a soccer player. As I resisted the call of the Lord, God allowed me to glimpse at life without him and I entered in a big crisis about the meaning of my life. During this time, my Neocatechumenal community played a pivotal role in helping me keep my ears open to the Word of God and I saw the tenderness of the Lord paving a way to help me rediscover him through an experience of true peace, the forgiveness of my sins and an even stronger call from God. Today I am happy the Lord gave me the grace to abandon my worthless projects and to have “chosen the better part” discerning my vocation.","es":"Soy el segundo de tres hermanos, nacido y criado en Los Ángeles, California. Aunque crecí en una familia católica que iba a Misa todos los domingos, sentía que no sabía quién era Dios en mi vida y nunca estaba en mis pensamientos. Escuché por primera vez la llamada del Señor al sacerdocio durante la Jornada Mundial de la Juventud de 2016. Sin embargo, en aquel momento mi mente estaba en el levantamiento de pesas y en llegar a ser futbolista. Mientras me resistía a la llamada del Señor, Dios permitió que vislumbrara la vida sin Él, y entré en una gran crisis sobre el sentido de mi vida. Durante ese tiempo, mi comunidad neocatecumenal tuvo un papel decisivo para ayudarme a mantener los oídos abiertos a la Palabra de Dios, y vi la ternura del Señor abriendo un camino para que lo redescubriera a través de una experiencia de verdadera paz, del perdón de mis pecados y de una llamada de Dios aún más fuerte. Hoy soy feliz de que el Señor me haya dado la gracia de abandonar mis proyectos vanos y de haber «escogido la mejor parte», discerniendo mi vocación.","pt":"Sou o segundo de três irmãos, nascido e criado em Los Angeles, na Califórnia. Embora tenha crescido numa família católica que ia à Missa todos os domingos, sentia que não sabia quem era Deus na minha vida, e Ele nunca estava nos meus pensamentos. Ouvi pela primeira vez o chamado do Senhor ao sacerdócio durante a Jornada Mundial da Juventude de 2016. Mas, naquela época, a minha cabeça estava no levantamento de peso e em tornar-me jogador de futebol. Enquanto resistia ao chamado do Senhor, Deus permitiu que eu entrevisse a vida sem Ele, e entrei numa grande crise sobre o sentido da minha vida. Nesse tempo, a minha comunidade neocatecumenal teve um papel decisivo, ajudando-me a manter os ouvidos abertos à Palavra de Deus, e vi a ternura do Senhor abrindo um caminho para que eu O redescobrisse, através de uma experiência de verdadeira paz, do perdão dos meus pecados e de um chamado de Deus ainda mais forte. Hoje sou feliz porque o Senhor me deu a graça de abandonar os meus projetos vazios e de ter «escolhido a melhor parte», discernindo a minha vocação.","it":"Sono il secondo di tre fratelli, nato e cresciuto a Los Angeles, in California. Pur essendo cresciuto in una famiglia cattolica che andava a Messa ogni domenica, sentivo di non sapere chi fosse Dio nella mia vita, e Lui non era mai nei miei pensieri. Ho sentito per la prima volta la chiamata del Signore al sacerdozio durante la Giornata Mondiale della Gioventù del 2016. In quel periodo, però, la mia testa era nel sollevamento pesi e nel diventare calciatore. Mentre resistevo alla chiamata del Signore, Dio mi ha permesso di intravedere la vita senza di Lui, e sono entrato in una grande crisi sul senso della mia vita. In questo tempo la mia comunità neocatecumenale ha avuto un ruolo decisivo nell'aiutarmi a tenere le orecchie aperte alla Parola di Dio, e ho visto la tenerezza del Signore aprire una strada perché lo riscoprissi attraverso un'esperienza di vera pace, il perdono dei miei peccati e una chiamata di Dio ancora più forte. Oggi sono felice che il Signore mi abbia dato la grazia di abbandonare i miei progetti vani e di aver «scelto la parte migliore», discernendo la mia vocazione."}},{"name":"Rafael Milla","origin":"Albuquerque, New Mexico","stage":"Itinerancy","parish":"Immaculate Conception, Marlborough","photo":"img:rafael_milla","story":{"en":"I was born in Lima, Peru, but at the age of 11, I moved with my family to Belen, New Mexico. When I was 2 years old, my father died from brain cancer. Although my family was in the Church, in my heart I grew resentful towards God for taking my father away. Growing up, I felt his absence and I sought to fill that void by wanting to be successful. Through school, I got a degree of Master of Architecture, and through the Neocatechumenal Way, I realized that, even though I had lost my father at a young age, God had never lost sight of me and was always present in my life. I got a glimpse of true happiness when out of gratitude to God for his kindness to me, I abandoned my dream of a successful career as an architect to enter the seminary in Boston.","es":"Nací en Lima, Perú, pero a los 11 años me trasladé con mi familia a Belén, Nuevo México. Cuando tenía 2 años, mi padre murió de un cáncer cerebral. Aunque mi familia estaba en la Iglesia, en mi corazón crecía el resentimiento hacia Dios por haberme quitado a mi padre. Al crecer sentí su ausencia y busqué llenar ese vacío con el deseo de triunfar. En los estudios obtuve un máster en Arquitectura y, a través del Camino Neocatecumenal, comprendí que, aunque había perdido a mi padre siendo muy pequeño, Dios nunca me había perdido de vista y siempre había estado presente en mi vida. Vislumbré la verdadera felicidad cuando, por gratitud a Dios por su bondad conmigo, abandoné mi sueño de una exitosa carrera como arquitecto para entrar en el seminario de Boston.","pt":"Nasci em Lima, no Peru, mas aos 11 anos mudei-me com a minha família para Belen, no Novo México. Quando eu tinha 2 anos, meu pai morreu de um câncer no cérebro. Embora a minha família estivesse na Igreja, no meu coração crescia um ressentimento contra Deus por ter levado o meu pai. Ao crescer, senti a sua ausência e procurei preencher esse vazio com o desejo de ser bem-sucedido. Nos estudos, obtive o mestrado em Arquitetura e, através do Caminho Neocatecumenal, percebi que, embora tivesse perdido o meu pai tão cedo, Deus nunca me perdera de vista e sempre estivera presente na minha vida. Vislumbrei a verdadeira felicidade quando, em gratidão a Deus pela sua bondade para comigo, abandonei o sonho de uma carreira de sucesso como arquiteto para entrar no seminário de Boston.","it":"Sono nato a Lima, in Perù, ma a 11 anni mi sono trasferito con la mia famiglia a Belen, nel New Mexico. Quando avevo 2 anni, mio padre è morto per un tumore al cervello. Anche se la mia famiglia era nella Chiesa, nel mio cuore cresceva il risentimento verso Dio per avermi tolto mio padre. Crescendo ho sentito la sua mancanza e ho cercato di colmare quel vuoto con il desiderio di avere successo. Negli studi ho conseguito la laurea magistrale in Architettura e, attraverso il Cammino Neocatecumenale, ho capito che, pur avendo perso mio padre così presto, Dio non mi aveva mai perso di vista ed era sempre stato presente nella mia vita. Ho intravisto la vera felicità quando, per gratitudine a Dio per la sua bontà verso di me, ho abbandonato il sogno di una brillante carriera di architetto per entrare nel seminario di Boston."}},{"name":"Luca Azzani","origin":"Martinsburg, West Virginia","stage":"Configuration","parish":"St. Mary of the Assumption, Lawrence","photo":"img:luca","story":{"en":"I am the second of five children. I felt the call to the priesthood for the first time when I was 13 years old. I was very young then, so I didn't do anything about it. God confirmed my calling in 2019 when I went to Panama for World Youth Day and, after returning from the pilgrimage, I began a discernment process at my diocese's Vocation Center. Today I am in the seminary, believing that God will clarify to me what this vocation is and how best to prepare myself for the priestly ministry.","es":"Soy el segundo de cinco hijos. Sentí la llamada al sacerdocio por primera vez cuando tenía 13 años. Era entonces muy joven, así que no hice nada al respecto. Dios confirmó mi llamada en 2019, cuando fui a Panamá para la Jornada Mundial de la Juventud y, al volver de la peregrinación, comencé un proceso de discernimiento en el Centro Vocacional de mi diócesis. Hoy estoy en el seminario, confiando en que Dios me aclarará qué es esta vocación y cuál es la mejor manera de prepararme para el ministerio sacerdotal.","pt":"Sou o segundo de cinco filhos. Senti o chamado ao sacerdócio pela primeira vez quando tinha 13 anos. Era muito novo naquela época, por isso não fiz nada a respeito. Deus confirmou o meu chamado em 2019, quando fui ao Panamá para a Jornada Mundial da Juventude e, ao voltar da peregrinação, comecei um processo de discernimento no Centro Vocacional da minha diocese. Hoje estou no seminário, confiando que Deus me mostrará com clareza o que é esta vocação e qual a melhor forma de me preparar para o ministério sacerdotal.","it":"Sono il secondo di cinque figli. Ho sentito la chiamata al sacerdozio per la prima volta a 13 anni. Ero molto giovane allora, quindi non ho fatto nulla. Dio ha confermato la mia chiamata nel 2019, quando sono andato a Panama per la Giornata Mondiale della Gioventù e, al ritorno dal pellegrinaggio, ho iniziato un percorso di discernimento presso il Centro Vocazionale della mia diocesi. Oggi sono in seminario, fiducioso che Dio mi farà comprendere che cosa sia questa vocazione e come prepararmi al meglio al ministero sacerdotale."}},{"name":"Henry Seuffert","origin":"Ridgewood, New Jersey","stage":"Itinerancy","parish":"Immaculate Conception, Marlborough","photo":"img:henry","story":{"en":"The reason I entered the seminary was a vocation to the priesthood that I discovered during my pilgrimage to Rome. Even though I felt the call, I was still very young and did not know what to do with it. Later, I received a Word from God that clearly told me to follow Him and gave me the courage to take the risk and begin my formation. What excites me about my calling is studying new topics that I had never heard of before the seminary.","es":"Entré en el seminario por una vocación al sacerdocio que descubrí durante mi peregrinación a Roma. Aunque sentía la llamada, era todavía muy joven y no sabía qué hacer con ella. Más tarde recibí una Palabra de Dios que me decía claramente que lo siguiera y que me dio el valor de arriesgarme y comenzar mi formación. Lo que me entusiasma de mi vocación es estudiar temas nuevos de los que nunca había oído hablar antes del seminario.","pt":"Entrei no seminário por causa de uma vocação ao sacerdócio que descobri durante a minha peregrinação a Roma. Embora sentisse o chamado, eu ainda era muito novo e não sabia o que fazer com ele. Mais tarde, recebi uma Palavra de Deus que me dizia claramente para segui-Lo e que me deu coragem para arriscar e começar a minha formação. O que me entusiasma na minha vocação é estudar assuntos novos, dos quais nunca tinha ouvido falar antes do seminário.","it":"Sono entrato in seminario per una vocazione al sacerdozio che ho scoperto durante il mio pellegrinaggio a Roma. Anche se sentivo la chiamata, ero ancora molto giovane e non sapevo che cosa farne. In seguito ho ricevuto una Parola di Dio che mi diceva chiaramente di seguirlo e che mi ha dato il coraggio di rischiare e di iniziare la mia formazione. Ciò che mi entusiasma della mia vocazione è studiare argomenti nuovi, di cui non avevo mai sentito parlare prima del seminario."}},{"name":"Alexander de Tirado","origin":"Miami, Florida","stage":"Itinerancy","parish":"Immaculate Conception, Marlborough","photo":"img:alexander","story":{"en":"I entered the seminary because, despite many experiences and various attempts at reaching happiness, I never really felt satisfied. At one point I realized that the only times when I was happy and at peace were when I trusted God. I believe that the seminary is this place where God guiding me and will show me what is his will for me.","es":"Entré en el seminario porque, a pesar de muchas experiencias y de varios intentos por alcanzar la felicidad, nunca me sentí realmente satisfecho. En un momento dado me di cuenta de que las únicas veces en que era feliz y estaba en paz eran cuando confiaba en Dios. Creo que el seminario es el lugar donde Dios me guía y me mostrará cuál es su voluntad para mí.","pt":"Entrei no seminário porque, apesar de muitas experiências e de várias tentativas de alcançar a felicidade, nunca me senti realmente satisfeito. Em certo momento, percebi que as únicas vezes em que eu era feliz e estava em paz eram quando confiava em Deus. Creio que o seminário é o lugar onde Deus me guia e me mostrará qual é a Sua vontade para mim.","it":"Sono entrato in seminario perché, nonostante molte esperienze e vari tentativi di raggiungere la felicità, non mi sono mai sentito davvero soddisfatto. A un certo punto mi sono reso conto che le uniche volte in cui ero felice e in pace erano quando mi fidavo di Dio. Credo che il seminario sia il luogo in cui Dio mi guida e mi mostrerà qual è la sua volontà per me."}},{"name":"Rafael Stefano Rubio","origin":"Miami, Florida","stage":"Configuration","parish":"St. Patrick, Brockton","photo":"img:stefano","story":{"en":"I am the second of nine siblings, born in Virginia. In the summer of 2017, my parents were sent as a missionary family to Florida and then given a mission at the Redemptoris Mater Seminary of Miami.\n\nBeing a witness of the generosity of my parents and growing up close to the seminarians, I saw firsthand the life of the seminary as I helped my father with the multiple construction projects in the seminary.\n\nThe experience of going on pilgrimage to Panama, to Gettysburg, PA, and then to Jerusalem were fundamental to hear the call of the Lord in my life.\n\nOne word that particularly enlightened me in the pursuit of my vocation was the parable of the talents, “For to everyone who has, more will be given and he will grow rich; but from the one who has not, even what he has will be taken away.” These words helped to see that I can have it all, if I only desire God and that God is enough!","es":"Soy el segundo de nueve hermanos y nací en Virginia. En el verano de 2017, mis padres fueron enviados como familia en misión a Florida y después recibieron una misión en el Seminario Redemptoris Mater de Miami.\n\nSiendo testigo de la generosidad de mis padres y creciendo cerca de los seminaristas, conocí de primera mano la vida del seminario mientras ayudaba a mi padre en los numerosos proyectos de construcción del seminario.\n\nLas peregrinaciones a Panamá, a Gettysburg (Pensilvania) y luego a Jerusalén fueron fundamentales para escuchar la llamada del Señor en mi vida.\n\nUna palabra que me iluminó especialmente en la búsqueda de mi vocación fue la parábola de los talentos: «Porque a todo el que tiene se le dará y le sobrará; pero al que no tiene se le quitará hasta lo que tiene». Estas palabras me ayudaron a ver que puedo tenerlo todo si solo deseo a Dios, ¡y que Dios basta!","pt":"Sou o segundo de nove irmãos e nasci na Virgínia. No verão de 2017, meus pais foram enviados como família em missão para a Flórida e, depois, receberam uma missão no Seminário Redemptoris Mater de Miami.\n\nSendo testemunha da generosidade dos meus pais e crescendo perto dos seminaristas, conheci de perto a vida do seminário enquanto ajudava meu pai nos vários projetos de construção do seminário.\n\nAs peregrinações ao Panamá, a Gettysburg (Pensilvânia) e depois a Jerusalém foram fundamentais para ouvir o chamado do Senhor na minha vida.\n\nUma palavra que me iluminou de modo especial na busca da minha vocação foi a parábola dos talentos: «Pois a todo aquele que tem será dado, e terá em abundância; mas daquele que não tem, até o que tem lhe será tirado». Estas palavras ajudaram-me a ver que posso ter tudo, se desejar somente a Deus, e que Deus basta!","it":"Sono il secondo di nove fratelli e sono nato in Virginia. Nell'estate del 2017 i miei genitori sono stati inviati come famiglia in missione in Florida e poi hanno ricevuto una missione presso il Seminario Redemptoris Mater di Miami.\n\nTestimone della generosità dei miei genitori e cresciuto accanto ai seminaristi, ho conosciuto da vicino la vita del seminario mentre aiutavo mio padre nei numerosi lavori di costruzione del seminario.\n\nI pellegrinaggi a Panama, a Gettysburg (Pennsylvania) e poi a Gerusalemme sono stati fondamentali per ascoltare la chiamata del Signore nella mia vita.\n\nUna parola che mi ha illuminato in modo particolare nella ricerca della mia vocazione è stata la parabola dei talenti: «Perché a chiunque ha, verrà dato e sarà nell'abbondanza; ma a chi non ha, verrà tolto anche quello che ha». Queste parole mi hanno aiutato a vedere che posso avere tutto, se desidero soltanto Dio, e che Dio basta!"}},{"name":"Christian Ortez","origin":"El Salvador","stage":"Configuration","parish":"Immaculate Conception, Revere","photo":"img:christian","story":{"en":"I am the oldest of four siblings, raised as a Roman Catholic in El Salvador before migrating with my family to Massachusetts. Before entering the seminary, I studied and worked in finance, carefully charting my path to success. However, after a missionary experience on the streets of Harrisburg, PA (where I was sent without food, clothing, or money), I had a firsthand encounter with God's living word and boundless providence. This experience taught me to trust in God rather than in earthly securities. Along the way, many priests invited me to experience the true fraternity of the priesthood, helping me navigate life and remain steadfast in the faith. This journey culminated in a pilgrimage to the Holy Land, where a vocational call confirmed my path. The Lord is now calling me to stay the course toward a vocation here in Boston, which I now call home.","es":"Soy el mayor de cuatro hermanos y fui educado como católico en El Salvador antes de emigrar con mi familia a Massachusetts. Antes de entrar en el seminario estudié y trabajé en finanzas, trazando cuidadosamente mi camino hacia el éxito. Sin embargo, tras una experiencia misionera por las calles de Harrisburg (Pensilvania), adonde fui enviado sin comida, sin ropa y sin dinero, tuve un encuentro directo con la Palabra viva de Dios y con su providencia sin límites. Esta experiencia me enseñó a confiar en Dios y no en las seguridades de este mundo. A lo largo del camino, muchos sacerdotes me invitaron a experimentar la verdadera fraternidad del sacerdocio, ayudándome a orientarme en la vida y a permanecer firme en la fe. Este recorrido culminó en una peregrinación a Tierra Santa, donde una llamada vocacional confirmó mi camino. Ahora el Señor me llama a perseverar en una vocación aquí en Boston, que hoy considero mi hogar.","pt":"Sou o mais velho de quatro irmãos e fui criado como católico em El Salvador antes de emigrar com a minha família para Massachusetts. Antes de entrar no seminário, estudei e trabalhei na área de finanças, traçando cuidadosamente o meu caminho para o sucesso. Porém, depois de uma experiência missionária pelas ruas de Harrisburg, na Pensilvânia (para onde fui enviado sem comida, sem roupa e sem dinheiro), tive um encontro direto com a Palavra viva de Deus e com a Sua providência sem limites. Esta experiência ensinou-me a confiar em Deus, e não nas seguranças deste mundo. Ao longo do caminho, muitos sacerdotes convidaram-me a experimentar a verdadeira fraternidade do sacerdócio, ajudando-me a orientar a vida e a permanecer firme na fé. Este percurso culminou numa peregrinação à Terra Santa, onde um chamado vocacional confirmou o meu caminho. Agora o Senhor chama-me a perseverar numa vocação aqui em Boston, que hoje considero a minha casa.","it":"Sono il maggiore di quattro fratelli e sono cresciuto da cattolico in El Salvador prima di emigrare con la mia famiglia in Massachusetts. Prima di entrare in seminario ho studiato e lavorato nel settore finanziario, tracciando con cura la mia strada verso il successo. Tuttavia, dopo un'esperienza missionaria per le strade di Harrisburg, in Pennsylvania (dove sono stato inviato senza cibo, senza vestiti e senza denaro), ho fatto un incontro diretto con la Parola viva di Dio e con la sua provvidenza senza limiti. Questa esperienza mi ha insegnato a fidarmi di Dio e non delle sicurezze di questo mondo. Lungo il cammino molti sacerdoti mi hanno invitato a sperimentare la vera fraternità del sacerdozio, aiutandomi a orientarmi nella vita e a rimanere saldo nella fede. Questo percorso è culminato in un pellegrinaggio in Terra Santa, dove una chiamata vocazionale ha confermato la mia strada. Ora il Signore mi chiama a perseverare in una vocazione qui a Boston, che oggi considero casa mia."}},{"name":"Juan Cano","origin":"Chicago, Illinois","stage":"Configuration","parish":"St. Joseph, Lynn","photo":"img:juan","story":{"en":"As the third oldest of ten siblings, I grew up surrounded by the Church and immersed in the Neocatechumenal Way, constantly hearing about God. However, even though I never really enjoyed attending church, my parents always insisted I go. This pattern persisted. For years, I felt unengaged and often left without processing or absorbing anything. It wasn't until 2023, when I faced challenges in my life, that I began to listen to God's voice. I saw this especially in how I embraced the WYD pilgrimage to Lisbon. This experience sparked a calling in me and led to a year of discernment about my vocation, which ultimately led me to the seminary.","es":"Siendo el tercero de diez hermanos, crecí rodeado de la Iglesia e inmerso en el Camino Neocatecumenal, escuchando hablar de Dios continuamente. Sin embargo, aunque nunca disfruté realmente de ir a la iglesia, mis padres siempre insistían en que fuera. Esto se repitió durante años: me sentía desconectado y a menudo salía sin haber asimilado nada. No fue hasta 2023, cuando afronté dificultades en mi vida, que comencé a escuchar la voz de Dios. Lo vi especialmente en la manera en que acogí la peregrinación de la JMJ a Lisboa. Esta experiencia despertó en mí una llamada y me llevó a un año de discernimiento sobre mi vocación, que finalmente me condujo al seminario.","pt":"Sendo o terceiro de dez irmãos, cresci rodeado pela Igreja e imerso no Caminho Neocatecumenal, ouvindo falar de Deus constantemente. Contudo, embora nunca tenha gostado muito de ir à igreja, meus pais sempre insistiam para que eu fosse. Isso se repetiu durante anos: eu me sentia distante e muitas vezes saía sem ter assimilado nada. Só em 2023, quando enfrentei dificuldades na minha vida, comecei a escutar a voz de Deus. Vi isso especialmente na forma como acolhi a peregrinação da JMJ a Lisboa. Esta experiência despertou em mim um chamado e levou-me a um ano de discernimento sobre a minha vocação, que finalmente me conduziu ao seminário.","it":"Terzo di dieci fratelli, sono cresciuto immerso nella Chiesa e nel Cammino Neocatecumenale, sentendo parlare di Dio in continuazione. Eppure, anche se andare in chiesa non mi è mai piaciuto davvero, i miei genitori insistevano sempre perché ci andassi. È andata avanti così per anni: mi sentivo distaccato e spesso uscivo senza aver colto nulla. Solo nel 2023, quando ho affrontato delle difficoltà nella mia vita, ho cominciato ad ascoltare la voce di Dio. L'ho visto soprattutto nel modo in cui ho accolto il pellegrinaggio della GMG a Lisbona. Questa esperienza ha fatto nascere in me una chiamata e mi ha portato a un anno di discernimento sulla mia vocazione, che alla fine mi ha condotto in seminario."}},{"name":"Diego Arellano-Ramirez","origin":"Aurora, Colorado","stage":"Discipleship","parish":"Immaculate Conception, Revere","photo":"img:diego","story":{"en":"I was raised in Aurora, Colorado, as the youngest of three siblings in a Mexican family with two older sisters. As the only boy, I grew up in a nurturing environment shaped by an immigrant mindset: excel in school, believing hard work would lead to success.\n\nMy upbringing included attending Catholic school and regularly attending Sunday Mass, mainly because of my mother’s deep faith, which led our family to church each week. However, during my early teenage years, my connection to the church faded. I then focused on soccer, hoping to balance my education while pursuing a career in the sport.\n\nAfter graduating high school, I intended to move to Europe to pursue college and explore opportunities with local soccer clubs. Yet, during World Youth Day in Portugal, I discovered that true fulfillment came from God, leading me to embrace a calling to the priesthood.","es":"Crecí en Aurora, Colorado, como el menor de tres hermanos en una familia mexicana, con dos hermanas mayores. Como único varón, crecí en un ambiente acogedor marcado por la mentalidad del inmigrante: sobresalir en los estudios, con la convicción de que el trabajo duro lleva al éxito.\n\nMi educación incluyó la escuela católica y la Misa dominical frecuente, sobre todo gracias a la profunda fe de mi madre, que llevaba a nuestra familia a la iglesia cada semana. Sin embargo, en mi primera adolescencia mi vínculo con la Iglesia se fue apagando. Me centré entonces en el fútbol, con la esperanza de compaginar los estudios con una carrera deportiva.\n\nAl terminar la escuela secundaria, mi intención era trasladarme a Europa para ir a la universidad y explorar oportunidades con clubes de fútbol locales. Pero durante la Jornada Mundial de la Juventud en Portugal descubrí que la verdadera plenitud viene de Dios, y eso me llevó a acoger la llamada al sacerdocio.","pt":"Cresci em Aurora, no Colorado, como o caçula de três irmãos numa família mexicana, com duas irmãs mais velhas. Sendo o único menino, cresci num ambiente acolhedor marcado pela mentalidade do imigrante: destacar-se nos estudos, acreditando que o trabalho duro leva ao sucesso.\n\nA minha formação incluiu a escola católica e a Missa dominical frequente, sobretudo graças à fé profunda da minha mãe, que levava a nossa família à igreja todas as semanas. No entanto, no início da adolescência, a minha ligação com a Igreja foi enfraquecendo. Concentrei-me então no futebol, esperando conciliar os estudos com uma carreira no esporte.\n\nDepois de terminar o ensino médio, pretendia mudar-me para a Europa para fazer faculdade e explorar oportunidades em clubes de futebol locais. Mas, durante a Jornada Mundial da Juventude em Portugal, descobri que a verdadeira plenitude vem de Deus, o que me levou a acolher o chamado ao sacerdócio.","it":"Sono cresciuto ad Aurora, in Colorado, ultimo di tre figli in una famiglia messicana, con due sorelle maggiori. Unico maschio, sono cresciuto in un ambiente premuroso, segnato dalla mentalità dell'immigrato: eccellere negli studi, nella convinzione che il duro lavoro porti al successo.\n\nLa mia educazione ha incluso la scuola cattolica e la Messa domenicale regolare, soprattutto grazie alla fede profonda di mia madre, che ogni settimana portava la nostra famiglia in chiesa. Nella prima adolescenza, però, il mio legame con la Chiesa si è affievolito. Mi sono allora concentrato sul calcio, sperando di conciliare gli studi con una carriera sportiva.\n\nDopo il diploma intendevo trasferirmi in Europa per frequentare l'università e cercare opportunità con le squadre di calcio locali. Ma durante la Giornata Mondiale della Gioventù in Portogallo ho scoperto che la vera pienezza viene da Dio, e questo mi ha portato ad accogliere la chiamata al sacerdozio."}},{"name":"Angel Velasquez","origin":"San Salvador, El Salvador","stage":"Discipleship","parish":"St. Rose of Lima, Chelsea","photo":"img:angel","story":{"en":"I am the third of four siblings, born in El Salvador. Growing up, I believed my family didn’t love me, which led me to put myself in risky situations. Although raised in a Catholic environment, I never felt a close bond with God. In 2014, I heard about God’s love, but it seemed unclear and distant.\n\nIn 2017, I moved to the United States, believing it was my chance for happiness through money, success, respect, and worldly pleasures. Yet, the more I engaged with the world, the emptier I felt. By 2020, God allowed me to reach rock bottom; even though I had turned away from Him, He “did not abandon me to death.”\n\nIn 2023, I returned to the Church, where God rekindled my experience of His love and gave me the grace to abandon my attachments and travel to Denver, CO, for a mission experience. During the 50th anniversary celebration of the Neocatechumenal Way in the United States, I once again felt the Lord confirm my call to the priesthood.","es":"Soy el tercero de cuatro hermanos y nací en El Salvador. Al crecer, creía que mi familia no me quería, y eso me llevó a ponerme en situaciones de riesgo. Aunque me eduqué en un ambiente católico, nunca sentí un vínculo cercano con Dios. En 2014 oí hablar del amor de Dios, pero me parecía confuso y lejano.\n\nEn 2017 me trasladé a los Estados Unidos, convencido de que era mi oportunidad de ser feliz a través del dinero, el éxito, el respeto y los placeres del mundo. Sin embargo, cuanto más me entregaba al mundo, más vacío me sentía. Hacia 2020, Dios permitió que tocara fondo; aunque yo me había alejado de Él, Él «no me abandonó a la muerte».\n\nEn 2023 volví a la Iglesia, donde Dios reavivó mi experiencia de su amor y me dio la gracia de dejar mis apegos y viajar a Denver (Colorado) para una experiencia de misión. Durante la celebración del 50.º aniversario del Camino Neocatecumenal en los Estados Unidos, sentí una vez más que el Señor confirmaba mi llamada al sacerdocio.","pt":"Sou o terceiro de quatro irmãos e nasci em El Salvador. Ao crescer, acreditava que a minha família não me amava, o que me levou a colocar-me em situações de risco. Embora tenha sido criado num ambiente católico, nunca senti um vínculo próximo com Deus. Em 2014 ouvi falar do amor de Deus, mas ele me parecia confuso e distante.\n\nEm 2017 mudei-me para os Estados Unidos, acreditando que era a minha chance de ser feliz por meio do dinheiro, do sucesso, do respeito e dos prazeres do mundo. Porém, quanto mais me entregava ao mundo, mais vazio me sentia. Em 2020, Deus permitiu que eu chegasse ao fundo do poço; mesmo tendo eu me afastado d'Ele, Ele «não me abandonou à morte».\n\nEm 2023 voltei à Igreja, onde Deus reacendeu em mim a experiência do Seu amor e me deu a graça de deixar os meus apegos e viajar para Denver, no Colorado, para uma experiência de missão. Durante a celebração dos 50 anos do Caminho Neocatecumenal nos Estados Unidos, senti mais uma vez o Senhor confirmar o meu chamado ao sacerdócio.","it":"Sono il terzo di quattro fratelli e sono nato in El Salvador. Crescendo credevo che la mia famiglia non mi amasse, e questo mi ha portato a mettermi in situazioni rischiose. Pur essendo cresciuto in un ambiente cattolico, non ho mai sentito un legame stretto con Dio. Nel 2014 ho sentito parlare dell'amore di Dio, ma mi sembrava confuso e lontano.\n\nNel 2017 mi sono trasferito negli Stati Uniti, convinto che fosse la mia occasione per essere felice attraverso il denaro, il successo, il rispetto e i piaceri del mondo. Eppure, più mi davo al mondo, più mi sentivo vuoto. Nel 2020 Dio ha permesso che toccassi il fondo; anche se mi ero allontanato da Lui, Lui «non mi ha abbandonato alla morte».\n\nNel 2023 sono tornato nella Chiesa, dove Dio ha riacceso in me l'esperienza del suo amore e mi ha dato la grazia di lasciare i miei attaccamenti e partire per Denver, in Colorado, per un'esperienza di missione. Durante la celebrazione del 50° anniversario del Cammino Neocatecumenale negli Stati Uniti ho sentito ancora una volta il Signore confermare la mia chiamata al sacerdozio."}},{"name":"Romeo Moises Saucedo","origin":"Denver, Colorado","stage":"Discipleship","parish":"St. Joseph, Lynn","photo":"img:romeo","story":{"en":"I was born and raised in Denver, Colorado, the second of seven children – so life was rarely quiet and never dull. When my mother converted, our whole family began the adventure of discovering Christ, and that faith took deeper root when we encountered the Neocatechumenal Way. Surrounded by joyful, generous priests, I found myself drawn to their vocation; their witness planted the first seeds of my own call.\n\nAs I grew older, however, that desire dimmed, and my faith faded with it. I rebelled, wandered, and forgot much of what the Lord had already done in my life – but He had not forgotten me. At World Youth Day in Lisbon, Portugal, He called me again. There, I heard Pope Francis say, “Do not be afraid.” Those simple words filled me with new hope and opened my heart once more. They invited me to discern my vocation with courage, gratitude, and joy – and ultimately to offer my life and be formed as a priest for the Church.","es":"Nací y crecí en Denver, Colorado, el segundo de siete hijos, así que la vida rara vez era tranquila y nunca aburrida. Cuando mi madre se convirtió, toda nuestra familia comenzó la aventura de descubrir a Cristo, y esa fe echó raíces más profundas cuando conocimos el Camino Neocatecumenal. Rodeado de sacerdotes alegres y generosos, me sentí atraído por su vocación; su testimonio sembró las primeras semillas de mi propia llamada.\n\nSin embargo, al crecer, ese deseo se fue apagando, y mi fe con él. Me rebelé, anduve perdido y olvidé mucho de lo que el Señor ya había hecho en mi vida, pero Él no me había olvidado. En la Jornada Mundial de la Juventud en Lisboa, Portugal, me llamó de nuevo. Allí escuché al Papa Francisco decir: «No tengáis miedo». Esas palabras sencillas me llenaron de una nueva esperanza y abrieron de nuevo mi corazón. Me invitaron a discernir mi vocación con valentía, gratitud y alegría, y finalmente a ofrecer mi vida y formarme como sacerdote para la Iglesia.","pt":"Nasci e cresci em Denver, no Colorado, o segundo de sete filhos, por isso a vida raramente era tranquila e nunca era monótona. Quando a minha mãe se converteu, toda a nossa família começou a aventura de descobrir Cristo, e essa fé criou raízes mais profundas quando conhecemos o Caminho Neocatecumenal. Rodeado de sacerdotes alegres e generosos, senti-me atraído pela sua vocação; o seu testemunho plantou as primeiras sementes do meu próprio chamado.\n\nNo entanto, ao crescer, esse desejo foi se apagando, e a minha fé com ele. Rebelei-me, andei perdido e esqueci muito do que o Senhor já tinha feito na minha vida, mas Ele não Se esqueceu de mim. Na Jornada Mundial da Juventude em Lisboa, Portugal, Ele chamou-me de novo. Ali ouvi o Papa Francisco dizer: «Não tenhais medo». Essas palavras simples encheram-me de uma nova esperança e abriram outra vez o meu coração. Convidaram-me a discernir a minha vocação com coragem, gratidão e alegria e, por fim, a oferecer a minha vida e a ser formado como sacerdote para a Igreja.","it":"Sono nato e cresciuto a Denver, in Colorado, secondo di sette figli: la vita era raramente tranquilla e mai noiosa. Quando mia madre si è convertita, tutta la nostra famiglia ha iniziato l'avventura di scoprire Cristo, e quella fede ha messo radici più profonde quando abbiamo incontrato il Cammino Neocatecumenale. Circondato da sacerdoti gioiosi e generosi, mi sono sentito attratto dalla loro vocazione; la loro testimonianza ha piantato i primi semi della mia chiamata.\n\nCrescendo, però, quel desiderio si è affievolito, e con esso la mia fede. Mi sono ribellato, mi sono perso e ho dimenticato molto di ciò che il Signore aveva già fatto nella mia vita, ma Lui non si era dimenticato di me. Alla Giornata Mondiale della Gioventù di Lisbona, in Portogallo, mi ha chiamato di nuovo. Lì ho sentito Papa Francesco dire: «Non abbiate paura». Quelle semplici parole mi hanno riempito di una nuova speranza e hanno riaperto il mio cuore. Mi hanno invitato a discernere la mia vocazione con coraggio, gratitudine e gioia, e infine a offrire la mia vita e a essere formato come sacerdote per la Chiesa."}},{"name":"Christopher Matthew Siverio","origin":"Plainfield, New Jersey","stage":"Discipleship","parish":"Our Lady of the Assumption, East Boston","photo":"img:christopher","story":{"en":"I was born and raised in Plainfield, New Jersey, the youngest of five children. My mother and grandparents planted the seeds of faith, and my older siblings encouraged me to join a Neocatechumenal Way community. There, my relationship with God deepened, and the first stirrings of my vocation began to take shape.\n\nInspired by my older brother, I answered a call to missionary service, spending a year and a half in Philadelphia with a priest as part of an itinerant mission. A further six months of service in Brooklyn became a decisive time of prayer and discernment, awakening in me the desire to belong more fully to Christ and to explore a call to the priesthood.\n\nDuring a pilgrimage to Austria, someone dear to me offered words that stayed with me: “Go—you will lose nothing if you risk for the One who loves you.” Trusting in that love, I entered the seminary, where I continue to discern God’s call through prayer, study, and formation.","es":"Nací y crecí en Plainfield, Nueva Jersey, el menor de cinco hijos. Mi madre y mis abuelos sembraron las semillas de la fe, y mis hermanos mayores me animaron a entrar en una comunidad del Camino Neocatecumenal. Allí mi relación con Dios se hizo más profunda y comenzaron a tomar forma los primeros indicios de mi vocación.\n\nInspirado por mi hermano mayor, respondí a una llamada al servicio misionero y pasé un año y medio en Filadelfia con un sacerdote, como parte de una misión itinerante. Otros seis meses de servicio en Brooklyn se convirtieron en un tiempo decisivo de oración y discernimiento, que despertó en mí el deseo de pertenecer más plenamente a Cristo y de explorar una llamada al sacerdocio.\n\nDurante una peregrinación a Austria, una persona muy querida me dijo unas palabras que se me quedaron grabadas: «Ve; no perderás nada si te arriesgas por Aquel que te ama». Confiando en ese amor, entré en el seminario, donde sigo discerniendo la llamada de Dios a través de la oración, el estudio y la formación.","pt":"Nasci e cresci em Plainfield, Nova Jersey, o caçula de cinco filhos. Minha mãe e meus avós plantaram as sementes da fé, e meus irmãos mais velhos me incentivaram a entrar numa comunidade do Caminho Neocatecumenal. Ali a minha relação com Deus aprofundou-se, e os primeiros sinais da minha vocação começaram a tomar forma.\n\nInspirado pelo meu irmão mais velho, respondi a um chamado ao serviço missionário e passei um ano e meio em Filadélfia com um sacerdote, como parte de uma missão itinerante. Outros seis meses de serviço no Brooklyn tornaram-se um tempo decisivo de oração e discernimento, despertando em mim o desejo de pertencer mais plenamente a Cristo e de explorar um chamado ao sacerdócio.\n\nDurante uma peregrinação à Áustria, alguém muito querido disse-me palavras que ficaram comigo: «Vai; não perderás nada se arriscares por Aquele que te ama». Confiando nesse amor, entrei no seminário, onde continuo a discernir o chamado de Deus por meio da oração, do estudo e da formação.","it":"Sono nato e cresciuto a Plainfield, nel New Jersey, ultimo di cinque figli. Mia madre e i miei nonni hanno seminato in me la fede, e i miei fratelli maggiori mi hanno incoraggiato a entrare in una comunità del Cammino Neocatecumenale. Lì il mio rapporto con Dio si è approfondito e i primi segni della mia vocazione hanno cominciato a prendere forma.\n\nIspirato da mio fratello maggiore, ho risposto a una chiamata al servizio missionario e ho trascorso un anno e mezzo a Filadelfia con un sacerdote, nell'ambito di una missione itinerante. Altri sei mesi di servizio a Brooklyn sono diventati un tempo decisivo di preghiera e di discernimento, che ha risvegliato in me il desiderio di appartenere più pienamente a Cristo e di approfondire una chiamata al sacerdozio.\n\nDurante un pellegrinaggio in Austria, una persona a me cara mi ha detto parole che mi sono rimaste dentro: «Va'; non perderai nulla se rischi per Colui che ti ama». Fidandomi di quell'amore, sono entrato in seminario, dove continuo a discernere la chiamata di Dio attraverso la preghiera, lo studio e la formazione."}},{"name":"Alexis Garcia Acosta","origin":"Aurora, Colorado","stage":"Propaedeutic","parish":"St. Rose of Lima, Chelsea","photo":"img:alexis","story":{"en":"I am the oldest of six siblings, born in Colorado. My parents brought me to the Church, but I did not fully understand why. When I was 12, my dad went to a retreat and realized how important it was to marry within the Church. This event brought me closer to the Church and led me to be baptized. Unfortunately, I lacked understanding of my faith and developed vices that drew me farther from the Church. By the end of eighth grade, I had started using drugs. I also grew up resentful toward my parents. Providentially, in 2021, a pilgrimage to Gettysburg brought me my first encounter with the call to the priesthood. As time went on, I forgot about this calling, but I soon rediscovered it on a pilgrimage to Rome during the 2025 Jubilee year, where I heard that I was not rejected for my sins but called to something greater.","es":"Soy el mayor de seis hermanos y nací en Colorado. Mis padres me llevaron a la Iglesia, pero yo no entendía del todo por qué. Cuando tenía 12 años, mi papá fue a un retiro y comprendió lo importante que era casarse por la Iglesia. Este acontecimiento me acercó a la Iglesia y me llevó a recibir el bautismo. Por desgracia, me faltaba comprensión de mi fe y desarrollé vicios que me alejaron aún más de la Iglesia. Al final del octavo grado ya había empezado a consumir drogas. También crecí con resentimiento hacia mis padres. Providencialmente, en 2021, una peregrinación a Gettysburg me trajo mi primer encuentro con la llamada al sacerdocio. Con el tiempo olvidé esa llamada, pero pronto la redescubrí en una peregrinación a Roma durante el Año Jubilar 2025, donde escuché que no era rechazado por mis pecados, sino llamado a algo más grande.","pt":"Sou o mais velho de seis irmãos e nasci no Colorado. Meus pais me levaram à Igreja, mas eu não entendia bem por quê. Quando eu tinha 12 anos, meu pai foi a um retiro e percebeu como era importante casar-se na Igreja. Esse acontecimento aproximou-me da Igreja e levou-me a ser batizado. Infelizmente, faltava-me compreensão da minha fé, e desenvolvi vícios que me afastaram ainda mais da Igreja. No fim do oitavo ano, eu já tinha começado a usar drogas. Também cresci ressentido com os meus pais. Providencialmente, em 2021, uma peregrinação a Gettysburg trouxe-me o primeiro encontro com o chamado ao sacerdócio. Com o tempo, esqueci esse chamado, mas logo o redescobri numa peregrinação a Roma durante o Ano Jubilar de 2025, onde ouvi que não era rejeitado pelos meus pecados, mas chamado a algo maior.","it":"Sono il maggiore di sei fratelli e sono nato in Colorado. I miei genitori mi portavano in chiesa, ma non capivo fino in fondo perché. Quando avevo 12 anni, mio padre partecipò a un ritiro e comprese quanto fosse importante sposarsi in Chiesa. Questo avvenimento mi avvicinò alla Chiesa e mi portò a ricevere il Battesimo. Purtroppo mi mancava la comprensione della mia fede e sviluppai dei vizi che mi allontanarono ancora di più dalla Chiesa. Alla fine della terza media avevo già cominciato a fare uso di droghe. Sono cresciuto anche con del risentimento verso i miei genitori. Provvidenzialmente, nel 2021, un pellegrinaggio a Gettysburg mi ha portato il primo incontro con la chiamata al sacerdozio. Col tempo ho dimenticato quella chiamata, ma l'ho presto riscoperta in un pellegrinaggio a Roma durante l'Anno Giubilare 2025, dove ho sentito che non ero rifiutato per i miei peccati, ma chiamato a qualcosa di più grande."}},{"name":"Douglas S. Lopez","origin":"Lynn, Massachusetts","stage":"Propaedeutic","parish":"St. Patrick, Brockton","photo":"img:douglas","story":{"en":"I’m Douglas, the second of six siblings, and I grew up in East Boston in a Catholic family. A few years ago, my family joined the Neocatechumenal Way at St. Joseph’s Parish in Lynn. As a teenager, I started asking bigger questions about my life and purpose. A pilgrimage and vocational meeting in New Jersey became a turning point for me. When my pastor asked me to recall a time when I had been truly happy, I immediately thought of past pilgrimages – moments when I felt free to listen to God. Now, I’m grateful to be discerning a call to the priesthood at Redemptoris Mater Seminary.","es":"Soy Douglas, el segundo de seis hermanos, y crecí en East Boston en una familia católica. Hace unos años, mi familia entró en el Camino Neocatecumenal en la parroquia de San José en Lynn. De adolescente empecé a hacerme preguntas más profundas sobre mi vida y su sentido. Una peregrinación y un encuentro vocacional en Nueva Jersey fueron un punto de inflexión para mí. Cuando mi párroco me pidió que recordara un momento en que hubiera sido verdaderamente feliz, pensé de inmediato en peregrinaciones pasadas, momentos en los que me sentía libre para escuchar a Dios. Hoy estoy agradecido de discernir una llamada al sacerdocio en el Seminario Redemptoris Mater.","pt":"Sou o Douglas, o segundo de seis irmãos, e cresci em East Boston numa família católica. Há alguns anos, a minha família entrou no Caminho Neocatecumenal na Paróquia de São José, em Lynn. Na adolescência, comecei
