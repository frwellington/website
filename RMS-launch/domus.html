a fazer perguntas mais profundas sobre a minha vida e o seu sentido. Uma peregrinação e um encontro vocacional em Nova Jersey foram um ponto de virada para mim. Quando o meu pároco me pediu que recordasse um momento em que tivesse sido verdadeiramente feliz, pensei logo nas peregrinações passadas, momentos em que me sentia livre para escutar a Deus. Hoje sou grato por estar discernindo um chamado ao sacerdócio no Seminário Redemptoris Mater.","it":"Sono Douglas, secondo di sei fratelli, e sono cresciuto a East Boston in una famiglia cattolica. Qualche anno fa la mia famiglia è entrata nel Cammino Neocatecumenale nella parrocchia di San Giuseppe a Lynn. Da adolescente ho cominciato a pormi domande più profonde sulla mia vita e sul suo significato. Un pellegrinaggio e un incontro vocazionale nel New Jersey sono stati per me una svolta. Quando il mio parroco mi ha chiesto di ricordare un momento in cui ero stato davvero felice, ho pensato subito ai pellegrinaggi passati, momenti in cui mi sentivo libero di ascoltare Dio. Oggi sono grato di discernere una chiamata al sacerdozio nel Seminario Redemptoris Mater."}},{"name":"Emmanuel Nieto","origin":"Santa Ana, California","stage":"Propaedeutic","parish":"St. Mary of the Assumption, Lawrence","photo":"img:emmanuel","story":{"en":"I am the fifth of eight siblings and was born in Santa Ana, California. I grew up in the Neocatechumenal Way, with the Church always close to my life. As a middle child, though, I had a little more freedom than some of my brothers and sisters, and I began looking for happiness in the things the world offered. Soon, I discovered that the world left me emptier and with a greater need for fulfillment, not to mention that it brought a lot of suffering. Little by little, I began to realize I was happiest in church, listening to the Word of God, and I began to appreciate my community. In 2022, during a pilgrimage to Jerusalem, I felt the first call to the priesthood. After that, the desire kept growing in my heart. Finally, in 2026, I entered Redemptoris Mater Seminary of Boston.","es":"Soy el quinto de ocho hermanos y nací en Santa Ana, California. Crecí en el Camino Neocatecumenal, con la Iglesia siempre cerca de mi vida. Sin embargo, como hijo de en medio, tenía un poco más de libertad que algunos de mis hermanos, y empecé a buscar la felicidad en lo que ofrecía el mundo. Pronto descubrí que el mundo me dejaba más vacío y con una mayor necesidad de plenitud, además de traerme mucho sufrimiento. Poco a poco empecé a darme cuenta de que era más feliz en la iglesia, escuchando la Palabra de Dios, y comencé a valorar a mi comunidad. En 2022, durante una peregrinación a Jerusalén, sentí la primera llamada al sacerdocio. Desde entonces, ese deseo no dejó de crecer en mi corazón. Finalmente, en 2026, entré en el Seminario Redemptoris Mater de Boston.","pt":"Sou o quinto de oito irmãos e nasci em Santa Ana, na Califórnia. Cresci no Caminho Neocatecumenal, com a Igreja sempre perto da minha vida. Porém, como filho do meio, eu tinha um pouco mais de liberdade do que alguns dos meus irmãos e comecei a procurar a felicidade naquilo que o mundo oferecia. Logo descobri que o mundo me deixava mais vazio e com uma necessidade maior de plenitude, sem contar que me trazia muito sofrimento. Pouco a pouco, comecei a perceber que era mais feliz na igreja, escutando a Palavra de Deus, e passei a valorizar a minha comunidade. Em 2022, durante uma peregrinação a Jerusalém, senti o primeiro chamado ao sacerdócio. Desde então, o desejo não parou de crescer no meu coração. Finalmente, em 2026, entrei no Seminário Redemptoris Mater de Boston.","it":"Sono il quinto di otto fratelli e sono nato a Santa Ana, in California. Sono cresciuto nel Cammino Neocatecumenale, con la Chiesa sempre vicina alla mia vita. Tuttavia, essendo uno dei figli di mezzo, avevo un po' più di libertà rispetto ad alcuni dei miei fratelli, e ho cominciato a cercare la felicità nelle cose che il mondo offriva. Ben presto ho scoperto che il mondo mi lasciava più vuoto e con un bisogno ancora maggiore di pienezza, per non parlare di quanta sofferenza mi portava. A poco a poco ho cominciato a rendermi conto che ero più felice in chiesa, ascoltando la Parola di Dio, e ho iniziato ad apprezzare la mia comunità. Nel 2022, durante un pellegrinaggio a Gerusalemme, ho sentito la prima chiamata al sacerdozio. Da allora il desiderio non ha smesso di crescere nel mio cuore. Infine, nel 2026, sono entrato nel Seminario Redemptoris Mater di Boston."}},{"name":"Esau Flores","origin":"Garden Grove, California","stage":"Propaedeutic","parish":"St. Thomas Aquinas, Jamaica Plain","photo":"img:esau","story":{"en":"My name is Esau Flores, the seventh of eight children, from Orange County, California. Although I grew up in a Catholic family, we did not actively practice the faith. My father introduced me to the Church when I was young, but I began taking my Christian life seriously at seventeen. Years later, in a pilgrimage to Rome, I encountered a love I had never known before, a divine love that moved me to share that same love with others. The possibility of priesthood emerged in the summer of 2024, leading to a year of discernment. Though I had planned to complete my studies and pursue a healthcare career, I kept feeling an emptiness that lifted only when I encountered Christ, especially in prayer and the Eucharist. I entered the seminary seeking to trust the Lord and discern His will, one day at a time.","es":"Me llamo Esaú Flores, el séptimo de ocho hijos, del condado de Orange, California. Aunque crecí en una familia católica, no practicábamos activamente la fe. Mi padre me acercó a la Iglesia cuando era pequeño, pero empecé a tomarme en serio mi vida cristiana a los diecisiete años. Años después, en una peregrinación a Roma, encontré un amor que nunca había conocido, un amor divino que me impulsó a compartir ese mismo amor con los demás. La posibilidad del sacerdocio surgió en el verano de 2024 y me llevó a un año de discernimiento. Aunque había planeado terminar mis estudios y dedicarme a una carrera en el ámbito de la salud, seguía sintiendo un vacío que solo desaparecía cuando me encontraba con Cristo, especialmente en la oración y en la Eucaristía. Entré en el seminario buscando confiar en el Señor y discernir su voluntad, día a día.","pt":"Meu nome é Esaú Flores, o sétimo de oito filhos, do condado de Orange, na Califórnia. Embora tenha crescido numa família católica, não praticávamos ativamente a fé. Meu pai me apresentou à Igreja quando eu era pequeno, mas comecei a levar a sério a minha vida cristã aos dezessete anos. Anos depois, numa peregrinação a Roma, encontrei um amor que nunca tinha conhecido, um amor divino que me levou a partilhar esse mesmo amor com os outros. A possibilidade do sacerdócio surgiu no verão de 2024 e levou-me a um ano de discernimento. Embora tivesse planejado terminar os estudos e seguir carreira na área da saúde, continuava a sentir um vazio que só desaparecia quando me encontrava com Cristo, sobretudo na oração e na Eucaristia. Entrei no seminário procurando confiar no Senhor e discernir a Sua vontade, um dia de cada vez.","it":"Mi chiamo Esaù Flores, settimo di otto figli, della contea di Orange, in California. Pur essendo cresciuto in una famiglia cattolica, non praticavamo attivamente la fede. Mio padre mi ha avvicinato alla Chiesa quando ero piccolo, ma ho cominciato a prendere sul serio la mia vita cristiana a diciassette anni. Anni dopo, durante un pellegrinaggio a Roma, ho incontrato un amore che non avevo mai conosciuto, un amore divino che mi ha spinto a condividere quello stesso amore con gli altri. La possibilità del sacerdozio è emersa nell'estate del 2024 e mi ha portato a un anno di discernimento. Anche se avevo progettato di completare gli studi e intraprendere una carriera in ambito sanitario, continuavo a sentire un vuoto che spariva solo quando incontravo Cristo, soprattutto nella preghiera e nell'Eucaristia. Sono entrato in seminario cercando di fidarmi del Signore e di discernere la sua volontà, un giorno alla volta."}},{"name":"Timothy Patrick Sears","origin":"Springfield, Massachusetts","stage":"Propaedeutic","parish":"St. Thomas Aquinas, Jamaica Plain","photo":"img:timothy","story":{"en":"I am from Springfield, Massachusetts, and am the second of five brothers. My parents raised me in the faith, taking me to Mass, sending me to Catholic school, and to Catholic summer camp. Growing up, I always searched for meaning and happiness, looking for them in my appearance, reputation, accomplishments, relationships, and career. When I finally had many of the things I believed would make me happy, I felt completely empty and out of answers. Then God helped me realize I did not need to earn His love; He loves me exactly as I am, and only He can truly make me happy. This experience made me open to the possibility of giving my life in service to the Church. After discerning with various religious orders and dioceses, I came to recognize that God was calling me to continue my formation through the Neocatechumenal Way.","es":"Soy de Springfield, Massachusetts, y el segundo de cinco hermanos. Mis padres me educaron en la fe: me llevaban a Misa, me enviaron a una escuela católica y a un campamento de verano católico. Al crecer, siempre busqué sentido y felicidad, y los buscaba en mi apariencia, mi reputación, mis logros, mis relaciones y mi carrera. Cuando por fin tuve muchas de las cosas que creía que me harían feliz, me sentí completamente vacío y sin respuestas. Entonces Dios me ayudó a comprender que no tenía que ganarme su amor; Él me ama exactamente como soy, y solo Él puede hacerme verdaderamente feliz. Esta experiencia me abrió a la posibilidad de entregar mi vida al servicio de la Iglesia. Después de discernir con varias órdenes religiosas y diócesis, reconocí que Dios me llamaba a continuar mi formación a través del Camino Neocatecumenal.","pt":"Sou de Springfield, Massachusetts, e o segundo de cinco irmãos. Meus pais me criaram na fé: levavam-me à Missa, mandaram-me para uma escola católica e para um acampamento de verão católico. Ao crescer, sempre procurei sentido e felicidade, buscando-os na minha aparência, na reputação, nas conquistas, nos relacionamentos e na carreira. Quando finalmente tive muitas das coisas que eu acreditava que me fariam feliz, senti-me completamente vazio e sem respostas. Então Deus ajudou-me a perceber que eu não precisava merecer o Seu amor; Ele me ama exatamente como sou, e só Ele pode verdadeiramente me fazer feliz. Esta experiência abriu-me à possibilidade de dar a minha vida ao serviço da Igreja. Depois de discernir com várias ordens religiosas e dioceses, reconheci que Deus me chamava a continuar a minha formação por meio do Caminho Neocatecumenal.","it":"Vengo da Springfield, in Massachusetts, e sono il secondo di cinque fratelli. I miei genitori mi hanno cresciuto nella fede: mi portavano a Messa, mi hanno mandato in una scuola cattolica e a un campo estivo cattolico. Crescendo ho sempre cercato senso e felicità, e li cercavo nel mio aspetto, nella reputazione, nei successi, nelle relazioni e nella carriera. Quando finalmente ho avuto molte delle cose che pensavo mi avrebbero reso felice, mi sono sentito completamente vuoto e senza risposte. Allora Dio mi ha aiutato a capire che non dovevo guadagnarmi il suo amore: Lui mi ama esattamente come sono, e solo Lui può rendermi davvero felice. Questa esperienza mi ha aperto alla possibilità di donare la mia vita al servizio della Chiesa. Dopo un discernimento con diversi ordini religiosi e diocesi, ho riconosciuto che Dio mi chiamava a proseguire la mia formazione attraverso il Cammino Neocatecumenale."}}],"faculty":[{"name":"Very Rev. Antonio F. Medeiros","role":{"en":"Rector","es":"Rector","pt":"Reitor","it":"Rettore"},"photo":"img:rector"},{"name":"Rev. Łukasz Wiśniewski","role":{"en":"Vice Rector","es":"Vicerrector","pt":"Vice-Reitor","it": daremos más detalles!","pt":"Celebre os marcos importantes na vida dos nossos seminaristas, quando são admitidos como candidatos às Ordens Sacras ou ordenados diáconos e presbíteros. Una-se a nós em oração e ação de graças enquanto dão esses passos significativos em seu caminho vocacional e de serviço à Igreja. Mais detalhes em breve!","it":"Celebra le tappe importanti nella vita dei nostri seminaristi, quando vengono ammessi come candidati agli Ordini Sacri oppure ordinati diaconi e presbiteri. Unisciti a noi nella preghiera e nel rendimento di grazie mentre compiono questi passi significativi nel loro cammino vocazionale e di servizio alla Chiesa. Maggiori dettagli a breve!"}},{"date":"2027 — TBA","type":"dinner","link":"journal.html","title":{"en":"2027 Seminary Appreciation Dinner","es":"Cena de Gratitud del Seminario 2027","pt":"Jantar de Gratidão do Seminário 2027","it":"Cena di Riconoscenza del Seminario 2027"},"text":{"en":"Stay tuned!","es":"¡Mantente atento!","pt":"Fique atento!","it":"Restate sintonizzati!"},"logo":"logo_sad"}],"gala":{"title":{"en":"Annual Gala Dinner 2027","es":"Cena de Gala 2027","pt":"Jantar de Gala 2027","it":"Cena di Gala 2027"},"date":"Date to be announced","venue":"Venue to be announced","status":"soon","ticketLink":"https://rmsboston.ticketspice.com/","journalPdf":"https://7250a92c-49c7-4d85-a5c2-3fbb5a1adfb3.usrfiles.com/ugd/7250a9_f8c2e3a3ea324f31a64d4efac9dea8a3.pdf","text":{"en":"An evening of friendship, music by our seminarians, and support for priestly formation. Details about the 2027 Gala Dinner will be announced soon!","es":"Una noche de amistad, música de nuestros seminaristas y apoyo a la formación sacerdotal. ¡Pronto anunciaremos los detalles de la Cena de Gala 2027!","pt":"Uma noite de amizade, música dos nossos seminaristas e apoio à formação sacerdotal. Os detalhes do Jantar de Gala 2027 serão anunciados em breve!","it":"Una serata di amicizia, musica dei nostri seminaristi e sostegno alla formazione sacerdotale. or a seminarian.","es":"El pan de cada día y libros para un seminarista.","pt":"O pão de cada dia e livros para um seminarista.","it":"Il pane quotidiano e i libri per un seminarista."}},{"amount":"50","title":{"en":"Formation Friend","es":"Amigo de la formación","pt":"Amigo da formação","it":"Amico della formazione"},"text":{"en":"Helps with studies and formation.","es":"Ayuda con los estudios y la formación.","pt":"Ajuda nos estudos e na formação.","it":"Aiuta negli studi e nella formazione."}},{"amount":"100","title":{"en":"Sponsor a Seminarian","es":"Patrocina a un seminarista","pt":"Patrocine um seminarista","it":"Sostieni un seminarista"},"text":{"en":"Accompany one seminarian in his formation.","es":"Acompaña a un seminarista en su formación.","pt":"Acompanhe um seminarista em sua formação.","it":"Accompagna un seminarista nella sua formazione."}},{"amount":"250","title":{"en":"Missionary Patron","es":"Patrono misionero","pt":"Patrono missionário","it":"Patrono missionario"},"text":{"en":"Supports missionary formation and itinerancy.","es":"Sostiene la formación misionera y la itinerancia.","pt":"Sustenta a formação missionária e a itinerância.","it":"Sostiene la formazione missionaria e l'itineranza."}}],"brick":{"text":{"en":"Plant your name in stone, and let it whisper through the ages a prayer of love and faith. Each brick on our Prayer Wall is a lasting legacy for you, your family or a loved one.","es":"Planta tu nombre en la piedra y deja que susurre a través de los siglos una oración de amor y de fe. Cada ladrillo de nuestro Muro de Oración es un legado duradero para ti, tu familia o un ser querido.","pt":"Plante seu nome na pedra e deixe que ele sussurre através dos tempos uma oração de amor e de fé. Cada tijolo do nosso Muro de Oração é um legado duradouro para você, sua família ou um ente querido.","it":"Pianta il tuo nome nella pietra e lascia che sussurri nei secoli una preghiera d'amore e di fede. Ogni mattone del nostro Muro della Preghiera è un'eredità duratura per te, la tua famiglia o una persona cara."},"tiers":[{"name":{"en":"Classic Brick","es":"Ladrillo clásico","pt":"Tijolo clássico","it":"Mattone classico"},"size":"4 × 8 in","price":"—","lines":"3 lines"},{"name":{"en":"Family Brick","es":"Ladrillo familiar","pt":"Tijolo família","it":"Mattone famiglia"},"size":"8 × 8 in","price":"—","lines":"6 lines"},{"name":{"en":"Memorial Stone","es":"Piedra memorial","pt":"Pedra memorial","it":"Pietra commemorativa"},"size":"12 × 12 in","price":"—","lines":"Name + logo"}]},"faq":[{"keys":"address,where,located,direccion,dónde,endereço,onde,visit,visitar,indirizzo,dove,visitare","go":"contact","answer":{"en":"We are at 774 Boylston Street, Chestnut Hill, MA 02467-2501.","es":"Estamos en 774 Boylston Street, Chestnut Hill, MA 02467-2501.","pt":"Estamos na 774 Boylston Street, Chestnut Hill, MA 02467-2501.","it":"Ci troviamo al 774 Boylston Street, Chestnut Hill, MA 02467-2501."}},{"keys":"phone,call,email,contact,teléfono,llamar,correo,contacto,telefone,ligar,contato,telefono,chiamare,contatto,contatti","go":"contact","answer":{"en":"You can call 617-879-9813 or write to seminary@rmsboston.org.","es":"Puede llamar al 617-879-9813 o escribir a seminary@rmsboston.org.","pt":"Você pode ligar para 617-879-9813 ou escrever para seminary@rmsboston.org.","it":"Potete chiamare il 617-879-9813 o scrivere a seminary@rmsboston.org."}},{"keys":"donate,give,giving,donation,venmo,paypal,cash app,text,donar,donación,doar,doação,oferta,donare,donazione,offerta","go":"give","answer":{"en":"You can give online, by Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), text-to-give (857-663-7535, keyword $RMSBOSTON) or by check mailed to the seminary. Redemptoris Mater Seminary is a 501(c)(3); gifts are tax-deductible to the fullest extent of the law.","es":"Puede donar en línea, por Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), mensaje de texto (857-663-7535, palabra $RMSBOSTON) o con un cheque enviado al seminario. El seminario es una organización 501(c)(3); las donaciones son deducibles de impuestos en la medida que permite la ley.","pt":"Você pode doar online, por Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), mensagem de texto (857-663-7535, palavra $RMSBOSTON) ou por cheque enviado ao seminário. O seminário é uma organização 501(c)(3); as doações são dedutíveis de impostos nos termos da lei.","it":"Potete donare online, con Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), via SMS (857-663-7535, parola $RMSBOSTON) o con un assegno inviato al seminario. Il seminario è un ente 501(c)(3); le donazioni sono deducibili nei limiti di legge."}},{"keys":"monthly,recurring,sponsor,mensual,patrocinar,mensal,patrocinar,apadrinhar,mensile,sostenere","go":"sponsor","answer":{"en":"You can sponsor a seminarian with a monthly gift. Choose a level in the “Sponsor a Seminarian” section.","es":"Puede patrocinar a un seminarista con una donación mensual. Elija un nivel en la sección “Patrocina a un seminarista”.","pt":"Você pode patrocinar um seminarista com uma doação mensal. Escolha um nível na seção “Patrocine um seminarista”.","it":"Potete sostenere un seminarista con una donazione mensile. Scegliete un livello nella sezione “Sostieni un seminarista”."}},{"keys":"bequest,will,planned,legacy,testamento,herencia,legado,herança,lascito,eredità,testamento","go":"sponsor","answer":{"en":"For bequests and planned gifts, please contact the Rector of the Seminary.","es":"Para legados y donaciones planificadas, comuníquese con el Rector del Seminario.","pt":"Para legados e doações planejadas, entre em contato com o Reitor do Seminário.","it":"Per lasciti e donazioni pianificate, contattate il Rettore del Seminario."}},{"keys":"brick,prayer wall,ladrillo,muro,tijolo,mattone,muro","go":"brick","answer":{"en":"You can buy a brick for our Prayer Wall — see the options in the Buy a Brick section.","es":"Puede comprar un ladrillo para nuestro Muro de Oración — vea las opciones en la sección Compra un ladrillo.","pt":"Você pode comprar um tijolo para o nosso Muro de Oração — veja as opções na seção Compre um tijolo.","it":"Potete acquistare un mattone per il nostro Muro della Preghiera — vedete le opzioni nella sezione Acquista un mattone."}},{"keys":"gala,dinner,tickets,table,journal,cena,boletos,mesa,jantar,ingressos,biglietti,tavolo,cena","go":"gala","answer":{"en":"The 2027 Gala Dinner date will be announced soon. Tickets will be sold online through TicketSpice.","es":"La fecha de la Cena de Gala 2027 se anunciará pronto. Los boletos se venderán en línea por TicketSpice.","pt":"A data do Jantar de Gala 2027 será anunciada em breve. Os ingressos serão vendidos online pela TicketSpice.","it":"La data della Cena di Gala 2027 sarà annunciata a breve. I biglietti saranno venduti online tramite TicketSpice."}},{"keys":"chapel,capilla,capela,construction,construcción,construção,cappella,costruzione","go":"chapel","answer":{"en":"We are building a new chapel. See the Chapel Project section for progress.","es":"Estamos construyendo una nueva capilla. Vea el avance en la sección Proyecto de la Capilla.","pt":"Estamos construindo uma nova capela. Veja o andamento na seção Projeto da Capela.","it":"Stiamo costruendo una nuova cappella. Vedete l'avanzamento nella sezione Progetto della Cappella."}},{"keys":"neocatechumenal,way,camino,caminho,kiko,cammino","go":"about","answer":{"en":"Our seminarians discover their vocation through the Neocatechumenal Way, which St. John Paul II called “an itinerary of Catholic formation valid for our society and our time.”","es":"Nuestros seminaristas descubren su vocación a través del Camino Neocatecumenal, que San Juan Pablo II llamó “un itinerario de formación católica válido para nuestra sociedad y para nuestro tiempo.”","pt":"Nossos seminaristas descobrem sua vocação por meio do Caminho Neocatecumenal, que São João Paulo II chamou de “um itinerário de formação católica válido para a nossa sociedade e para o nosso tempo.”","it":"I nostri seminaristi scoprono la loro vocazione attraverso il Cammino Neocatecumenale, che San Giovanni Paolo II ha definito “un itinerario di formazione cattolica valido per la nostra società e per i nostri tempi.”"}},{"keys":"history,founded,when,historia,fundado,história,fundação,storia,fondazione","go":"history","answer":{"en":"The seminary opened in September 2005 and was officially erected by Cardinal Seán P. O’Malley, OFM Cap, on March 25, 2006.","es":"El seminario abrió en septiembre de 2005 y fue erigido oficialmente por el Cardenal Seán P. O’Malley, OFM Cap, el 25 de marzo de 2006.","pt":"O seminário abriu em setembro de 2005 e foi erigido oficialmente pelo Cardeal Seán P. O’Malley, OFM Cap, em 25 de março de 2006.","it":"Il seminario è stato aperto nel settembre 2005 ed eretto ufficialmente dal Cardinale Seán P. O’Malley, OFM Cap, il 25 marzo 2006."}},{"keys":"formation,stages,propaedeutic,discipleship,configuration,itinerancy,formación,etapas,formação,formazione,tappe","go":"formation","answer":{"en":"Formation is human, intellectual, spiritual and pastoral, in four stages: Propaedeutic, Discipleship, Configuration and Itinerancy. Seminarians spend three years in missionary formation before ordination.","es":"La formación es humana, intelectual, espiritual y pastoral, en cuatro etapas: Propedéutico, Discipulado, Configuración e Itinerancia. Los seminaristas pasan tres años en formación misionera antes de la ordenación.","pt":"A formação é humana, intelectual, espiritual e pastoral, em quatro etapas: Propedêutico, Discipulado, Configuração e Itinerância. Os seminaristas passam três anos em formação missionária antes da ordenação.","it":"La formazione è umana, intellettuale, spirituale e pastorale, in quattro tappe: Propedeutica, Discepolato, Configurazione e Itineranza. I seminaristi trascorrono tre anni di formazione missionaria prima dell'ordinazione."}},{"keys":"priest,priests,sacerdote,sacerdotes,padre,padres,ordained,sacerdoti,preti,priests,ordained,assigned,assignments,sacerdotes,padres,sacerdoti,preti,ordenados,ordinati","go":"priests","answer":{"en":"Twenty-three priests have been ordained for the Archdiocese of Boston from our Seminary. They serve in Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston and the Metropolitan Tribunal — and on mission in Atlanta, the U.S. Virgin Islands and Samoa. Six missionary priests formed in other Redemptoris Mater seminaries also serve here. See “Our Priests.”","es":"Veintitrés sacerdotes han sido ordenados para la Arquidiócesis de Boston desde nuestro Seminario. Sirven en Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston y el Tribunal Metropolitano — y en misión en Atlanta, las Islas Vírgenes de EE. UU. y Samoa. También sirven aquí seis sacerdotes misioneros formados en otros seminarios Redemptoris Mater. Vea “Nuestros sacerdotes”.","pt":"Vinte e três sacerdotes foram ordenados para a Arquidiocese de Boston a partir do nosso Seminário. Servem em Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston e o Tribunal Metropolitano — e em missão em Atlanta, nas Ilhas Virgens Americanas e em Samoa. Seis sacerdotes missionários formados em outros seminários Redemptoris Mater também servem aqui. Veja “Nossos sacerdotes”.","it":"Ventitré sacerdoti sono stati ordinati per l'Arcidiocesi di Boston dal nostro Seminario. Servono in Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston e il Tribunale Metropolitano — e in missione ad Atlanta, nelle Isole Vergini americane e nelle Samoa. Servono qui anche sei sacerdoti missionari formati in altri seminari Redemptoris Mater. Vedi “I nostri sacerdoti”."}},{"keys":"rector,medeiros,faculty,formators,reitor,formadores,rettore,formatori","go":"formHead","answer":{"en":"The Rector is Very Rev. Antonio F. Medeiros; the Vice Rector is Rev. Łukasz Wiśniewski; the Spiritual Director is Rev. Francesco Palombi.","es":"El Rector es el Muy Rvdo. P. Antonio F. Medeiros; el Vicerrector, el Rvdo. P. Łukasz Wiśniewski; el Director Espiritual, el Rvdo. P. Francesco Palombi.","pt":"O Reitor é o Revmo. Pe. Antonio F. Medeiros; o Vice-Reitor, o Pe. Łukasz Wiśniewski; o Diretor Espiritual, o Pe. Francesco Palombi.","it":"Il Rettore è il Rev.mo Don Antonio F. Medeiros; il Vice Rettore è Don Łukasz Wiśniewski; il Direttore Spirituale è Don Francesco Palombi."}},{"keys":"video,videos,youtube,watch,ver,assistir,guardare","go":"media","answer":{"en":"Our videos are in the Multimedia section and on our YouTube channel.","es":"Nuestros videos están en la sección Multimedia y en nuestro canal de YouTube.","pt":"Nossos vídeos estão na seção Multimídia e no nosso canal do YouTube.","it":"I nostri video sono nella sezione Multimedia e sul nostro canale YouTube."}},{"keys":"newsletter,updates,subscribe,boletín,suscribir,boletim,inscrever,notiziario,iscriversi","go":"contact","answer":{"en":"Sign up for Seminary updates at the bottom of the page.","es":"Suscríbase a las noticias del Seminario al final de la página.","pt":"Inscreva-se para receber as notícias do Seminário no final da página.","it":"Iscrivetevi alle notizie del Seminario in fondo alla pagina."}}],"way":{"intro":{"en":"The Neocatechumenal Way is an itinerary of Christian formation lived in small communities within the parish. Born in 1964 among the poor of the shacks of Palomeras Altas in Madrid, through Kiko Argüello and Carmen Hernández, it helps adults rediscover the riches of their Baptism through the Word of God, the Liturgy and community life. Its Statutes were definitively approved by the Holy See in 2008. St. John Paul II recognized it as “an itinerary of Catholic formation valid for our society and our time.”","es":"El Camino Neocatecumenal es un itinerario de formación cristiana que se vive en pequeñas comunidades dentro de la parroquia. Nacido en 1964 entre los pobres de las barracas de Palomeras Altas, en Madrid, a través de Kiko Argüello y Carmen Hernández, ayuda a los adultos a redescubrir la riqueza de su Bautismo mediante la Palabra de Dios, la Liturgia y la vida en comunidad. Sus Estatutos fueron aprobados definitivamente por la Santa Sede en 2008. San Juan Pablo II lo reconoció como “un itinerario de formación católica válido para nuestra sociedad y para nuestro tiempo.”","pt":"O Caminho Neocatecumenal é um itinerário de formação cristã vivido em pequenas comunidades dentro da paróquia. Nascido em 1964 entre os pobres dos barracos de Palomeras Altas, em Madri, por meio de Kiko Argüello e Carmen Hernández, ajuda os adultos a redescobrir a riqueza do seu Batismo pela Palavra de Deus, pela Liturgia e pela vida em comunidade. Seus Estatutos foram aprovados definitivamente pela Santa Sé em 2008. São João Paulo II o reconheceu como “um itinerário de formação católica válido para a nossa sociedade e para o nosso tempo.”","it":"Il Cammino Neocatecumenale è un itinerario di formazione cristiana vissuto in piccole comunità all'interno della parrocchia. Nato nel 1964 tra i poveri delle baracche di Palomeras Altas, a Madrid, attraverso Kiko Argüello e Carmen Hernández, aiuta gli adulti a riscoprire la ricchezza del loro Battesimo mediante la Parola di Dio, la Liturgia e la vita comunitaria. I suoi Statuti sono stati approvati definitivamente dalla Santa Sede nel 2008. San Giovanni Paolo II lo ha riconosciuto come “un itinerario di formazione cattolica valido per la nostra società e per i nostri tempi.”"},"pillars":[{"en":"Word of God","es":"Palabra de Dios","pt":"Palavra de Deus","it":"Parola di Dio"},{"en":"Liturgy","es":"Liturgia","pt":"Liturgia","it":"Liturgia"},{"en":"Community","es":"Comunidad","pt":"Comunidade","it":"Comunità"}],"parishes":[],"art1":"img:art_virgin_kiko","art2":"img:image_2","mailEndpoint":"","v":6},"liturgy":{"ascensionSunday":false,"proxy":"","sources":{"en":{"label":"USCCB — Daily Readings","url":"https://bible.usccb.org/bi   const sanct = {};
  const BIO = {"01-01":{"en":"On the octave day of Christmas, the Church honors Mary as Mother of God, as proclaimed at the Council of Ephesus in 431: the Son she bore is truly God.","es":"En la octava de Navidad, la Iglesia honra a María como Madre de Dios, como proclamó el Concilio de Éfeso en el año 431: el Hijo que ella dio a luz es verdadero Dios.","pt":"Na oitava do Natal, a Igreja honra Maria como Mãe de Deus, como proclamou o Concílio de Éfeso em 431: o Filho que ela deu à luz é verdadeiro Deus.","it":"Nell'ottava di Natale, la Chiesa onora Maria come Madre di Dio, come proclamò il Concilio di Efeso nel 431: il Figlio da lei generato è vero Dio."},"01-02":{"en":"Two friends and Doctors of the Church from fourth-century Cappadocia. Basil, bishop of Caesarea, shaped Eastern monastic life; Gregory, \"the Theologian,\" defended the faith in the Holy Trinity.","es":"Dos amigos y Doctores de la Iglesia de la Capadocia del siglo IV. Basilio, obispo de Cesarea, dio forma a la vida monástica de Oriente; Gregorio, \"el Teólogo\", defendió la fe en la Santísima Trinidad.","pt":"Dois amigos e Doutores da Igreja da Capadócia do século IV. Basílio, bispo de Cesareia, deu forma à vida monástica do Oriente; Gregório, \"o Teólogo\", defendeu a fé na Santíssima Trindade.","it":"Due amici e Dottori della Chiesa della Cappadocia del IV secolo. Basilio, vescovo di Cesarea, diede forma alla vita monastica d'Oriente; Gregorio, \"il Teologo\", difese la fede nella Santissima Trinità."},"01-03":{"en":"The Church venerates the name given to the Child by the angel: Jesus, \"God saves.\" At this name, Saint Paul writes, every knee should bend.","es":"La Iglesia venera el nombre que el ángel dio al Niño: Jesús, \"Dios salva\". Ante este nombre, escribe san Pablo, toda rodilla se doble.","pt":"A Igreja venera o nome que o anjo deu ao Menino: Jesus, \"Deus salva\". Diante deste nome, escreve São Paulo, todo joelho se dobre.","it":"La Chiesa venera il nome che l'angelo diede al Bambino: Gesù, \"Dio salva\". Davanti a questo nome, scrive san Paolo, ogni ginocchio si pieghi."},"01-04":{"en":"Born in New York in 1774, a widow and mother of five, she became Catholic, founded the Sisters of Charity and laid the foundations of Catholic schools in America. The first native-born saint of the United States.","es":"Nacida en Nueva York en 1774, viuda y madre de cinco hijos, se hizo católica, fundó las Hermanas de la Caridad y puso los cimientos de la escuela católica en América. Primera santa nacida en los Estados Unidos.","pt":"Nascida em Nova York em 1774, viúva e mãe de cinco filhos, tornou-se católica, fundou as Irmãs da Caridade e lançou os alicerces da escola católica na América. Primeira santa nascida nos Estados Unidos.","it":"Nata a New York nel 1774, vedova e madre di cinque figli, divenne cattolica, fondò le Suore della Carità e pose le basi della scuola cattolica in America. Prima santa nata negli Stati Uniti."},"01-05":{"en":"Born in Bohemia, he came to America in 1836, became a Redemptorist and Bishop of Philadelphia, and organized the first diocesan Catholic school system in the United States.","es":"Nacido en Bohemia, llegó a América en 1836, se hizo redentorista y fue obispo de Filadelfia, donde organizó el primer sistema diocesano de escuelas católicas de los Estados Unidos.","pt":"Nascido na Boêmia, chegou à América em 1836, tornou-se redentorista e bispo de Filadélfia, onde organizou o primeiro sistema diocesano de escolas católicas dos Estados Unidos.","it":"Nato in Boemia, giunse in America nel 1836, divenne redentorista e vescovo di Filadelfia, dove organizzò il primo sistema diocesano di scuole cattoliche degli Stati Uniti."},"01-06":{"en":"A humble Holy Cross brother and doorkeeper in Montreal, devoted to Saint Joseph. Countless sick people came to him for prayer, and his faith gave rise to Saint Joseph's Oratory.","es":"Humilde hermano de la Santa Cruz y portero en Montreal, devoto de san José. Innumerables enfermos acudían a él pidiendo oración, y de su fe nació el Oratorio de San José.","pt":"Humilde irmão da Santa Cruz e porteiro em Montreal, devoto de São José. Inúmeros doentes o procuravam pedindo oração, e de sua fé nasceu o Oratório de São José.","it":"Umile fratello della Santa Croce e portinaio a Montréal, devoto di san Giuseppe. Innumerevoli malati venivano da lui a chiedere preghiere, e dalla sua fede nacque l'Oratorio di San Giuseppe."},"01-07":{"en":"Dominican of Barcelona and canon lawyer, he compiled the Decretals for Pope Gregory IX and served as Master of his Order. He died in 1275 and is patron of canon lawyers.","es":"Dominico de Barcelona y canonista, compiló las Decretales para el papa Gregorio IX y fue Maestro de su Orden. Murió en 1275 y es patrono de los canonistas.","pt":"Dominicano de Barcelona e canonista, compilou as Decretais para o papa Gregório IX e foi Mestre de sua Ordem. Morreu em 1275 e é padroeiro dos canonistas.","it":"Domenicano di Barcellona e canonista, compilò le Decretali per papa Gregorio IX e fu Maestro del suo Ordine. Morì nel 1275 ed è patrono dei canonisti."},"01-13":{"en":"Bishop of Poitiers in the fourth century, exiled for defending the divinity of Christ against Arianism. His writings on the Trinity made him a Doctor of the Church.","es":"Obispo de Poitiers en el siglo IV, desterrado por defender la divinidad de Cristo contra el arrianismo. Sus escritos sobre la Trinidad lo hicieron Doctor de la Iglesia.","pt":"Bispo de Poitiers no século IV, exilado por defender a divindade de Cristo contra o arianismo. Seus escritos sobre a Trindade fizeram dele Doutor da Igreja.","it":"Vescovo di Poitiers nel IV secolo, esiliato per aver difeso la divinità di Cristo contro l'arianesimo. I suoi scritti sulla Trinità ne fecero un Dottore della Chiesa."},"01-17":{"en":"An Egyptian who, at about twenty, gave away all he had and went into the desert. Father of monks, he taught that the heart is won by prayer, work and humility. He died in 356.","es":"Egipcio que, hacia los veinte años, dio todo lo que tenía y se retiró al desierto. Padre de los monjes, enseñó que el corazón se gana con oración, trabajo y humildad. Murió en el año 356.","pt":"Egípcio que, por volta dos vinte anos, deu tudo o que tinha e retirou-se para o deserto. Pai dos monges, ensinou que o coração se conquista com oração, trabalho e humildade. Morreu em 356.","it":"Egiziano che, verso i vent'anni, donò tutto ciò che aveva e si ritirò nel deserto. Padre dei monaci, insegnò che il cuore si conquista con la preghiera, il lavoro e l'umiltà. Morì nel 356."},"01-20":{"en":"Fabian, Pope from 236, was martyred under Decius in 250. Sebastian, a Roman soldier who strengthened his fellow Christians, was martyred around 288.","es":"Fabián, papa desde el año 236, fue martirizado bajo Decio en el 250. Sebastián, soldado romano que fortalecía a sus hermanos cristianos, fue martirizado hacia el año 288.","pt":"Fabiano, papa a partir de 236, foi martirizado sob Décio em 250. Sebastião, soldado romano que fortalecia os irmãos cristãos, foi martirizado por volta de 288.","it":"Fabiano, papa dal 236, fu martirizzato sotto Decio nel 250. Sebastiano, soldato romano che sosteneva i fratelli cristiani, fu martirizzato verso il 288."},"01-21":{"en":"A young Roman virgin martyred around 304 for refusing to renounce Christ. On her day, lambs are blessed whose wool is woven into the pallium of archbishops.","es":"Joven virgen romana martirizada hacia el año 304 por negarse a renegar de Cristo. En su día se bendicen los corderos con cuya lana se teje el palio de los arzobispos.","pt":"Jovem virgem romana martirizada por volta de 304 por recusar-se a renegar Cristo. Em seu dia são abençoados os cordeiros cuja lã é tecida no pálio dos arcebispos.","it":"Giovane vergine romana martirizzata verso il 304 per essersi rifiutata di rinnegare Cristo. Nel suo giorno si benedicono gli agnelli con la cui lana si tesse il pallio degli arcivescovi."},"01-22":{"en":"In the dioceses of the United States, a day of prayer for the legal protection of human life from conception, and of penance for offenses against the dignity of the human person.","es":"En las diócesis de los Estados Unidos, jornada de oración por la protección legal de la vida humana desde la concepción, y de penitencia por las ofensas contra la dignidad de la persona.","pt":"Nas dioceses dos Estados Unidos, dia de oração pela proteção legal da vida humana desde a concepção, e de penitência pelas ofensas contra a dignidade da pessoa.","it":"Nelle diocesi degli Stati Uniti, giornata di preghiera per la tutela giuridica della vita umana fin dal concepimento, e di penitenza per le offese alla dignità della persona."},"01-23":{"en":"Vincent, deacon of Saragossa, died a martyr in 304. Marianne Cope, a Franciscan sister from Syracuse, New York, cared for those with leprosy on Molokai, Hawaii, until her death in 1918.","es":"Vicente, diácono de Zaragoza, murió mártir en el año 304. Mariana Cope, religiosa franciscana de Syracuse, Nueva York, cuidó a los enfermos de lepra en Molokai, Hawái, hasta su muerte en 1918.","pt":"Vicente, diácono de Saragoça, morreu mártir em 304. Mariana Cope, religiosa franciscana de Syracuse, Nova York, cuidou dos doentes de lepra em Molokai, no Havaí, até sua morte em 1918.","it":"Vincenzo, diacono di Saragozza, morì martire nel 304. Marianna Cope, suora francescana di Syracuse, New York, assistette i malati di lebbra a Molokai, nelle Hawaii, fino alla morte nel 1918."},"01-24":{"en":"Bishop of Geneva and Doctor of the Church, he won hearts by gentleness and wrote the Introduction to the Devout Life. Co-founder of the Visitation, he died in 1622.","es":"Obispo de Ginebra y Doctor de la Iglesia, ganó los corazones con su mansedumbre y escribió la Introducción a la vida devota. Cofundador de la Visitación, murió en 1622.","pt":"Bispo de Genebra e Doutor da Igreja, conquistou os corações pela mansidão e escreveu a Filoteia, Introdução à vida devota. Cofundador da Visitação, morreu em 1622.","it":"Vescovo di Ginevra e Dottore della Chiesa, conquistò i cuori con la dolcezza e scrisse la Filotea, Introduzione alla vita devota. Cofondatore della Visitazione, morì nel 1622."},"01-25":{"en":"On the road to Damascus, Saul the persecutor met the risen Christ and became Paul, the Apostle of the Nations, who carried the Gospel across the Roman world.","es":"En el camino de Damasco, Saulo el perseguidor se encontró con Cristo resucitado y se convirtió en Pablo, el Apóstol de las gentes, que llevó el Evangelio por todo el mundo romano.","pt":"No caminho de Damasco, Saulo, o perseguidor, encontrou o Cristo ressuscitado e tornou-se Paulo, o Apóstolo dos gentios, que levou o Evangelho por todo o mundo romano.","it":"Sulla via di Damasco, Saulo il persecutore incontrò Cristo risorto e divenne Paolo, l'Apostolo delle genti, che portò il Vangelo in tutto il mondo romano."},"01-26":{"en":"Disciples and co-workers of Saint Paul, entrusted with the churches of Ephesus and Crete. The Pastoral Letters addressed to them still guide bishops and priests.","es":"Discípulos y colaboradores de san Pablo, a quienes confió las Iglesias de Éfeso y de Creta. Las Cartas pastorales que les dirigió siguen guiando a obispos y sacerdotes.","pt":"Discípulos e colaboradores de São Paulo, a quem ele confiou as Igrejas de Éfeso e de Creta. As Cartas pastorais a eles dirigidas continuam a guiar bispos e sacerdotes.","it":"Discepoli e collaboratori di san Paolo, ai quali egli affidò le Chiese di Efeso e di Creta. Le Lettere pastorali a loro indirizzate guidano ancora vescovi e sacerdoti."},"01-27":{"en":"An Italian laywoman who founded the Company of Saint Ursula, a pioneering community devoted to the Christian education of girls. She died in 1540.","es":"Laica italiana que fundó la Compañía de Santa Úrsula, comunidad pionera dedicada a la educación cristiana de las jóvenes. Murió en 1540.","pt":"Leiga italiana que fundou a Companhia de Santa Úrsula, comunidade pioneira dedicada à educação cristã das jovens. Morreu em 1540.","it":"Laica italiana che fondò la Compagnia di Sant'Orsola, comunità pionieristica dedicata all'educazione cristiana delle giovani. Morì nel 1540."},"01-28":{"en":"Dominican friar, the \"Angelic Doctor,\" who joined faith and reason in the Summa Theologiae and wrote Eucharistic hymns still sung today. He died in 1274 and is patron of Catholic schools.","es":"Fraile dominico, el \"Doctor Angélico\", que unió fe y razón en la Suma Teológica y escribió himnos eucarísticos que aún se cantan. Murió en 1274 y es patrono de las escuelas católicas.","pt":"Frade dominicano, o \"Doutor Angélico\", que uniu fé e razão na Suma Teológica e escreveu hinos eucarísticos ainda hoje cantados. Morreu em 1274 e é padroeiro das escolas católicas.","it":"Frate domenicano, il \"Dottore Angelico\", che unì fede e ragione nella Summa Theologiae e scrisse inni eucaristici cantati ancora oggi. Morì nel 1274 ed è patrono delle scuole cattoliche."},"01-31":{"en":"Priest of Turin who gathered poor and abandoned youth and educated them through reason, religion and loving kindness. Founder of the Salesians, he died in 1888.","es":"Sacerdote de Turín que reunió a jóvenes pobres y abandonados y los educó con la razón, la religión y el amor. Fundador de los salesianos, murió en 1888.","pt":"Sacerdote de Turim que acolheu jovens pobres e abandonados e os educou pela razão, pela religião e pelo amor. Fundador dos salesianos, morreu em 1888.","it":"Sacerdote di Torino che accolse giovani poveri e abbandonati e li educò con la ragione, la religione e l'amorevolezza. Fondatore dei salesiani, morì nel 1888."},"02-02":{"en":"Forty days after Christmas, Mary and Joseph present Jesus in the Temple, where Simeon greets him as the light of the nations. Candles are blessed, and the Church prays for consecrated life.","es":"Cuarenta días después de Navidad, María y José presentan a Jesús en el Templo, donde Simeón lo saluda como luz de las naciones. Se bendicen las candelas y la Iglesia ora por la vida consagrada.","pt":"Quarenta dias depois do Natal, Maria e José apresentam Jesus no Templo, onde Simeão o saúda como luz das nações. Abençoam-se as velas e a Igreja reza pela vida consagrada.","it":"Quaranta giorni dopo Natale, Maria e Giuseppe presentano Gesù al Tempio, dove Simeone lo saluta come luce delle genti. Si benedicono le candele e la Chiesa prega per la vita consacrata."},"02-03":{"en":"Blaise, bishop of Sebaste in Armenia, was martyred around 316; throats are blessed on his day. Ansgar, monk and bishop of Hamburg, who died in 865, is the Apostle of the North.","es":"Blas, obispo de Sebaste en Armenia, fue martirizado hacia el año 316; en su día se bendicen las gargantas. Óscar (Anscario), monje y obispo de Hamburgo, murió en el 865 y es el Apóstol del Norte.","pt":"Brás, bispo de Sebaste na Armênia, foi martirizado por volta de 316; em seu dia abençoam-se as gargantas. Oscar (Anscário), monge e bispo de Hamburgo, morreu em 865 e é o Apóstolo do Norte.","it":"Biagio, vescovo di Sebaste in Armenia, fu martirizzato verso il 316; nel suo giorno si benedice la gola. Ansgario, monaco e vescovo di Amburgo, morì nell'865 ed è l'Apostolo del Nord."},"02-05":{"en":"A virgin of Sicily, martyred at Catania around 251 for her fidelity to Christ. She is named in the Roman Canon.","es":"Virgen de Sicilia, martirizada en Catania hacia el año 251 por su fidelidad a Cristo. Es nombrada en el Canon Romano.","pt":"Virgem da Sicília, martirizada em Catânia por volta de 251 por sua fidelidade a Cristo. É nomeada no Cânon Romano.","it":"Vergine di Sicilia, martirizzata a Catania verso il 251 per la sua fedeltà a Cristo. È nominata nel Canone Romano."},"02-06":{"en":"A Japanese Jesuit crucified with twenty-five companions at Nagasaki in 1597. From the cross he preached Christ and forgave those who put him to death.","es":"Jesuita japonés crucificado con veinticinco compañeros en Nagasaki en 1597. Desde la cruz predicó a Cristo y perdonó a quienes le daban muerte.","pt":"Jesuíta japonês crucificado com vinte e cinco companheiros em Nagasaki, em 1597. Do alto da cruz pregou Cristo e perdoou os que lhe davam a morte.","it":"Gesuita giapponese crocifisso con venticinque compagni a Nagasaki nel 1597. Dalla croce predicò Cristo e perdonò coloro che lo mettevano a morte."},"02-08":{"en":"Jerome Emiliani, a Venetian soldier converted in prison, founded homes for orphans and died in 1537. Josephine Bakhita, enslaved in Sudan, found freedom in Christ and became a Canossian sister; she died in 1947.","es":"Jerónimo Emiliani, soldado veneciano convertido en prisión, fundó casas para huérfanos y murió en 1537. Josefina Bakhita, esclavizada en Sudán, encontró en Cristo la libertad y se hizo religiosa canosiana; murió en 1947.","pt":"Jerônimo Emiliani, soldado veneziano convertido na prisão, fundou casas para órfãos e morreu em 1537. Josefina Bakhita, escravizada no Sudão, encontrou em Cristo a liberdade e tornou-se irmã canossiana; morreu em 1947.","it":"Girolamo Emiliani, soldato veneziano convertito in prigione, fondò case per gli orfani e morì nel 1537. Giuseppina Bakhita, ridotta in schiavitù in Sudan, trovò in Cristo la libertà e divenne suora canossiana; morì nel 1947."},"02-10":{"en":"Twin sister of Saint Benedict, consecrated to God from childhood. Saint Gregory the Great wrote that she could do more because she loved more. She died around 547.","es":"Hermana gemela de san Benito, consagrada a Dios desde la infancia. San Gregorio Magno escribió que pudo más porque amó más. Murió hacia el año 547.","pt":"Irmã gêmea de São Bento, consagrada a Deus desde a infância. São Gregório Magno escreveu que ela pôde mais porque amou mais. Morreu por volta de 547.","it":"Sorella gemella di san Benedetto, consacrata a Dio fin dall'infanzia. San Gregorio Magno scrisse che poté di più perché amò di più. Morì verso il 547."},"02-11":{"en":"In 1858 the Virgin Mary appeared eighteen times to Bernadette Soubirous at Lourdes and said, \"I am the Immaculate Conception.\" It is also the World Day of the Sick.","es":"En 1858 la Virgen María se apareció dieciocho veces a Bernadette Soubirous en Lourdes y dijo: \"Yo soy la Inmaculada Concepción\". Es también la Jornada Mundial del Enfermo.","pt":"Em 1858 a Virgem Maria apareceu dezoito vezes a Bernadette Soubirous em Lourdes e disse: \"Eu sou a Imaculada Conceição\". É também o Dia Mundial do Enfermo.","it":"Nel 1858 la Vergine Maria apparve diciotto volte a Bernadette Soubirous a Lourdes e disse: \"Io sono l'Immacolata Concezione\". È anche la Giornata Mondiale del Malato."},"02-14":{"en":"Brothers from Thessalonica who brought the Gospel to the Slavic peoples in the ninth century and created an alphabet for their language. Co-patrons of Europe.","es":"Hermanos de Tesalónica que llevaron el Evangelio a los pueblos eslavos en el siglo IX y crearon un alfabeto para su lengua. Copatronos de Europa.","pt":"Irmãos de Tessalônica que levaram o Evangelho aos povos eslavos no século IX e criaram um alfabeto para a sua língua. Copadroeiros da Europa.","it":"Fratelli di Tessalonica che portarono il Vangelo ai popoli slavi nel IX secolo e crearono un alfabeto per la loro lingua. Compatroni d'Europa."},"02-17":{"en":"Seven merchants of Florence who left everything around 1233 to live in prayer and penance, and founded the Order of the Servants of Mary.","es":"Siete comerciantes de Florencia que, hacia 1233, lo dejaron todo para vivir en oración y penitencia, y fundaron la Orden de los Siervos de María.","pt":"Sete comerciantes de Florença que, por volta de 1233, deixaram tudo para viver em oração e penitência, e fundaram a Ordem dos Servos de Maria.","it":"Sette mercanti di Firenze che, verso il 1233, lasciarono tutto per vivere in preghiera e penitenza, e fondarono l'Ordine dei Servi di Maria."},"02-21":{"en":"Benedictine monk, cardinal and Doctor of the Church, who called the clergy to holiness and reform. He died in 1072.","es":"Monje benedictino, cardenal y Doctor de la Iglesia, que llamó al clero a la santidad y a la reforma. Murió en 1072.","pt":"Monge beneditino, cardeal e Doutor da Igreja, que chamou o clero à santidade e à reforma. Morreu em 1072.","it":"Monaco benedettino, cardinale e Dottore della Chiesa, che chiamò il clero alla santità e alla riforma. Morì nel 1072."},"02-22":{"en":"The Church celebrates the mission Christ entrusted to Peter: to strengthen his brothers in the faith. The chair is the sign of the teaching office of the Bishop of Rome.","es":"La Iglesia celebra la misión que Cristo confió a Pedro: confirmar a sus hermanos en la fe. La cátedra es el signo del magisterio del Obispo de Roma.","pt":"A Igreja celebra a missão que Cristo confiou a Pedro: confirmar os irmãos na fé. A cátedra é o sinal do magistério do Bispo de Roma.","it":"La Chiesa celebra la missione che Cristo affidò a Pietro: confermare i fratelli nella fede. La cattedra è il segno del magistero del Vescovo di Roma."},"02-23":{"en":"Bishop of Smyrna and disciple of the Apostle John, burned at the stake around 155. \"Eighty-six years I have served him,\" he said; \"how can I blaspheme my King?\"","es":"Obispo de Esmirna y discípulo del apóstol Juan, quemado vivo hacia el año 155. \"Ochenta y seis años lo he servido\", dijo; \"¿cómo puedo blasfemar de mi Rey?\".","pt":"Bispo de Esmirna e discípulo do apóstolo João, queimado vivo por volta de 155. \"Há oitenta e seis anos eu o sirvo\", disse; \"como posso blasfemar contra o meu Rei?\".","it":"Vescovo di Smirne e discepolo dell'apostolo Giovanni, arso vivo verso il 155. \"Da ottantasei anni lo servo\", disse; \"come posso bestemmiare il mio Re?\"."},"02-27":{"en":"Armenian monk and poet, author of the Book of Lamentations, a profound dialogue of the soul with God. He died around 1003 and was declared Doctor of the Church in 2015.","es":"Monje y poeta armenio, autor del Libro de las Lamentaciones, profundo diálogo del alma con Dios. Murió hacia el año 1003 y fue declarado Doctor de la Iglesia en 2015.","pt":"Monge e poeta armênio, autor do Livro das Lamentações, profundo diálogo da alma com Deus. Morreu por volta de 1003 e foi declarado Doutor da Igreja em 2015.","it":"Monaco e poeta armeno, autore del Libro delle Lamentazioni, profondo dialogo dell'anima con Dio. Morì verso il 1003 e fu proclamato Dottore della Chiesa nel 2015."},"03-03":{"en":"Philadelphia heiress who gave her fortune and her life to serve Native and Black Americans, founding the Sisters of the Blessed Sacrament and Xavier University of Louisiana. She died in 1955.","es":"Heredera de Filadelfia que entregó su fortuna y su vida al servicio de los indígenas y afroamericanos, fundando las Hermanas del Santísimo Sacramento y la Universidad Xavier de Luisiana. Murió en 1955.","pt":"Herdeira de Filadélfia que deu sua fortuna e sua vida a serviço dos indígenas e afro-americanos, fundando as Irmãs do Santíssimo Sacramento e a Universidade Xavier da Louisiana. Morreu em 1955.","it":"Ereditiera di Filadelfia che donò il suo patrimonio e la sua vita al servizio dei nativi e degli afroamericani, fondando le Suore del Santissimo Sacramento e la Xavier University of Louisiana. Morì nel 1955."},"03-04":{"en":"Prince of Poland who lived in purity and prayer at the royal court and cared for the poor. He died in 1484 and is patron of Poland and Lithuania.","es":"Príncipe de Polonia que vivió en pureza y oración en la corte real y cuidó de los pobres. Murió en 1484 y es patrono de Polonia y Lituania.","pt":"Príncipe da Polônia que viveu em pureza e oração na corte real e cuidou dos pobres. Morreu em 1484 e é padroeiro da Polônia e da Lituânia.","it":"Principe di Polonia che visse nella purezza e nella preghiera alla corte reale e si prese cura dei poveri. Morì nel 1484 ed è patrono della Polonia e della Lituania."},"03-07":{"en":"A young noblewoman and her servant, both mothers, martyred together at Carthage in 203. Perpetua's own prison diary has come down to us.","es":"Una joven noble y su sierva, ambas madres, martirizadas juntas en Cartago en el año 203. Se conserva el diario que Perpetua escribió en la cárcel.","pt":"Uma jovem nobre e sua serva, ambas mães, martirizadas juntas em Cartago em 203. Conserva-se o diário que Perpétua escreveu na prisão.","it":"Una giovane nobile e la sua serva, entrambe madri, martirizzate insieme a Cartagine nel 203. Ci è giunto il diario che Perpetua scrisse in carcere."},"03-08":{"en":"A Portuguese soldier and shepherd whose conversion led him to care for the sick and the poor in Granada. Founder of the Brothers Hospitallers, he died in 1550.","es":"Soldado y pastor portugués cuya conversión lo llevó a cuidar de los enfermos y los pobres en Granada. Fundador de los Hermanos Hospitalarios, murió en 1550.","pt":"Soldado e pastor português cuja conversão o levou a cuidar dos doentes e dos pobres em Granada. Fundador dos Irmãos Hospitaleiros, morreu em 1550.","it":"Soldato e pastore portoghese la cui conversione lo portò ad assistere i malati e i poveri a Granada. Fondatore dei Fatebenefratelli, morì nel 1550."},"03-09":{"en":"A Roman wife and mother who served the poor and the sick of her city and founded a community of Benedictine oblates. She died in 1440.","es":"Esposa y madre romana que sirvió a los pobres y enfermos de su ciudad y fundó una comunidad de oblatas benedictinas. Murió en 1440.","pt":"Esposa e mãe romana que serviu os pobres e os doentes de sua cidade e fundou uma comunidade de oblatas beneditinas. Morreu em 1440.","it":"Sposa e madre romana che servì i poveri e i malati della sua città e fondò una comunità di oblate benedettine. Morì nel 1440."},"03-17":{"en":"Taken to Ireland as a slave in his youth, he escaped, became a priest and returned as bishop to bring the Gospel to the Irish in the fifth century.","es":"Llevado a Irlanda como esclavo en su juventud, escapó, se hizo sacerdote y volvió como obispo para llevar el Evangelio a los irlandeses en el siglo V.","pt":"Levado à Irlanda como escravo na juventude, fugiu, tornou-se sacerdote e voltou como bispo para levar o Evangelho aos irlandeses no século V.","it":"Portato in Irlanda come schiavo in gioventù, fuggì, divenne sacerdote e tornò come vescovo per portare il Vangelo agli irlandesi nel V secolo."},"03-18":{"en":"Bishop of Jerusalem and Doctor of the Church, whose catechetical lectures to those preparing for Baptism still teach the faith. He died in 386.","es":"Obispo de Jerusalén y Doctor de la Iglesia, cuyas catequesis a quienes se preparaban para el Bautismo siguen enseñando la fe. Murió en el año 386.","pt":"Bispo de Jerusalém e Doutor da Igreja, cujas catequeses aos que se preparavam para o Batismo continuam a ensinar a fé. Morreu em 386.","it":"Vescovo di Gerusalemme e Dottore della Chiesa, le cui catechesi a coloro che si preparavano al Battesimo insegnano ancora la fede. Morì nel 386."},"03-19":{"en":"Spouse of the Virgin Mary and guardian of the Redeemer, a just man who received the word of God in silence and obedience. Patron of the universal Church.","es":"Esposo de la Virgen María y custodio del Redentor, hombre justo que acogió la palabra de Dios en silencio y obediencia. Patrono de la Iglesia universal.","pt":"Esposo da Virgem Maria e guardião do Redentor, homem justo que acolheu a palavra de Deus em silêncio e obediência. Padroeiro da Igreja universal.","it":"Sposo della Vergine Maria e custode del Redentore, uomo giusto che accolse la parola di Dio nel silenzio e nell'obbedienza. Patrono della Chiesa universale."},"03-23":{"en":"A Spanish lawyer who became Archbishop of Lima. He traveled his vast diocese on foot, defended the native peoples and founded a seminary according to the Council of Trent. He died in 1606.","es":"Abogado español que llegó a ser arzobispo de Lima. Recorrió a pie su inmensa diócesis, defendió a los pueblos indígenas y fundó un seminario según el Concilio de Trento. Murió en 1606.","pt":"Advogado espanhol que se tornou arcebispo de Lima. Percorreu a pé sua imensa diocese, defendeu os povos indígenas e fundou um seminário segundo o Concílio de Trento. Morreu em 1606.","it":"Giurista spagnolo divenuto arcivescovo di Lima. Percorse a piedi la sua immensa diocesi, difese i popoli indigeni e fondò un seminario secondo il Concilio di Trento. Morì nel 1606."},"03-25":{"en":"The angel Gabriel announces to Mary that she will conceive the Son of God. Her \"yes\" opens the mystery of the Incarnation: the Word became flesh.","es":"El ángel Gabriel anuncia a María que concebirá al Hijo de Dios. Su \"sí\" abre el misterio de la Encarnación: el Verbo se hizo carne.","pt":"O anjo Gabriel anuncia a Maria que ela conceberá o Filho de Deus. Seu \"sim\" abre o mistério da Encarnação: o Verbo se fez carne.","it":"L'angelo Gabriele annuncia a Maria che concepirà il Figlio di Dio. Il suo \"sì\" apre il mistero dell'Incarnazione: il Verbo si fece carne."},"04-02":{"en":"A hermit of Calabria who founded the Order of Minims, devoted to humility, penance and charity. He died in 1507.","es":"Ermitaño de Calabria que fundó la Orden de los Mínimos, dedicada a la humildad, la penitencia y la caridad. Murió en 1507.","pt":"Eremita da Calábria que fundou a Ordem dos Mínimos, dedicada à humildade, à penitência e à caridade. Morreu em 1507.","it":"Eremita calabrese che fondò l'Ordine dei Minimi, dedito all'umiltà, alla penitenza e alla carità. Morì nel 1507."},"04-04":{"en":"Bishop of Seville and Doctor of the Church, whose learning preserved the knowledge of the ancient world for the ages to come. He died in 636.","es":"Obispo de Sevilla y Doctor de la Iglesia, cuya sabiduría conservó el saber del mundo antiguo para los siglos venideros. Murió en el año 636.","pt":"Bispo de Sevilha e Doutor da Igreja, cuja sabedoria conservou o saber do mundo antigo para os séculos futuros. Morreu em 636.","it":"Vescovo di Siviglia e Dottore della Chiesa, la cui sapienza custodì il sapere del mondo antico per i secoli futuri. Morì nel 636."},"04-05":{"en":"Spanish Dominican and tireless preacher who traveled across Europe calling for conversion and worked for the unity of the Church. He died in 1419.","es":"Dominico español e incansable predicador que recorrió Europa llamando a la conversión y trabajó por la unidad de la Iglesia. Murió en 1419.","pt":"Dominicano espanhol e pregador incansável, que percorreu a Europa chamando à conversão e trabalhou pela unidade da Igreja. Morreu em 1419.","it":"Domenicano spagnolo e predicatore instancabile, che percorse l'Europa chiamando alla conversione e lavorò per l'unità della Chiesa. Morì nel 1419."},"04-07":{"en":"French priest who founded the Brothers of the Christian Schools and renewed education for the poor. He died in 1719 and is patron of teachers.","es":"Sacerdote francés que fundó los Hermanos de las Escuelas Cristianas y renovó la educación de los pobres. Murió en 1719 y es patrono de los educadores.","pt":"Sacerdote francês que fundou os Irmãos das Escolas Cristãs e renovou a educação dos pobres. Morreu em 1719 e é padroeiro dos educadores.","it":"Sacerdote francese che fondò i Fratelli delle Scuole Cristiane e rinnovò l'educazione dei poveri. Morì nel 1719 ed è patrono degli educatori."},"04-11":{"en":"Bishop of Kraków, killed in 1079 while celebrating Mass, after rebuking the king. Patron of Poland.","es":"Obispo de Cracovia, asesinado en 1079 mientras celebraba la Misa, tras haber reprendido al rey. Patrono de Polonia.","pt":"Bispo de Cracóvia, assassinado em 1079 enquanto celebrava a Missa, depois de repreender o rei. Padroeiro da Polônia.","it":"Vescovo di Cracovia, ucciso nel 1079 mentre celebrava la Messa, dopo aver rimproverato il re. Patrono della Polonia."},"04-13":{"en":"Pope who defended the full humanity of Christ against the emperor; arrested and exiled to Crimea, he died there in 655, the last pope venerated as a martyr.","es":"Papa que defendió la plena humanidad de Cristo frente al emperador; arrestado y desterrado a Crimea, murió allí en el año 655, el último papa venerado como mártir.","pt":"Papa que defendeu a plena humanidade de Cristo diante do imperador; preso e exilado na Crimeia, morreu ali em 655, o último papa venerado como mártir.","it":"Papa che difese la piena umanità di Cristo davanti all'imperatore; arrestato ed esiliato in Crimea, vi morì nel 655, ultimo papa venerato come martire."},"04-21":{"en":"Italian Benedictine, Archbishop of Canterbury and Doctor of the Church, who described theology as \"faith seeking understanding.\" He died in 1109.","es":"Benedictino italiano, arzobispo de Canterbury y Doctor de la Iglesia, que describió la teología como \"la fe que busca entender\". Murió en 1109.","pt":"Beneditino italiano, arcebispo de Cantuária e Doutor da Igreja, que descreveu a teologia como \"a fé que busca compreender\". Morreu em 1109.","it":"Benedettino italiano, arcivescovo di Canterbury e Dottore della Chiesa, che descrisse la teologia come \"la fede che cerca di comprendere\". Morì nel 1109."},"04-23":{"en":"George, a soldier martyred in the East around 303, is patron of England. Adalbert, bishop of Prague, was martyred in 997 while bringing the Gospel to the Prussians.","es":"Jorge, soldado martirizado en Oriente hacia el año 303, es patrono de Inglaterra. Adalberto, obispo de Praga, fue martirizado en el 997 mientras llevaba el Evangelio a los prusianos.","pt":"Jorge, soldado martirizado no Oriente por volta de 303, é padroeiro da Inglaterra. Adalberto, bispo de Praga, foi martirizado em 997 enquanto levava o Evangelho aos prussianos.","it":"Giorgio, soldato martirizzato in Oriente verso il 303, è patrono dell'Inghilterra. Adalberto, vescovo di Praga, fu martirizzato nel 997 mentre portava il Vangelo ai prussiani."},"04-24":{"en":"A German lawyer who became a Capuchin friar; he was martyred in Switzerland in 1622 while preaching the faith.","es":"Abogado alemán que se hizo fraile capuchino; fue martirizado en Suiza en 1622 mientras predicaba la fe.","pt":"Advogado alemão que se tornou frade capuchinho; foi martirizado na Suíça em 1622 enquanto pregava a fé.","it":"Giurista tedesco divenuto frate cappuccino; fu martirizzato in Svizzera nel 1622 mentre predicava la fede."},"04-25":{"en":"Companion of Peter and Paul and author of the second Gospel, which begins, \"The beginning of the Gospel of Jesus Christ, the Son of God.\" Tradition holds that he founded the Church of Alexandria.","es":"Compañero de Pedro y de Pablo y autor del segundo Evangelio, que comienza: \"Comienzo del Evangelio de Jesucristo, Hijo de Dios\". Según la tradición, fundó la Iglesia de Alejandría.","pt":"Companheiro de Pedro e de Paulo e autor do segundo Evangelho, que começa: \"Princípio do Evangelho de Jesus Cristo, Filho de Deus\". Segundo a tradição, fundou a Igreja de Alexandria.","it":"Compagno di Pietro e di Paolo e autore del secondo Vangelo, che comincia: \"Inizio del Vangelo di Gesù Cristo, Figlio di Dio\". Secondo la tradizione, fondò la Chiesa di Alessandria."},"04-28":{"en":"Peter Chanel, a Marist priest, was martyred on the Pacific island of Futuna in 1841. Louis de Montfort, French missionary who died in 1716, taught total consecration to Jesus through Mary.","es":"Pedro Chanel, sacerdote marista, fue martirizado en la isla de Futuna, en el Pacífico, en 1841. Luis María Grignion de Montfort, misionero francés que murió en 1716, enseñó la consagración total a Jesús por María.","pt":"Pedro Chanel, sacerdote marista, foi martirizado na ilha de Futuna, no Pacífico, em 1841. Luís Maria Grignion de Montfort, missionário francês que morreu em 1716, ensinou a consagração total a Jesus por Maria.","it":"Pietro Chanel, sacerdote marista, fu martirizzato sull'isola di Futuna, nel Pacifico, nel 1841. Luigi Maria Grignion de Montfort, missionario francese morto nel 1716, insegnò la consacrazione totale a Gesù per mezzo di Maria."},"04-29":{"en":"Dominican of Siena, mystic and Doctor of the Church, who urged the pope to return from Avignon to Rome. She died in 1380 and is co-patron of Europe.","es":"Dominica de Siena, mística y Doctora de la Iglesia, que instó al papa a volver de Aviñón a Roma. Murió en 1380 y es copatrona de Europa.","pt":"Dominicana de Siena, mística e Doutora da Igreja, que exortou o papa a voltar de Avignon para Roma. Morreu em 1380 e é copadroeira da Europa.","it":"Domenicana di Siena, mistica e Dottore della Chiesa, che esortò il papa a tornare da Avignone a Roma. Morì nel 1380 ed è compatrona d'Europa."},"04-30":{"en":"Dominican pope from 1566 to 1572 who put the Council of Trent into effect, publishing the Roman Catechism, Breviary and Missal.","es":"Papa dominico de 1566 a 1572 que puso en práctica el Concilio de Trento, publicando el Catecismo Romano, el Breviario y el Misal.","pt":"Papa dominicano de 1566 a 1572 que pôs em prática o Concílio de Trento, publicando o Catecismo Romano, o Breviário e o Missal.","it":"Papa domenicano dal 1566 al 1572 che attuò il Concilio di Trento, pubblicando il Catechismo Romano, il Breviario e il Messale."},"05-01":{"en":"Instituted by Pius XII in 1955, this memorial presents Saint Joseph, the carpenter of Nazareth, as model and patron of all who work.","es":"Instituida por Pío XII en 1955, esta memoria presenta a san José, el carpintero de Nazaret, como modelo y patrono de todos los trabajadores.","pt":"Instituída por Pio XII em 1955, esta memória apresenta São José, o carpinteiro de Nazaré, como modelo e padroeiro de todos os trabalhadores.","it":"Istituita da Pio XII nel 1955, questa memoria presenta san Giuseppe, il carpentiere di Nazaret, come modello e patrono di tutti i lavoratori."},"05-02":{"en":"Bishop of Alexandria, exiled five times for defending the faith of Nicaea that the Son is one in being with the Father. He died in 373 and is a Doctor of the Church.","es":"Obispo de Alejandría, desterrado cinco veces por defender la fe de Nicea: el Hijo es consustancial al Padre. Murió en el año 373 y es Doctor de la Iglesia.","pt":"Bispo de Alexandria, exilado cinco vezes por defender a fé de Niceia: o Filho é consubstancial ao Pai. Morreu em 373 e é Doutor da Igreja.","it":"Vescovo di Alessandria, esiliato cinque volte per aver difeso la fede di Nicea: il Figlio è consostanziale al Padre. Morì nel 373 ed è Dottore della Chiesa."},"05-03":{"en":"Two of the Twelve. Philip asked, \"Lord, show us the Father.\" James, son of Alphaeus, is traditionally identified with James, the leader of the Church in Jerusalem.","es":"Dos de los Doce. Felipe pidió: \"Señor, muéstranos al Padre\". Santiago, hijo de Alfeo, es identificado por la tradición con Santiago, guía de la Iglesia de Jerusalén.","pt":"Dois dos Doze. Filipe pediu: \"Senhor, mostra-nos o Pai\". Tiago, filho de Alfeu, é identificado pela tradição com Tiago, guia da Igreja de Jerusalém.","it":"Due dei Dodici. Filippo chiese: \"Signore, mostraci il Padre\". Giacomo, figlio di Alfeo, è identificato dalla tradizione con Giacomo, guida della Chiesa di Gerusalemme."},"05-10":{"en":"Damien of Molokai, a Belgian priest, served those with leprosy at Kalaupapa until he died of the disease in 1889. John of Ávila, Spanish priest and Doctor of the Church, is patron of the Spanish diocesan clergy.","es":"Damián de Molokai, sacerdote belga, sirvió a los enfermos de lepra en Kalaupapa hasta morir de la enfermedad en 1889. Juan de Ávila, sacerdote español y Doctor de la Iglesia, es patrono del clero diocesano de España.","pt":"Damião de Molokai, sacerdote belga, serviu os doentes de lepra em Kalaupapa até morrer da doença em 1889. João de Ávila, sacerdote espanhol e Doutor da Igreja, é padroeiro do clero diocesano da Espanha.","it":"Damiano di Molokai, sacerdote belga, servì i malati di lebbra a Kalaupapa fino a morire della malattia nel 1889. Giovanni d'Avila, sacerdote spagnolo e Dottore della Chiesa, è patrono del clero diocesano di Spagna."},"05-12":{"en":"Nereus and Achilleus, Roman soldiers who laid down their arms for Christ, and Pancras, a boy of fourteen, were martyred in Rome in the early fourth century.","es":"Nereo y Aquiles, soldados romanos que depusieron las armas por Cristo, y Pancracio, un muchacho de catorce años, fueron martirizados en Roma a comienzos del siglo IV.","pt":"Nereu e Aquiles, soldados romanos que depuseram as armas por Cristo, e Pancrácio, um menino de catorze anos, foram martirizados em Roma no início do século IV.","it":"Nereo e Achilleo, soldati romani che deposero le armi per Cristo, e Pancrazio, un ragazzo di quattordici anni, furono martirizzati a Roma all'inizio del IV secolo."},"05-13":{"en":"In 1917 the Virgin Mary appeared to three shepherd children at Fatima, Portugal, calling for the Rosary, penance and conversion.","es":"En 1917 la Virgen María se apareció a tres pastorcitos en Fátima, Portugal, pidiendo el Rosario, la penitencia y la conversión.","pt":"Em 1917 a Virgem Maria apareceu a três pastorinhos em Fátima, Portugal, pedindo o Rosário, a penitência e a conversão.","it":"Nel 1917 la Vergine Maria apparve a tre pastorelli a Fatima, in Portogallo, chiedendo il Rosario, la penitenza e la conversione."},"05-14":{"en":"Chosen by lot to take the place of Judas among the Twelve, as a witness of the Resurrection of the Lord.","es":"Elegido por sorteo para ocupar el lugar de Judas entre los Doce, como testigo de la Resurrección del Señor.","pt":"Escolhido por sorteio para ocupar o lugar de Judas entre os Doze, como testemunha da Ressurreição do Senhor.","it":"Scelto a sorte per prendere il posto di Giuda tra i Dodici, come testimone della Risurrezione del Signore."},"05-15":{"en":"A farm worker near Madrid, known with his wife for prayer and generosity to the poor. He died in 1130 and is patron of farmers.","es":"Labrador de los alrededores de Madrid, conocido junto con su esposa por su oración y su generosidad con los pobres. Murió en 1130 y es patrono de los agricultores.","pt":"Lavrador dos arredores de Madri, conhecido com sua esposa pela oração e pela generosidade com os pobres. Morreu em 1130 e é padroeiro dos agricultores.","it":"Contadino nei dintorni di Madrid, noto con la moglie per la preghiera e la generosità verso i poveri. Morì nel 1130 ed è patrono degli agricoltori."},"05-18":{"en":"Pope who was imprisoned by the Arian king Theodoric and died in Ravenna in 526.","es":"Papa encarcelado por el rey arriano Teodorico, que murió en Rávena en el año 526.","pt":"Papa aprisionado pelo rei ariano Teodorico, que morreu em Ravena em 526.","it":"Papa imprigionato dal re ariano Teodorico, morto a Ravenna nel 526."},"05-20":{"en":"Franciscan preacher who drew great crowds across Italy and spread devotion to the Holy Name of Jesus. He died in 1444.","es":"Predicador franciscano que atrajo grandes multitudes por toda Italia y difundió la devoción al Santo Nombre de Jesús. Murió en 1444.","pt":"Pregador franciscano que atraiu grandes multidões por toda a Itália e difundiu a devoção ao Santo Nome de Jesus. Morreu em 1444.","it":"Predicatore francescano che attirò grandi folle in tutta Italia e diffuse la devozione al Santo Nome di Gesù. Morì nel 1444."},"05-21":{"en":"A Mexican priest martyred in 1927 with twenty-four companions during the persecution of the Church in Mexico.","es":"Sacerdote mexicano martirizado en 1927 con veinticuatro compañeros durante la persecución de la Iglesia en México.","pt":"Sacerdote mexicano martirizado em 1927 com vinte e quatro companheiros durante a perseguição à Igreja no México.","it":"Sacerdote messicano martirizzato nel 1927 con ventiquattro compagni durante la persecuzione della Chiesa in Messico."},"05-22":{"en":"An Italian wife and mother who bore a hard marriage and great loss with patience, then became an Augustinian nun. She died in 1457 and is invoked as patron of the impossible.","es":"Esposa y madre italiana que soportó con paciencia un matrimonio difícil y grandes pérdidas, y después se hizo monja agustina. Murió en 1457 y es invocada como patrona de lo imposible.","pt":"Esposa e mãe italiana que suportou com paciência um casamento difícil e grandes perdas, e depois se tornou monja agostiniana. Morreu em 1457 e é invocada como padroeira do impossível.","it":"Sposa e madre italiana che sopportò con pazienza un matrimonio difficile e grandi perdite, poi divenne monaca agostiniana. Morì nel 1457 ed è invocata come santa degli impossibili."},"05-25":{"en":"Bede, English monk and Doctor of the Church, father of English history, died in 735. Gregory VII, pope and reformer of the Church, died in 1085. Mary Magdalene de' Pazzi, Carmelite mystic of Florence, died in 1607.","es":"Beda, monje inglés y Doctor de la Iglesia, padre de la historia inglesa, murió en el 735. Gregorio VII, papa y reformador de la Iglesia, murió en 1085. María Magdalena de Pazzi, mística carmelita de Florencia, murió en 1607.","pt":"Beda, monge inglês e Doutor da Igreja, pai da história inglesa, morreu em 735. Gregório VII, papa e reformador da Igreja, morreu em 1085. Maria Madalena de Pazzi, mística carmelita de Florença, morreu em 1607.","it":"Beda, monaco inglese e Dottore della Chiesa, padre della storia inglese, morì nel 735. Gregorio VII, papa e riformatore della Chiesa, morì nel 1085. Maria Maddalena de' Pazzi, mistica carmelitana di Firenze, morì nel 1607."},"05-26":{"en":"The joyful \"Apostle of Rome,\" priest and founder of the Oratory, who drew people to God by holiness and good humor. He died in 1595.","es":"El alegre \"Apóstol de Roma\", sacerdote y fundador del Oratorio, que atraía a las personas a Dios con santidad y buen humor. Murió en 1595.","pt":"O alegre \"Apóstolo de Roma\", sacerdote e fundador do Oratório, que atraía as pessoas a Deus pela santidade e pelo bom humor. Morreu em 1595.","it":"Il gioioso \"Apostolo di Roma\", sacerdote e fondatore dell'Oratorio, che attirava le persone a Dio con la santità e il buon umore. Morì nel 1595."},"05-27":{"en":"Roman monk sent by Pope Gregory the Great in 597 to bring the Gospel to England, and first Archbishop of Canterbury.","es":"Monje romano enviado por el papa Gregorio Magno en el año 597 para llevar el Evangelio a Inglaterra, y primer arzobispo de Canterbury.","pt":"Monge romano enviado pelo papa Gregório Magno em 597 para levar o Evangelho à Inglaterra, e primeiro arcebispo de Cantuária.","it":"Monaco romano inviato da papa Gregorio Magno nel 597 a portare il Vangelo in Inghilterra, e primo arcivescovo di Canterbury."},"05-29":{"en":"Pope from 1963 to 1978, who brought the Second Vatican Council to completion and wrote Humanae Vitae and Evangelii Nuntiandi. Canonized in 2018.","es":"Papa de 1963 a 1978, que llevó a término el Concilio Vaticano II y escribió la Humanae Vitae y la Evangelii Nuntiandi. Canonizado en 2018.","pt":"Papa de 1963 a 1978, que levou a termo o Concílio Vaticano II e escreveu a Humanae Vitae e a Evangelii Nuntiandi. Canonizado em 2018.","it":"Papa dal 1963 al 1978, che portò a compimento il Concilio Vaticano II e scrisse la Humanae Vitae e la Evangelii Nuntiandi. Canonizzato nel 2018."},"05-31":{"en":"Mary hastens to her cousin Elizabeth; the child leaps in Elizabeth's womb, and Mary sings the Magnificat.","es":"María va de prisa a casa de su prima Isabel; el niño salta en el seno de Isabel, y María canta el Magníficat.","pt":"Maria vai depressa à casa de sua prima Isabel; o menino estremece no seio de Isabel, e Maria canta o Magnificat.","it":"Maria si reca in fretta dalla cugina Elisabetta; il bambino sussulta nel grembo di Elisabetta, e Maria canta il Magnificat."},"06-01":{"en":"A philosopher who found in Christ the true philosophy. He defended the faith in his Apologies and was martyred in Rome around 165.","es":"Filósofo que encontró en Cristo la verdadera filosofía. Defendió la fe en sus Apologías y fue martirizado en Roma hacia el año 165.","pt":"Filósofo que encontrou em Cristo a verdadeira filosofia. Defendeu a fé em suas Apologias e foi martirizado em Roma por volta de 165.","it":"Filosofo che trovò in Cristo la vera filosofia. Difese la fede nelle sue Apologie e fu martirizzato a Roma verso il 165."},"06-02":{"en":"A p
