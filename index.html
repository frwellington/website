o.\n\nAs peregrinações ao Panamá, a Gettysburg (Pensilvânia) e depois a Jerusalém foram fundamentais para ouvir o chamado do Senhor na minha vida.\n\nUma palavra que me iluminou de modo especial na busca da minha vocação foi a parábola dos talentos: «Pois a todo aquele que tem será dado, e terá em abundância; mas daquele que não tem, até o que tem lhe será tirado». Estas palavras ajudaram-me a ver que posso ter tudo, se desejar somente a Deus, e que Deus basta!","it":"Sono il secondo di nove fratelli e sono nato in Virginia. Nell'estate del 2017 i miei genitori sono stati inviati come famiglia in missione in Florida e poi hanno ricevuto una missione presso il Seminario Redemptoris Mater di Miami.\n\nTestimone della generosità dei miei genitori e cresciuto accanto ai seminaristi, ho conosciuto da vicino la vita del seminario mentre aiutavo mio padre nei numerosi lavori di costruzione del seminario.\n\nI pellegrinaggi a Panama, a Gettysburg (Pennsylvania) e poi a Gerusalemme sono stati fondamentali per ascoltare la chiamata del Signore nella mia vita.\n\nUna parola che mi ha illuminato in modo particolare nella ricerca della mia vocazione è stata la parabola dei talenti: «Perché a chiunque ha, verrà dato e sarà nell'abbondanza; ma a chi non ha, verrà tolto anche quello che ha». Queste parole mi hanno aiutato a vedere che posso avere tutto, se desidero soltanto Dio, e che Dio basta!"}},{"name":"Christian Ortez","origin":"El Salvador","stage":"Configuration","parish":"Immaculate Conception, Revere","photo":"img:christian","story":{"en":"I am the oldest of four siblings, raised as a Roman Catholic in El Salvador before migrating with my family to Massachusetts. Before entering the seminary, I studied and worked in finance, carefully charting my path to success. However, after a missionary experience on the streets of Harrisburg, PA (where I was sent without food, clothing, or money), I had a firsthand encounter with God's living word and boundless providence. This experience taught me to trust in God rather than in earthly securities. Along the way, many priests invited me to experience the true fraternity of the priesthood, helping me navigate life and remain steadfast in the faith. This journey culminated in a pilgrimage to the Holy Land, where a vocational call confirmed my path. The Lord is now calling me to stay the course toward a vocation here in Boston, which I now call home.","es":"Soy el mayor de cuatro hermanos y fui educado como católico en El Salvador antes de emigrar con mi familia a Massachusetts. Antes de entrar en el seminario estudié y trabajé en finanzas, trazando cuidadosamente mi camino hacia el éxito. Sin embargo, tras una experiencia misionera por las calles de Harrisburg (Pensilvania), adonde fui enviado sin comida, sin ropa y sin dinero, tuve un encuentro directo con la Palabra viva de Dios y con su providencia sin límites. Esta experiencia me enseñó a confiar en Dios y no en las seguridades de este mundo. A lo largo del camino, muchos sacerdotes me invitaron a experimentar la verdadera fraternidad del sacerdocio, ayudándome a orientarme en la vida y a permanecer firme en la fe. Este recorrido culminó en una peregrinación a Tierra Santa, donde una llamada vocacional confirmó mi camino. Ahora el Señor me llama a perseverar en una vocación aquí en Boston, que hoy considero mi hogar.","pt":"Sou o mais velho de quatro irmãos e fui criado como católico em El Salvador antes de emigrar com a minha família para Massachusetts. Antes de entrar no seminário, estudei e trabalhei na área de finanças, traçando cuidadosamente o meu caminho para o sucesso. Porém, depois de uma experiência missionária pelas ruas de Harrisburg, na Pensilvânia (para onde fui enviado sem comida, sem roupa e sem dinheiro), tive um encontro direto com a Palavra viva de Deus e com a Sua providência sem limites. Esta experiência ensinou-me a confiar em Deus, e não nas seguranças deste mundo. Ao longo do caminho, muitos sacerdotes convidaram-me a experimentar a verdadeira fraternidade do sacerdócio, ajudando-me a orientar a vida e a permanecer firme na fé. Este percurso culminou numa peregrinação à Terra Santa, onde um chamado vocacional confirmou o meu caminho. Agora o Senhor chama-me a perseverar numa vocação aqui em Boston, que hoje considero a minha casa.","it":"Sono il maggiore di quattro fratelli e sono cresciuto da cattolico in El Salvador prima di emigrare con la mia famiglia in Massachusetts. Prima di entrare in seminario ho studiato e lavorato nel settore finanziario, tracciando con cura la mia strada verso il successo. Tuttavia, dopo un'esperienza missionaria per le strade di Harrisburg, in Pennsylvania (dove sono stato inviato senza cibo, senza vestiti e senza denaro), ho fatto un incontro diretto con la Parola viva di Dio e con la sua provvidenza senza limiti. Questa esperienza mi ha insegnato a fidarmi di Dio e non delle sicurezze di questo mondo. Lungo il cammino molti sacerdoti mi hanno invitato a sperimentare la vera fraternità del sacerdozio, aiutandomi a orientarmi nella vita e a rimanere saldo nella fede. Questo percorso è culminato in un pellegrinaggio in Terra Santa, dove una chiamata vocazionale ha confermato la mia strada. Ora il Signore mi chiama a perseverare in una vocazione qui a Boston, che oggi considero casa mia."}},{"name":"Juan Cano","origin":"Chicago, Illinois","stage":"Configuration","parish":"St. Joseph, Lynn","photo":"img:juan","story":{"en":"As the third oldest of ten siblings, I grew up surrounded by the Church and immersed in the Neocatechumenal Way, constantly hearing about God. However, even though I never really enjoyed attending church, my parents always insisted I go. This pattern persisted. For years, I felt unengaged and often left without processing or absorbing anything. It wasn't until 2023, when I faced challenges in my life, that I began to listen to God's voice. I saw this especially in how I embraced the WYD pilgrimage to Lisbon. This experience sparked a calling in me and led to a year of discernment about my vocation, which ultimately led me to the seminary.","es":"Siendo el tercero de diez hermanos, crecí rodeado de la Iglesia e inmerso en el Camino Neocatecumenal, escuchando hablar de Dios continuamente. Sin embargo, aunque nunca disfruté realmente de ir a la iglesia, mis padres siempre insistían en que fuera. Esto se repitió durante años: me sentía desconectado y a menudo salía sin haber asimilado nada. No fue hasta 2023, cuando afronté dificultades en mi vida, que comencé a escuchar la voz de Dios. Lo vi especialmente en la manera en que acogí la peregrinación de la JMJ a Lisboa. Esta experiencia despertó en mí una llamada y me llevó a un año de discernimiento sobre mi vocación, que finalmente me condujo al seminario.","pt":"Sendo o terceiro de dez irmãos, cresci rodeado pela Igreja e imerso no Caminho Neocatecumenal, ouvindo falar de Deus constantemente. Contudo, embora nunca tenha gostado muito de ir à igreja, meus pais sempre insistiam para que eu fosse. Isso se repetiu durante anos: eu me sentia distante e muitas vezes saía sem ter assimilado nada. Só em 2023, quando enfrentei dificuldades na minha vida, comecei a escutar a voz de Deus. Vi isso especialmente na forma como acolhi a peregrinação da JMJ a Lisboa. Esta experiência despertou em mim um chamado e levou-me a um ano de discernimento sobre a minha vocação, que finalmente me conduziu ao seminário.","it":"Terzo di dieci fratelli, sono cresciuto immerso nella Chiesa e nel Cammino Neocatecumenale, sentendo parlare di Dio in continuazione. Eppure, anche se andare in chiesa non mi è mai piaciuto davvero, i miei genitori insistevano sempre perché ci andassi. È andata avanti così per anni: mi sentivo distaccato e spesso uscivo senza aver colto nulla. Solo nel 2023, quando ho affrontato delle difficoltà nella mia vita, ho cominciato ad ascoltare la voce di Dio. L'ho visto soprattutto nel modo in cui ho accolto il pellegrinaggio della GMG a Lisbona. Questa esperienza ha fatto nascere in me una chiamata e mi ha portato a un anno di discernimento sulla mia vocazione, che alla fine mi ha condotto in seminario."}},{"name":"Diego Arellano-Ramirez","origin":"Aurora, Colorado","stage":"Discipleship","parish":"Immaculate Conception, Revere","photo":"img:diego","story":{"en":"I was raised in Aurora, Colorado, as the youngest of three siblings in a Mexican family with two older sisters. As the only boy, I grew up in a nurturing environment shaped by an immigrant mindset: excel in school, believing hard work would lead to success.\n\nMy upbringing included attending Catholic school and regularly attending Sunday Mass, mainly because of my mother’s deep faith, which led our family to church each week. However, during my early teenage years, my connection to the church faded. I then focused on soccer, hoping to balance my education while pursuing a career in the sport.\n\nAfter graduating high school, I intended to move to Europe to pursue college and explore opportunities with local soccer clubs. Yet, during World Youth Day in Portugal, I discovered that true fulfillment came from God, leading me to embrace a calling to the priesthood.","es":"Crecí en Aurora, Colorado, como el menor de tres hermanos en una familia mexicana, con dos hermanas mayores. Como único varón, crecí en un ambiente acogedor marcado por la mentalidad del inmigrante: sobresalir en los estudios, con la convicción de que el trabajo duro lleva al éxito.\n\nMi educación incluyó la escuela católica y la Misa dominical frecuente, sobre todo gracias a la profunda fe de mi madre, que llevaba a nuestra familia a la iglesia cada semana. Sin embargo, en mi primera adolescencia mi vínculo con la Iglesia se fue apagando. Me centré entonces en el fútbol, con la esperanza de compaginar los estudios con una carrera deportiva.\n\nAl terminar la escuela secundaria, mi intención era trasladarme a Europa para ir a la universidad y explorar oportunidades con clubes de fútbol locales. Pero durante la Jornada Mundial de la Juventud en Portugal descubrí que la verdadera plenitud viene de Dios, y eso me llevó a acoger la llamada al sacerdocio.","pt":"Cresci em Aurora, no Colorado, como o caçula de três irmãos numa família mexicana, com duas irmãs mais velhas. Sendo o único menino, cresci num ambiente acolhedor marcado pela mentalidade do imigrante: destacar-se nos estudos, acreditando que o trabalho duro leva ao sucesso.\n\nA minha formação incluiu a escola católica e a Missa dominical frequente, sobretudo graças à fé profunda da minha mãe, que levava a nossa família à igreja todas as semanas. No entanto, no início da adolescência, a minha ligação com a Igreja foi enfraquecendo. Concentrei-me então no futebol, esperando conciliar os estudos com uma carreira no esporte.\n\nDepois de terminar o ensino médio, pretendia mudar-me para a Europa para fazer faculdade e explorar oportunidades em clubes de futebol locais. Mas, durante a Jornada Mundial da Juventude em Portugal, descobri que a verdadeira plenitude vem de Deus, o que me levou a acolher o chamado ao sacerdócio.","it":"Sono cresciuto ad Aurora, in Colorado, ultimo di tre figli in una famiglia messicana, con due sorelle maggiori. Unico maschio, sono cresciuto in un ambiente premuroso, segnato dalla mentalità dell'immigrato: eccellere negli studi, nella convinzione che il duro lavoro porti al successo.\n\nLa mia educazione ha incluso la scuola cattolica e la Messa domenicale regolare, soprattutto grazie alla fede profonda di mia madre, che ogni settimana portava la nostra famiglia in chiesa. Nella prima adolescenza, però, il mio legame con la Chiesa si è affievolito. Mi sono allora concentrato sul calcio, sperando di conciliare gli studi con una carriera sportiva.\n\nDopo il diploma intendevo trasferirmi in Europa per frequentare l'università e cercare opportunità con le squadre di calcio locali. Ma durante la Giornata Mondiale della Gioventù in Portogallo ho scoperto che la vera pienezza viene da Dio, e questo mi ha portato ad accogliere la chiamata al sacerdozio."}},{"name":"Angel Velasquez","origin":"San Salvador, El Salvador","stage":"Discipleship","parish":"St. Rose of Lima, Chelsea","photo":"img:angel","story":{"en":"I am the third of four siblings, born in El Salvador. Growing up, I believed my family didn’t love me, which led me to put myself in risky situations. Although raised in a Catholic environment, I never felt a close bond with God. In 2014, I heard about God’s love, but it seemed unclear and distant.\n\nIn 2017, I moved to the United States, believing it was my chance for happiness through money, success, respect, and worldly pleasures. Yet, the more I engaged with the world, the emptier I felt. By 2020, God allowed me to reach rock bottom; even though I had turned away from Him, He “did not abandon me to death.”\n\nIn 2023, I returned to the Church, where God rekindled my experience of His love and gave me the grace to abandon my attachments and travel to Denver, CO, for a mission experience. During the 50th anniversary celebration of the Neocatechumenal Way in the United States, I once again felt the Lord confirm my call to the priesthood.","es":"Soy el tercero de cuatro hermanos y nací en El Salvador. Al crecer, creía que mi familia no me quería, y eso me llevó a ponerme en situaciones de riesgo. Aunque me eduqué en un ambiente católico, nunca sentí un vínculo cercano con Dios. En 2014 oí hablar del amor de Dios, pero me parecía confuso y lejano.\n\nEn 2017 me trasladé a los Estados Unidos, convencido de que era mi oportunidad de ser feliz a través del dinero, el éxito, el respeto y los placeres del mundo. Sin embargo, cuanto más me entregaba al mundo, más vacío me sentía. Hacia 2020, Dios permitió que tocara fondo; aunque yo me había alejado de Él, Él «no me abandonó a la muerte».\n\nEn 2023 volví a la Iglesia, donde Dios reavivó mi experiencia de su amor y me dio la gracia de dejar mis apegos y viajar a Denver (Colorado) para una experiencia de misión. Durante la celebración del 50.º aniversario del Camino Neocatecumenal en los Estados Unidos, sentí una vez más que el Señor confirmaba mi llamada al sacerdocio.","pt":"Sou o terceiro de quatro irmãos e nasci em El Salvador. Ao crescer, acreditava que a minha família não me amava, o que me levou a colocar-me em situações de risco. Embora tenha sido criado num ambiente católico, nunca senti um vínculo próximo com Deus. Em 2014 ouvi falar do amor de Deus, mas ele me parecia confuso e distante.\n\nEm 2017 mudei-me para os Estados Unidos, acreditando que era a minha chance de ser feliz por meio do dinheiro, do sucesso, do respeito e dos prazeres do mundo. Porém, quanto mais me entregava ao mundo, mais vazio me sentia. Em 2020, Deus permitiu que eu chegasse ao fundo do poço; mesmo tendo eu me afastado d'Ele, Ele «não me abandonou à morte».\n\nEm 2023 voltei à Igreja, onde Deus reacendeu em mim a experiência do Seu amor e me deu a graça de deixar os meus apegos e viajar para Denver, no Colorado, para uma experiência de missão. Durante a celebração dos 50 anos do Caminho Neocatecumenal nos Estados Unidos, senti mais uma vez o Senhor confirmar o meu chamado ao sacerdócio.","it":"Sono il terzo di quattro fratelli e sono nato in El Salvador. Crescendo credevo che la mia famiglia non mi amasse, e questo mi ha portato a mettermi in situazioni rischiose. Pur essendo cresciuto in un ambiente cattolico, non ho mai sentito un legame stretto con Dio. Nel 2014 ho sentito parlare dell'amore di Dio, ma mi sembrava confuso e lontano.\n\nNel 2017 mi sono trasferito negli Stati Uniti, convinto che fosse la mia occasione per essere felice attraverso il denaro, il successo, il rispetto e i piaceri del mondo. Eppure, più mi davo al mondo, più mi sentivo vuoto. Nel 2020 Dio ha permesso che toccassi il fondo; anche se mi ero allontanato da Lui, Lui «non mi ha abbandonato alla morte».\n\nNel 2023 sono tornato nella Chiesa, dove Dio ha riacceso in me l'esperienza del suo amore e mi ha dato la grazia di lasciare i miei attaccamenti e partire per Denver, in Colorado, per un'esperienza di missione. Durante la celebrazione del 50° anniversario del Cammino Neocatecumenale negli Stati Uniti ho sentito ancora una volta il Signore confermare la mia chiamata al sacerdozio."}},{"name":"Romeo Moises Saucedo","origin":"Denver, Colorado","stage":"Discipleship","parish":"St. Joseph, Lynn","photo":"img:romeo","story":{"en":"I was born and raised in Denver, Colorado, the second of seven children – so life was rarely quiet and never dull. When my mother converted, our whole family began the adventure of discovering Christ, and that faith took deeper root when we encountered the Neocatechumenal Way. Surrounded by joyful, generous priests, I found myself drawn to their vocation; their witness planted the first seeds of my own call.\n\nAs I grew older, however, that desire dimmed, and my faith faded with it. I rebelled, wandered, and forgot much of what the Lord had already done in my life – but He had not forgotten me. At World Youth Day in Lisbon, Portugal, He called me again. There, I heard Pope Francis say, “Do not be afraid.” Those simple words filled me with new hope and opened my heart once more. They invited me to discern my vocation with courage, gratitude, and joy – and ultimately to offer my life and be formed as a priest for the Church.","es":"Nací y crecí en Denver, Colorado, el segundo de siete hijos, así que la vida rara vez era tranquila y nunca aburrida. Cuando mi madre se convirtió, toda nuestra familia comenzó la aventura de descubrir a Cristo, y esa fe echó raíces más profundas cuando conocimos el Camino Neocatecumenal. Rodeado de sacerdotes alegres y generosos, me sentí atraído por su vocación; su testimonio sembró las primeras semillas de mi propia llamada.\n\nSin embargo, al crecer, ese deseo se fue apagando, y mi fe con él. Me rebelé, anduve perdido y olvidé mucho de lo que el Señor ya había hecho en mi vida, pero Él no me había olvidado. En la Jornada Mundial de la Juventud en Lisboa, Portugal, me llamó de nuevo. Allí escuché al Papa Francisco decir: «No tengáis miedo». Esas palabras sencillas me llenaron de una nueva esperanza y abrieron de nuevo mi corazón. Me invitaron a discernir mi vocación con valentía, gratitud y alegría, y finalmente a ofrecer mi vida y formarme como sacerdote para la Iglesia.","pt":"Nasci e cresci em Denver, no Colorado, o segundo de sete filhos, por isso a vida raramente era tranquila e nunca era monótona. Quando a minha mãe se converteu, toda a nossa família começou a aventura de descobrir Cristo, e essa fé criou raízes mais profundas quando conhecemos o Caminho Neocatecumenal. Rodeado de sacerdotes alegres e generosos, senti-me atraído pela sua vocação; o seu testemunho plantou as primeiras sementes do meu próprio chamado.\n\nNo entanto, ao crescer, esse desejo foi se apagando, e a minha fé com ele. Rebelei-me, andei perdido e esqueci muito do que o Senhor já tinha feito na minha vida, mas Ele não Se esqueceu de mim. Na Jornada Mundial da Juventude em Lisboa, Portugal, Ele chamou-me de novo. Ali ouvi o Papa Francisco dizer: «Não tenhais medo». Essas palavras simples encheram-me de uma nova esperança e abriram outra vez o meu coração. Convidaram-me a discernir a minha vocação com coragem, gratidão e alegria e, por fim, a oferecer a minha vida e a ser formado como sacerdote para a Igreja.","it":"Sono nato e cresciuto a Denver, in Colorado, secondo di sette figli: la vita era raramente tranquilla e mai noiosa. Quando mia madre si è convertita, tutta la nostra famiglia ha iniziato l'avventura di scoprire Cristo, e quella fede ha messo radici più profonde quando abbiamo incontrato il Cammino Neocatecumenale. Circondato da sacerdoti gioiosi e generosi, mi sono sentito attratto dalla loro vocazione; la loro testimonianza ha piantato i primi semi della mia chiamata.\n\nCrescendo, però, quel desiderio si è affievolito, e con esso la mia fede. Mi sono ribellato, mi sono perso e ho dimenticato molto di ciò che il Signore aveva già fatto nella mia vita, ma Lui non si era dimenticato di me. Alla Giornata Mondiale della Gioventù di Lisbona, in Portogallo, mi ha chiamato di nuovo. Lì ho sentito Papa Francesco dire: «Non abbiate paura». Quelle semplici parole mi hanno riempito di una nuova speranza e hanno riaperto il mio cuore. Mi hanno invitato a discernere la mia vocazione con coraggio, gratitudine e gioia, e infine a offrire la mia vita e a essere formato come sacerdote per la Chiesa."}},{"name":"Christopher Matthew Siverio","origin":"Plainfield, New Jersey","stage":"Discipleship","parish":"Our Lady of the Assumption, East Boston","photo":"img:christopher","story":{"en":"I was born and raised in Plainfield, New Jersey, the youngest of five children. My mother and grandparents planted the seeds of faith, and my older siblings encouraged me to join a Neocatechumenal Way community. There, my relationship with God deepened, and the first stirrings of my vocation began to take shape.\n\nInspired by my older brother, I answered a call to missionary service, spending a year and a half in Philadelphia with a priest as part of an itinerant mission. A further six months of service in Brooklyn became a decisive time of prayer and discernment, awakening in me the desire to belong more fully to Christ and to explore a call to the priesthood.\n\nDuring a pilgrimage to Austria, someone dear to me offered words that stayed with me: “Go—you will lose nothing if you risk for the One who loves you.” Trusting in that love, I entered the seminary, where I continue to discern God’s call through prayer, study, and formation.","es":"Nací y crecí en Plainfield, Nueva Jersey, el menor de cinco hijos. Mi madre y mis abuelos sembraron las semillas de la fe, y mis hermanos mayores me animaron a entrar en una comunidad del Camino Neocatecumenal. Allí mi relación con Dios se hizo más profunda y comenzaron a tomar forma los primeros indicios de mi vocación.\n\nInspirado por mi hermano mayor, respondí a una llamada al servicio misionero y pasé un año y medio en Filadelfia con un sacerdote, como parte de una misión itinerante. Otros seis meses de servicio en Brooklyn se convirtieron en un tiempo decisivo de oración y discernimiento, que despertó en mí el deseo de pertenecer más plenamente a Cristo y de explorar una llamada al sacerdocio.\n\nDurante una peregrinación a Austria, una persona muy querida me dijo unas palabras que se me quedaron grabadas: «Ve; no perderás nada si te arriesgas por Aquel que te ama». Confiando en ese amor, entré en el seminario, donde sigo discerniendo la llamada de Dios a través de la oración, el estudio y la formación.","pt":"Nasci e cresci em Plainfield, Nova Jersey, o caçula de cinco filhos. Minha mãe e meus avós plantaram as sementes da fé, e meus irmãos mais velhos me incentivaram a entrar numa comunidade do Caminho Neocatecumenal. Ali a minha relação com Deus aprofundou-se, e os primeiros sinais da minha vocação começaram a tomar forma.\n\nInspirado pelo meu irmão mais velho, respondi a um chamado ao serviço missionário e passei um ano e meio em Filadélfia com um sacerdote, como parte de uma missão itinerante. Outros seis meses de serviço no Brooklyn tornaram-se um tempo decisivo de oração e discernimento, despertando em mim o desejo de pertencer mais plenamente a Cristo e de explorar um chamado ao sacerdócio.\n\nDurante uma peregrinação à Áustria, alguém muito querido disse-me palavras que ficaram comigo: «Vai; não perderás nada se arriscares por Aquele que te ama». Confiando nesse amor, entrei no seminário, onde continuo a discernir o chamado de Deus por meio da oração, do estudo e da formação.","it":"Sono nato e cresciuto a Plainfield, nel New Jersey, ultimo di cinque figli. Mia madre e i miei nonni hanno seminato in me la fede, e i miei fratelli maggiori mi hanno incoraggiato a entrare in una comunità del Cammino Neocatecumenale. Lì il mio rapporto con Dio si è approfondito e i primi segni della mia vocazione hanno cominciato a prendere forma.\n\nIspirato da mio fratello maggiore, ho risposto a una chiamata al servizio missionario e ho trascorso un anno e mezzo a Filadelfia con un sacerdote, nell'ambito di una missione itinerante. Altri sei mesi di servizio a Brooklyn sono diventati un tempo decisivo di preghiera e di discernimento, che ha risvegliato in me il desiderio di appartenere più pienamente a Cristo e di approfondire una chiamata al sacerdozio.\n\nDurante un pellegrinaggio in Austria, una persona a me cara mi ha detto parole che mi sono rimaste dentro: «Va'; non perderai nulla se rischi per Colui che ti ama». Fidandomi di quell'amore, sono entrato in seminario, dove continuo a discernere la chiamata di Dio attraverso la preghiera, lo studio e la formazione."}},{"name":"Alexis Garcia Acosta","origin":"Aurora, Colorado","stage":"Propaedeutic","parish":"St. Rose of Lima, Chelsea","photo":"img:alexis","story":{"en":"I am the oldest of six siblings, born in Colorado. My parents brought me to the Church, but I did not fully understand why. When I was 12, my dad went to a retreat and realized how important it was to marry within the Church. This event brought me closer to the Church and led me to be baptized. Unfortunately, I lacked understanding of my faith and developed vices that drew me farther from the Church. By the end of eighth grade, I had started using drugs. I also grew up resentful toward my parents. Providentially, in 2021, a pilgrimage to Gettysburg brought me my first encounter with the call to the priesthood. As time went on, I forgot about this calling, but I soon rediscovered it on a pilgrimage to Rome during the 2025 Jubilee year, where I heard that I was not rejected for my sins but called to something greater.","es":"Soy el mayor de seis hermanos y nací en Colorado. Mis padres me llevaron a la Iglesia, pero yo no entendía del todo por qué. Cuando tenía 12 años, mi papá fue a un retiro y comprendió lo importante que era casarse por la Iglesia. Este acontecimiento me acercó a la Iglesia y me llevó a recibir el bautismo. Por desgracia, me faltaba comprensión de mi fe y desarrollé vicios que me alejaron aún más de la Iglesia. Al final del octavo grado ya había empezado a consumir drogas. También crecí con resentimiento hacia mis padres. Providencialmente, en 2021, una peregrinación a Gettysburg me trajo mi primer encuentro con la llamada al sacerdocio. Con el tiempo olvidé esa llamada, pero pronto la redescubrí en una peregrinación a Roma durante el Año Jubilar 2025, donde escuché que no era rechazado por mis pecados, sino llamado a algo más grande.","pt":"Sou o mais velho de seis irmãos e nasci no Colorado. Meus pais me levaram à Igreja, mas eu não entendia bem por quê. Quando eu tinha 12 anos, meu pai foi a um retiro e percebeu como era importante casar-se na Igreja. Esse acontecimento aproximou-me da Igreja e levou-me a ser batizado. Infelizmente, faltava-me compreensão da minha fé, e desenvolvi vícios que me afastaram ainda mais da Igreja. No fim do oitavo ano, eu já tinha começado a usar drogas. Também cresci ressentido com os meus pais. Providencialmente, em 2021, uma peregrinação a Gettysburg trouxe-me o primeiro encontro com o chamado ao sacerdócio. Com o tempo, esqueci esse chamado, mas logo o redescobri numa peregrinação a Roma durante o Ano Jubilar de 2025, onde ouvi que não era rejeitado pelos meus pecados, mas chamado a algo maior.","it":"Sono il maggiore di sei fratelli e sono nato in Colorado. I miei genitori mi portavano in chiesa, ma non capivo fino in fondo perché. Quando avevo 12 anni, mio padre partecipò a un ritiro e comprese quanto fosse importante sposarsi in Chiesa. Questo avvenimento mi avvicinò alla Chiesa e mi portò a ricevere il Battesimo. Purtroppo mi mancava la comprensione della mia fede e sviluppai dei vizi che mi allontanarono ancora di più dalla Chiesa. Alla fine della terza media avevo già cominciato a fare uso di droghe. Sono cresciuto anche con del risentimento verso i miei genitori. Provvidenzialmente, nel 2021, un pellegrinaggio a Gettysburg mi ha portato il primo incontro con la chiamata al sacerdozio. Col tempo ho dimenticato quella chiamata, ma l'ho presto riscoperta in un pellegrinaggio a Roma durante l'Anno Giubilare 2025, dove ho sentito che non ero rifiutato per i miei peccati, ma chiamato a qualcosa di più grande."}},{"name":"Douglas S. Lopez","origin":"Lynn, Massachusetts","stage":"Propaedeutic","parish":"St. Patrick, Brockton","photo":"img:douglas","story":{"en":"I’m Douglas, the second of six siblings, and I grew up in East Boston in a Catholic family. A few years ago, my family joined the Neocatechumenal Way at St. Joseph’s Parish in Lynn. As a teenager, I started asking bigger questions about my life and purpose. A pilgrimage and vocational meeting in New Jersey became a turning point for me. When my pastor asked me to recall a time when I had been truly happy, I immediately thought of past pilgrimages – moments when I felt free to listen to God. Now, I’m grateful to be discerning a call to the priesthood at Redemptoris Mater Seminary.","es":"Soy Douglas, el segundo de seis hermanos, y crecí en East Boston en una familia católica. Hace unos años, mi familia entró en el Camino Neocatecumenal en la parroquia de San José en Lynn. De adolescente empecé a hacerme preguntas más profundas sobre mi vida y su sentido. Una peregrinación y un encuentro vocacional en Nueva Jersey fueron un punto de inflexión para mí. Cuando mi párroco me pidió que recordara un momento en que hubiera sido verdaderamente feliz, pensé de inmediato en peregrinaciones pasadas, momentos en los que me sentía libre para escuchar a Dios. Hoy estoy agradecido de discernir una llamada al sacerdocio en el Seminario Redemptoris Mater.","pt":"Sou o Douglas, o segundo de seis irmãos, e cresci em East Boston numa família católica. Há alguns anos, a minha família entrou no Caminho Neocatecumenal na Paróquia de São José, em Lynn. Na adolescência, comecei a fazer perguntas mais profundas sobre a minha vida e o seu sentido. Uma peregrinação e um encontro vocacional em Nova Jersey foram um ponto de virada para mim. Quando o meu pároco me pediu que recordasse um momento em que tivesse sido verdadeiramente feliz, pensei logo nas peregrinações passadas, momentos em que me sentia livre para escutar a Deus. Hoje sou grato por estar discernindo um chamado ao sacerdócio no Seminário Redemptoris Mater.","it":"Sono Douglas, secondo di sei fratelli, e sono cresciuto a East Boston in una famiglia cattolica. Qualche anno fa la mia famiglia è entrata nel Cammino Neocatecumenale nella parrocchia di San Giuseppe a Lynn. Da adolescente ho cominciato a pormi domande più profonde sulla mia vita e sul suo significato. Un pellegrinaggio e un incontro vocazionale nel New Jersey sono stati per me una svolta. Quando il mio parroco mi ha chiesto di ricordare un momento in cui ero stato davvero felice, ho pensato subito ai pellegrinaggi passati, momenti in cui mi sentivo libero di ascoltare Dio. Oggi sono grato di discernere una chiamata al sacerdozio nel Seminario Redemptoris Mater."}},{"name":"Emmanuel Nieto","origin":"Santa Ana, California","stage":"Propaedeutic","parish":"St. Mary of the Assumption, Lawrence","photo":"img:emmanuel","story":{"en":"I am the fifth of eight siblings and was born in Santa Ana, California. I grew up in the Neocatechumenal Way, with the Church always close to my life. As a middle child, though, I had a little more freedom than some of my brothers and sisters, and I began looking for happiness in the things the world offered. Soon, I discovered that the world left me emptier and with a greater need for fulfillment, not to mention that it brought a lot of suffering. Little by little, I began to realize I was happiest in church, listening to the Word of God, and I began to appreciate my community. In 2022, during a pilgrimage to Jerusalem, I felt the first call to the priesthood. After that, the desire kept growing in my heart. Finally, in 2026, I entered Redemptoris Mater Seminary of Boston.","es":"Soy el quinto de ocho hermanos y nací en Santa Ana, California. Crecí en el Camino Neocatecumenal, con la Iglesia siempre cerca de mi vida. Sin embargo, como hijo de en medio, tenía un poco más de libertad que algunos de mis hermanos, y empecé a buscar la felicidad en lo que ofrecía el mundo. Pronto descubrí que el mundo me dejaba más vacío y con una mayor necesidad de plenitud, además de traerme mucho sufrimiento. Poco a poco empecé a darme cuenta de que era más feliz en la iglesia, escuchando la Palabra de Dios, y comencé a valorar a mi comunidad. En 2022, durante una peregrinación a Jerusalén, sentí la primera llamada al sacerdocio. Desde entonces, ese deseo no dejó de crecer en mi corazón. Finalmente, en 2026, entré en el Seminario Redemptoris Mater de Boston.","pt":"Sou o quinto de oito irmãos e nasci em Santa Ana, na Califórnia. Cresci no Caminho Neocatecumenal, com a Igreja sempre perto da minha vida. Porém, como filho do meio, eu tinha um pouco mais de liberdade do que alguns dos meus irmãos e comecei a procurar a felicidade naquilo que o mundo oferecia. Logo descobri que o mundo me deixava mais vazio e com uma necessidade maior de plenitude, sem contar que me trazia muito sofrimento. Pouco a pouco, comecei a perceber que era mais feliz na igreja, escutando a Palavra de Deus, e passei a valorizar a minha comunidade. Em 2022, durante uma peregrinação a Jerusalém, senti o primeiro chamado ao sacerdócio. Desde então, o desejo não parou de crescer no meu coração. Finalmente, em 2026, entrei no Seminário Redemptoris Mater de Boston.","it":"Sono il quinto di otto fratelli e sono nato a Santa Ana, in California. Sono cresciuto nel Cammino Neocatecumenale, con la Chiesa sempre vicina alla mia vita. Tuttavia, essendo uno dei figli di mezzo, avevo un po' più di libertà rispetto ad alcuni dei miei fratelli, e ho cominciato a cercare la felicità nelle cose che il mondo offriva. Ben presto ho scoperto che il mondo mi lasciava più vuoto e con un bisogno ancora maggiore di pienezza, per non parlare di quanta sofferenza mi portava. A poco a poco ho cominciato a rendermi conto che ero più felice in chiesa, ascoltando la Parola di Dio, e ho iniziato ad apprezzare la mia comunità. Nel 2022, durante un pellegrinaggio a Gerusalemme, ho sentito la prima chiamata al sacerdozio. Da allora il desiderio non ha smesso di crescere nel mio cuore. Infine, nel 2026, sono entrato nel Seminario Redemptoris Mater di Boston."}},{"name":"Esau Flores","origin":"Garden Grove, California","stage":"Propaedeutic","parish":"St. Thomas Aquinas, Jamaica Plain","photo":"img:esau","story":{"en":"My name is Esau Flores, the seventh of eight children, from Orange County, California. Although I grew up in a Catholic family, we did not actively practice the faith. My father introduced me to the Church when I was young, but I began taking my Christian life seriously at seventeen. Years later, in a pilgrimage to Rome, I encountered a love I had never known before, a divine love that moved me to share that same love with others. The possibility of priesthood emerged in the summer of 2024, leading to a year of discernment. Though I had planned to complete my studies and pursue a healthcare career, I kept feeling an emptiness that lifted only when I encountered Christ, especially in prayer and the Eucharist. I entered the seminary seeking to trust the Lord and discern His will, one day at a time.","es":"Me llamo Esaú Flores, el séptimo de ocho hijos, del condado de Orange, California. Aunque crecí en una familia católica, no practicábamos activamente la fe. Mi padre me acercó a la Iglesia cuando era pequeño, pero empecé a tomarme en serio mi vida cristiana a los diecisiete años. Años después, en una peregrinación a Roma, encontré un amor que nunca había conocido, un amor divino que me impulsó a compartir ese mismo amor con los demás. La posibilidad del sacerdocio surgió en el verano de 2024 y me llevó a un año de discernimiento. Aunque había planeado terminar mis estudios y dedicarme a una carrera en el ámbito de la salud, seguía sintiendo un vacío que solo desaparecía cuando me encontraba con Cristo, especialmente en la oración y en la Eucaristía. Entré en el seminario buscando confiar en el Señor y discernir su voluntad, día a día.","pt":"Meu nome é Esaú Flores, o sétimo de oito filhos, do condado de Orange, na Califórnia. Embora tenha crescido numa família católica, não praticávamos ativamente a fé. Meu pai me apresentou à Igreja quando eu era pequeno, mas comecei a levar a sério a minha vida cristã aos dezessete anos. Anos depois, numa peregrinação a Roma, encontrei um amor que nunca tinha conhecido, um amor divino que me levou a partilhar esse mesmo amor com os outros. A possibilidade do sacerdócio surgiu no verão de 2024 e levou-me a um ano de discernimento. Embora tivesse planejado terminar os estudos e seguir carreira na área da saúde, continuava a sentir um vazio que só desaparecia quando me encontrava com Cristo, sobretudo na oração e na Eucaristia. Entrei no seminário procurando confiar no Senhor e discernir a Sua vontade, um dia de cada vez.","it":"Mi chiamo Esaù Flores, settimo di otto figli, della contea di Orange, in California. Pur essendo cresciuto in una famiglia cattolica, non praticavamo attivamente la fede. Mio padre mi ha avvicinato alla Chiesa quando ero piccolo, ma ho cominciato a prendere sul serio la mia vita cristiana a diciassette anni. Anni dopo, durante un pellegrinaggio a Roma, ho incontrato un amore che non avevo mai conosciuto, un amore divino che mi ha spinto a condividere quello stesso amore con gli altri. La possibilità del sacerdozio è emersa nell'estate del 2024 e mi ha portato a un anno di discernimento. Anche se avevo progettato di completare gli studi e intraprendere una carriera in ambito sanitario, continuavo a sentire un vuoto che spariva solo quando incontravo Cristo, soprattutto nella preghiera e nell'Eucaristia. Sono entrato in seminario cercando di fidarmi del Signore e di discernere la sua volontà, un giorno alla volta."}},{"name":"Timothy Patrick Sears","origin":"Springfield, Massachusetts","stage":"Propaedeutic","parish":"St. Thomas Aquinas, Jamaica Plain","photo":"img:timothy","story":{"en":"I am from Springfield, Massachusetts, and am the second of five brothers. My parents raised me in the faith, taking me to Mass, sending me to Catholic school, and to Catholic summer camp. Growing up, I always searched for meaning and happiness, looking for them in my appearance, reputation, accomplishments, relationships, and career. When I finally had many of the things I believed would make me happy, I felt completely empty and out of answers. Then God helped me realize I did not need to earn His love; He loves me exactly as I am, and only He can truly make me happy. This experience made me open to the possibility of giving my life in service to the Church. After discerning with various religious orders and dioceses, I came to recognize that God was calling me to continue my formation through the Neocatechumenal Way.","es":"Soy de Springfield, Massachusetts, y el segundo de cinco hermanos. Mis padres me educaron en la fe: me llevaban a Misa, me enviaron a una escuela católica y a un campamento de verano católico. Al crecer, siempre busqué sentido y felicidad, y los buscaba en mi apariencia, mi reputación, mis logros, mis relaciones y mi carrera. Cuando por fin tuve muchas de las cosas que creía que me harían feliz, me sentí completamente vacío y sin respuestas. Entonces Dios me ayudó a comprender que no tenía que ganarme su amor; Él me ama exactamente como soy, y solo Él puede hacerme verdaderamente feliz. Esta experiencia me abrió a la posibilidad de entregar mi vida al servicio de la Iglesia. Después de discernir con varias órdenes religiosas y diócesis, reconocí que Dios me llamaba a continuar mi formación a través del Camino Neocatecumenal.","pt":"Sou de Springfield, Massachusetts, e o segundo de cinco irmãos. Meus pais me criaram na fé: levavam-me à Missa, mandaram-me para uma escola católica e para um acampamento de verão católico. Ao crescer, sempre procurei sentido e felicidade, buscando-os na minha aparência, na reputação, nas conquistas, nos relacionamentos e na carreira. Quando finalmente tive muitas das coisas que eu acreditava que me fariam feliz, senti-me completamente vazio e sem respostas. Então Deus ajudou-me a perceber que eu não precisava merecer o Seu amor; Ele me ama exatamente como sou, e só Ele pode verdadeiramente me fazer feliz. Esta experiência abriu-me à possibilidade de dar a minha vida ao serviço da Igreja. Depois de discernir com várias ordens religiosas e dioceses, reconheci que Deus me chamava a continuar a minha formação por meio do Caminho Neocatecumenal.","it":"Vengo da Springfield, in Massachusetts, e sono il secondo di cinque fratelli. I miei genitori mi hanno cresciuto nella fede: mi portavano a Messa, mi hanno mandato in una scuola cattolica e a un campo estivo cattolico. Crescendo ho sempre cercato senso e felicità, e li cercavo nel mio aspetto, nella reputazione, nei successi, nelle relazioni e nella carriera. Quando finalmente ho avuto molte delle cose che pensavo mi avrebbero reso felice, mi sono sentito completamente vuoto e senza risposte. Allora Dio mi ha aiutato a capire che non dovevo guadagnarmi il suo amore: Lui mi ama esattamente come sono, e solo Lui può rendermi davvero felice. Questa esperienza mi ha aperto alla possibilità di donare la mia vita al servizio della Chiesa. Dopo un discernimento con diversi ordini religiosi e diocesi, ho riconosciuto che Dio mi chiamava a proseguire la mia formazione attraverso il Cammino Neocatecumenale."}}],"faculty":[{"name":"Very Rev. Antonio F. Medeiros","role":{"en":"Rector","es":"Rector","pt":"Reitor","it":"Rettore"},"photo":"img:rector"},{"name":"Rev. Łukasz Wiśniewski","role":{"en":"Vice Rector","es":"Vicerrector","pt":"Vice-Reitor","it": or a seminarian.","es":"El pan de cada día y libros para un seminarista.","pt":"O pão de cada dia e livros para um seminarista.","it":"Il pane quotidiano e i libri per un seminarista."}},{"amount":"50","title":{"en":"Formation Friend","es":"Amigo de la formación","pt":"Amigo da formação","it":"Amico della formazione"},"text":{"en":"Helps with studies and formation.","es":"Ayuda con los estudios y la formación.","pt":"Ajuda nos estudos e na formação.","it":"Aiuta negli studi e nella formazione."}},{"amount":"100","title":{"en":"Sponsor a Seminarian","es":"Patrocina a un seminarista","pt":"Patrocine um seminarista","it":"Sostieni un seminarista"},"text":{"en":"Accompany one seminarian in his formation.","es":"Acompaña a un seminarista en su formación.","pt":"Acompanhe um seminarista em sua formação.","it":"Accompagna un seminarista nella sua formazione."}},{"amount":"250","title":{"en":"Missionary Patron","es":"Patrono misionero","pt":"Patrono missionário","it":"Patrono missionario"},"text":{"en":"Supports missionary formation and itinerancy.","es":"Sostiene la formación misionera y la itinerancia.","pt":"Sustenta a formação missionária e a itinerância.","it":"Sostiene la formazione missionaria e l'itineranza."}}],"brick":{"text":{"en":"Plant your name in stone, and let it whisper through the ages a prayer of love and faith. Each brick on our Prayer Wall is a lasting legacy for you, your family or a loved one.","es":"Planta tu nombre en la piedra y deja que susurre a través de los siglos una oración de amor y de fe. Cada ladrillo de nuestro Muro de Oración es un legado duradero para ti, tu familia o un ser querido.","pt":"Plante seu nome na pedra e deixe que ele sussurre através dos tempos uma oração de amor e de fé. Cada tijolo do nosso Muro de Oração é um legado duradouro para você, sua família ou um ente querido.","it":"Pianta il tuo nome nella pietra e lascia che sussurri nei secoli una preghiera d'amore e di fede. Ogni mattone del nostro Muro della Preghiera è un'eredità duratura per te, la tua famiglia o una persona cara."},"tiers":[{"name":{"en":"Classic Brick","es":"Ladrillo clásico","pt":"Tijolo clássico","it":"Mattone classico"},"size":"4 × 8 in","price":"—","lines":"3 lines"},{"name":{"en":"Family Brick","es":"Ladrillo familiar","pt":"Tijolo família","it":"Mattone famiglia"},"size":"8 × 8 in","price":"—","lines":"6 lines"},{"name":{"en":"Memorial Stone","es":"Piedra memorial","pt":"Pedra memorial","it":"Pietra commemorativa"},"size":"12 × 12 in","price":"—","lines":"Name + logo"}]},"faq":[{"keys":"address,where,located,direccion,dónde,endereço,onde,visit,visitar,indirizzo,dove,visitare","go":"contact","answer":{"en":"We are at 774 Boylston Street, Chestnut Hill, MA 02467-2501.","es":"Estamos en 774 Boylston Street, Chestnut Hill, MA 02467-2501.","pt":"Estamos na 774 Boylston Street, Chestnut Hill, MA 02467-2501.","it":"Ci troviamo al 774 Boylston Street, Chestnut Hill, MA 02467-2501."}},{"keys":"phone,call,email,contact,teléfono,llamar,correo,contacto,telefone,ligar,contato,telefono,chiamare,contatto,contatti","go":"contact","answer":{"en":"You can call 617-879-9813 or write to seminary@rmsboston.org.","es":"Puede llamar al 617-879-9813 o escribir a seminary@rmsboston.org.","pt":"Você pode ligar para 617-879-9813 ou escrever para seminary@rmsboston.org.","it":"Potete chiamare il 617-879-9813 o scrivere a seminary@rmsboston.org."}},{"keys":"donate,give,giving,donation,venmo,paypal,cash app,text,donar,donación,doar,doação,oferta,donare,donazione,offerta","go":"give","answer":{"en":"You can give online, by Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), text-to-give (857-663-7535, keyword $RMSBOSTON) or by check mailed to the seminary. Redemptoris Mater Seminary is a 501(c)(3); gifts are tax-deductible to the fullest extent of the law.","es":"Puede donar en línea, por Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), mensaje de texto (857-663-7535, palabra $RMSBOSTON) o con un cheque enviado al seminario. El seminario es una organización 501(c)(3); las donaciones son deducibles de impuestos en la medida que permite la ley.","pt":"Você pode doar online, por Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), mensagem de texto (857-663-7535, palavra $RMSBOSTON) ou por cheque enviado ao seminário. O seminário é uma organização 501(c)(3); as doações são dedutíveis de impostos nos termos da lei.","it":"Potete donare online, con Venmo (@RMSBOSTON), Cash App ($RMSBOSTON), via SMS (857-663-7535, parola $RMSBOSTON) o con un assegno inviato al seminario. Il seminario è un ente 501(c)(3); le donazioni sono deducibili nei limiti di legge."}},{"keys":"monthly,recurring,sponsor,mensual,patrocinar,mensal,patrocinar,apadrinhar,mensile,sostenere","go":"sponsor","answer":{"en":"You can sponsor a seminarian with a monthly gift. Choose a level in the “Sponsor a Seminarian” section.","es":"Puede patrocinar a un seminarista con una donación mensual. Elija un nivel en la sección “Patrocina a un seminarista”.","pt":"Você pode patrocinar um seminarista com uma doação mensal. Escolha um nível na seção “Patrocine um seminarista”.","it":"Potete sostenere un seminarista con una donazione mensile. Scegliete un livello nella sezione “Sostieni un seminarista”."}},{"keys":"bequest,will,planned,legacy,testamento,herencia,legado,herança,lascito,eredità,testamento","go":"sponsor","answer":{"en":"For bequests and planned gifts, please contact the Rector of the Seminary.","es":"Para legados y donaciones planificadas, comuníquese con el Rector del Seminario.","pt":"Para legados e doações planejadas, entre em contato com o Reitor do Seminário.","it":"Per lasciti e donazioni pianificate, contattate il Rettore del Seminario."}},{"keys":"brick,prayer wall,ladrillo,muro,tijolo,mattone,muro","go":"brick","answer":{"en":"You can buy a brick for our Prayer Wall — see the options in the Buy a Brick section.","es":"Puede comprar un ladrillo para nuestro Muro de Oración — vea las opciones en la sección Compra un ladrillo.","pt":"Você pode comprar um tijolo para o nosso Muro de Oração — veja as opções na seção Compre um tijolo.","it":"Potete acquistare un mattone per il nostro Muro della Preghiera — vedete le opzioni nella sezione Acquista un mattone."}},{"keys":"gala,dinner,tickets,table,journal,cena,boletos,mesa,jantar,ingressos,biglietti,tavolo,cena","go":"gala","answer":{"en":"The 2027 Gala Dinner date will be announced soon. Tickets will be sold online through TicketSpice.","es":"La fecha de la Cena de Gala 2027 se anunciará pronto. Los boletos se venderán en línea por TicketSpice.","pt":"A data do Jantar de Gala 2027 será anunciada em breve. Os ingressos serão vendidos online pela TicketSpice.","it":"La data della Cena di Gala 2027 sarà annunciata a breve. I biglietti saranno venduti online tramite TicketSpice."}},{"keys":"chapel,capilla,capela,construction,construcción,construção,cappella,costruzione","go":"chapel","answer":{"en":"We are building a new chapel. See the Chapel Project section for progress.","es":"Estamos construyendo una nueva capilla. Vea el avance en la sección Proyecto de la Capilla.","pt":"Estamos construindo uma nova capela. Veja o andamento na seção Projeto da Capela.","it":"Stiamo costruendo una nuova cappella. Vedete l'avanzamento nella sezione Progetto della Cappella."}},{"keys":"neocatechumenal,way,camino,caminho,kiko,cammino","go":"about","answer":{"en":"Our seminarians discover their vocation through the Neocatechumenal Way, which St. John Paul II called “an itinerary of Catholic formation valid for our society and our time.”","es":"Nuestros seminaristas descubren su vocación a través del Camino Neocatecumenal, que San Juan Pablo II llamó “un itinerario de formación católica válido para nuestra sociedad y para nuestro tiempo.”","pt":"Nossos seminaristas descobrem sua vocação por meio do Caminho Neocatecumenal, que São João Paulo II chamou de “um itinerário de formação católica válido para a nossa sociedade e para o nosso tempo.”","it":"I nostri seminaristi scoprono la loro vocazione attraverso il Cammino Neocatecumenale, che San Giovanni Paolo II ha definito “un itinerario di formazione cattolica valido per la nostra società e per i nostri tempi.”"}},{"keys":"history,founded,when,historia,fundado,história,fundação,storia,fondazione","go":"history","answer":{"en":"The seminary opened in September 2005 and was officially erected by Cardinal Seán P. O’Malley, OFM Cap, on March 25, 2006.","es":"El seminario abrió en septiembre de 2005 y fue erigido oficialmente por el Cardenal Seán P. O’Malley, OFM Cap, el 25 de marzo de 2006.","pt":"O seminário abriu em setembro de 2005 e foi erigido oficialmente pelo Cardeal Seán P. O’Malley, OFM Cap, em 25 de março de 2006.","it":"Il seminario è stato aperto nel settembre 2005 ed eretto ufficialmente dal Cardinale Seán P. O’Malley, OFM Cap, il 25 marzo 2006."}},{"keys":"formation,stages,propaedeutic,discipleship,configuration,itinerancy,formación,etapas,formação,formazione,tappe","go":"formation","answer":{"en":"Formation is human, intellectual, spiritual and pastoral, in four stages: Propaedeutic, Discipleship, Configuration and Itinerancy. Seminarians spend three years in missionary formation before ordination.","es":"La formación es humana, intelectual, espiritual y pastoral, en cuatro etapas: Propedéutico, Discipulado, Configuración e Itinerancia. Los seminaristas pasan tres años en formación misionera antes de la ordenación.","pt":"A formação é humana, intelectual, espiritual e pastoral, em quatro etapas: Propedêutico, Discipulado, Configuração e Itinerância. Os seminaristas passam três anos em formação missionária antes da ordenação.","it":"La formazione è umana, intellettuale, spirituale e pastorale, in quattro tappe: Propedeutica, Discepolato, Configurazione e Itineranza. I seminaristi trascorrono tre anni di formazione missionaria prima dell'ordinazione."}},{"keys":"priest,priests,sacerdote,sacerdotes,padre,padres,ordained,sacerdoti,preti,priests,ordained,assigned,assignments,sacerdotes,padres,sacerdoti,preti,ordenados,ordinati","go":"priests","answer":{"en":"Twenty-three priests have been ordained for the Archdiocese of Boston from our Seminary. They serve in Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston and the Metropolitan Tribunal — and on mission in Atlanta, the U.S. Virgin Islands and Samoa. Six missionary priests formed in other Redemptoris Mater seminaries also serve here. See “Our Priests.”","es":"Veintitrés sacerdotes han sido ordenados para la Arquidiócesis de Boston desde nuestro Seminario. Sirven en Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston y el Tribunal Metropolitano — y en misión en Atlanta, las Islas Vírgenes de EE. UU. y Samoa. También sirven aquí seis sacerdotes misioneros formados en otros seminarios Redemptoris Mater. Vea “Nuestros sacerdotes”.","pt":"Vinte e três sacerdotes foram ordenados para a Arquidiocese de Boston a partir do nosso Seminário. Servem em Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston e o Tribunal Metropolitano — e em missão em Atlanta, nas Ilhas Virgens Americanas e em Samoa. Seis sacerdotes missionários formados em outros seminários Redemptoris Mater também servem aqui. Veja “Nossos sacerdotes”.","it":"Ventitré sacerdoti sono stati ordinati per l'Arcidiocesi di Boston dal nostro Seminario. Servono in Massachusetts — Marlborough, Lynn, Lawrence, Methuen, Lowell, Brockton, Waltham, Revere, East Boston, Boston e il Tribunale Metropolitano — e in missione ad Atlanta, nelle Isole Vergini americane e nelle Samoa. Servono qui anche sei sacerdoti missionari formati in altri seminari Redemptoris Mater. Vedi “I nostri sacerdoti”."}},{"keys":"rector,medeiros,faculty,formators,reitor,formadores,rettore,formatori","go":"formHead","answer":{"en":"The Rector is Very Rev. Antonio F. Medeiros; the Vice Rector is Rev. Łukasz Wiśniewski; the Spiritual Director is Rev. Francesco Palombi.","es":"El Rector es el Muy Rvdo. P. Antonio F. Medeiros; el Vicerrector, el Rvdo. P. Łukasz Wiśniewski; el Director Espiritual, el Rvdo. P. Francesco Palombi.","pt":"O Reitor é o Revmo. Pe. Antonio F. Medeiros; o Vice-Reitor, o Pe. Łukasz Wiśniewski; o Diretor Espiritual, o Pe. Francesco Palombi.","it":"Il Rettore è il Rev.mo Don Antonio F. Medeiros; il Vice Rettore è Don Łukasz Wiśniewski; il Direttore Spirituale è Don Francesco Palombi."}},{"keys":"video,videos,youtube,watch,ver,assistir,guardare","go":"media","answer":{"en":"Our videos are in the Multimedia section and on our YouTube channel.","es":"Nuestros videos están en la sección Multimedia y en nuestro canal de YouTube.","pt":"Nossos vídeos estão na seção Multimídia e no nosso canal do YouTube.","it":"I nostri video sono nella sezione Multimedia e sul nostro canale YouTube."}},{"keys":"newsletter,updates,subscribe,boletín,suscribir,boletim,inscrever,notiziario,iscriversi","go":"contact","answer":{"en":"Sign up for Seminary updates at the bottom of the page.","es":"Suscríbase a las noticias del Seminario al final de la página.","pt":"Inscreva-se para receber as notícias do Seminário no final da página.","it":"Iscrivetevi alle notizie del Seminario in fondo alla pagina."}}],"way":{"intro":{"en":"The Neocatechumenal Way is an itinerary of Christian formation lived in small communities within the parish. Born in 1964 among the poor of the shacks of Palomeras Altas in Madrid, through Kiko Argüello and Carmen Hernández, it helps adults rediscover the riches of their Baptism through the Word of God, the Liturgy and community life. Its Statutes were definitively approved by the Holy See in 2008. St. John Paul II recognized it as “an itinerary of Catholic formation valid for our society and our time.”","es":"El Camino Neocatecumenal es un itinerario de formación cristiana que se vive en pequeñas comunidades dentro de la parroquia. Nacido en 1964 entre los pobres de las barracas de Palomeras Altas, en Madrid, a través de Kiko Argüello y Carmen Hernández, ayuda a los adultos a redescubrir la riqueza de su Bautismo mediante la Palabra de Dios, la Liturgia y la vida en comunidad. Sus Estatutos fueron aprobados definitivamente por la Santa Sede en 2008. San Juan Pablo II lo reconoció como “un itinerario de formación católica válido para nuestra sociedad y para nuestro tiempo.”","pt":"O Caminho Neocatecumenal é um itinerário de formação cristã vivido em pequenas comunidades dentro da paróquia. Nascido em 1964 entre os pobres dos barracos de Palomeras Altas, em Madri, por meio de Kiko Argüello e Carmen Hernández, ajuda os adultos a redescobrir a riqueza do seu Batismo pela Palavra de Deus, pela Liturgia e pela vida em comunidade. Seus Estatutos foram aprovados definitivamente pela Santa Sé em 2008. São João Paulo II o reconheceu como “um itinerário de formação católica válido para a nossa sociedade e para o nosso tempo.”","it":"Il Cammino Neocatecumenale è un itinerario di formazione cristiana vissuto in piccole comunità all'interno della parrocchia. Nato nel 1964 tra i poveri delle baracche di Palomeras Altas, a Madrid, attraverso Kiko Argüello e Carmen Hernández, aiuta gli adulti a riscoprire la ricchezza del loro Battesimo mediante la Parola di Dio, la Liturgia e la vita comunitaria. I suoi Statuti sono stati approvati definitivamente dalla Santa Sede nel 2008. San Giovanni Paolo II lo ha riconosciuto come “un itinerario di formazione cattolica valido per la nostra società e per i nostri tempi.”"},"pillars":[{"en":"Word of God","es":"Palabra de Dios","pt":"Palavra de Deus","it":"Parola di Dio"},{"en":"Liturgy","es":"Liturgia","pt":"Liturgia","it":"Liturgia"},{"en":"Community","es":"Comunidad","pt":"Comunidade","it":"Comunità"}],"parishes":[],"art1":"img:art_virgin_kiko","art2":"img:image_2","mailEndpoint":"","v":6},"liturgy":{"ascensionSunday":false,"proxy":"","sources":{"en":{"label":"USCCB — Daily Readings","url":"https://bible.usccb.org/bi
